function paarHtml(a,b,e){
  const A=S.clubs[a], B=S.clubs[b], wa=e&&e.sieger===a, wb_=e&&e.sieger===b;
  const st=x=>x.human>=0?`background:${clubTint(x)};`:'';
  return `<div class="pokal"><span style="text-align:right;${st(A)}" class="${wa?'w':''}">${h(A.name)} <span class="hinweis">${h(L(A).kurzname)}</span></span><b class="m">${e?kurzErg(e):'–:–'}</b><span style="${st(B)}" class="${wb_?'w':''}">${h(B.name)} <span class="hinweis">${h(L(B).kurzname)}</span></span></div>`;
}
function renderWettbewerbe(){
  if(S.format==='liga') return '<div class="hinweis">Im Format „Nur Liga“ gibt es keine Pokale und keine Europapokale. Das Format lässt sich in der Sommerpause im Menü ändern.</div>';
  const c=mc(S.aktiv), eigen=c.land&&S.pokale[c.land]?c.land:landVon(c);
  const keys=[...Object.keys(S.pokale), ...(S.euro?EURO:[])];
  const sel=UI.wb&&keys.includes(UI.wb)?UI.wb:(S.pokale[eigen]?eigen:keys[0]);
  const opt=keys.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${h(S.pokale[k]?S.pokale[k].name:W.euro[k].name)}</option>`).join('');
  let inhalt='';
  if(S.pokale[sel]){
    const P=S.pokale[sel];
    inhalt=`<div class="reihe"><span class="chip">${P.sieger!=null?'Sieger: '+h(S.clubs[P.sieger].name):(P.runden.length?`${P.alive.length} Vereine im Rennen`:'Noch nicht ausgelost')}</span></div>`;
    inhalt+=[...P.runden].reverse().map(R=>{
      const erg=new Map(R.erg.map(e=>[e.h+'-'+e.a,e]));
      const paare=[...R.paare].sort((x,y)=>(istMensch(y[0])||istMensch(y[1]))-(istMensch(x[0])||istMensch(x[1])));
      const zeig=paare.slice(0,UI.alleRunden?999:16);
      return `<details ${R===P.runden[P.runden.length-1]?'open':''}><summary class="lab" style="cursor:pointer;padding:8px 0">${h(R.name)} · ${R.paare.length} Spiele${R.frei.length?` · ${R.frei.length} Freilose`:''}</summary>
        ${zeig.map(([a,b])=>paarHtml(a,b,erg.get(a+'-'+b))).join('')}
        ${paare.length>zeig.length?`<button class="btn klein" data-a="alleRunden" style="margin-top:6px">Alle ${paare.length} Spiele zeigen</button>`:''}
        ${R.frei.length?`<div class="hinweis" style="margin-top:6px">Freilos: ${R.frei.map(id=>h(S.clubs[id].name)).join(', ')}</div>`:''}</details>`; }).join('');
    if(!P.runden.length) inhalt+=`<div class="hinweis">${sel==='vp'?vpText():'Die erste Runde wird am Pokaltermin ausgelost.'}</div>`;
  } else if(S.euro&&S.euro[sel]){
    const E=S.euro[sel];
    inhalt=`<div class="reihe"><span class="chip">${E.sieger!=null?'Sieger: '+h(S.clubs[E.sieger].name):'36 Vereine · Ligaphase mit 8 Spielen'}</span></div>`;
    inhalt+=[...E.ko].reverse().map(K=>{ const erg=new Map(K.erg.map(e=>[e.h+'-'+e.a,e])); return `<details open><summary class="lab" style="cursor:pointer;padding:8px 0">${h(K.name)}</summary>${K.paare.map(([a,b])=>paarHtml(a,b,erg.get(a+'-'+b))).join('')}</details>`; }).join('');
    inhalt+=`<details ${E.ko.length?'':'open'}><summary class="lab" style="cursor:pointer;padding:8px 0">Ligaphase · Tabelle</summary>${euroTabelleHtml(sel)}</details>`;
  }
  return `<div class="sp"><span class="lab">Wettbewerb</span><select data-c="wb">${opt}</select></div>${inhalt}
    ${S.superErg?`<div class="box"><span class="lab">Supercup</span>${S.superErg.map(e=>`<div class="hinweis">${h(e.label)}</div>${paarHtml(e.h,e.a,e)}`).join('')}</div>`:''}`;
}

      return `<div class="zeile" style="background:${i===mi?clubTint(k):'transparent'}">${mgrAva(i,30)}<span class="f1"><b>${h(mg.name)}</b> <span class="hinweis">${h(k.name)}</span><br><span class="m" style="font-size:12px">${titel} Titel · ${E.filter(e=>e.typ==='aufstieg').length} Aufstiege · ${E.filter(e=>e.typ==='wunder').length} Pokalwunder · ${E.filter(e=>e.typ==='jugend').length} Jugendtitel</span></span></div>`; }).join('')}</div>`:'';
  return `<div class="reihe" style="justify-content:space-between;align-items:flex-end"><div><div class="d" style="font-size:34px">Vereinsmuseum</div><span class="hinweis">${h(c.name)} · Chronik seit Saison ${M.seit}</span></div>
      <div class="reihe">${zaehler.map(([t,n])=>`<span class="chip">${n} ${MUS_TYP[t].name}</span>`).join('')}</div></div>
    <div class="box" style="background:#3a2f22;border-color:#1d1f1a"><span class="lab" style="color:#d8cfbd">Trophäenschrank</span>
      ${vitrine?`<div class="vitrine">${vitrine}</div>`:'<div class="hinweis" style="color:#d8cfbd">Noch leer. Meisterschaften, Pokalsiege, Aufstiege, Pokalwunder und Jugendtitel kommen hier von selbst hinein. Pokal antippen zeigt die Details.</div>'}</div>
    <div class="grid2"><div class="box"><span class="lab">Vereinsrekorde</span>${rek}</div>${familie}</div>
    ${S.manager.length>1?duellBoxHtml(mi):''}

    <div class="hinweis erkl">Das Museum sammelt ab dieser Version. Frühere Saisons kennt der Spielstand nicht.</div>`;
}

function duellBoxHtml(mi){
  const gegner=S.manager.map((m,j)=>j).filter(j=>j!==mi);
  const karten=gegner.map(j=>{ const b=duellBilanz(mi,j), n=b.s+b.u+b.n, ich=S.manager[mi].name, er=S.manager[j].name;
    if(!n) return `<div class="zeile">${mgrAva(mi,28)}<span class="m grau">gegen</span>${mgrAva(j,28)}<span class="f1 hinweis">Noch kein Duell mit ${h(er)}.</span></div>`;
    const pc=x=>Math.round(x/n*100), anf=b.s>b.n?`${h(ich)} führt`:b.n>b.s?`${h(er)} führt`:'Ausgeglichen';
    const zeileErg=d=>{ const H=S.manager[d.h].name, A=S.manager[d.a].name;
      return `<div class="zeile" style="min-height:30px;font-size:13px;flex:none"><span class="m grau" style="white-space:nowrap">Saison ${d.saison}</span><span class="f1">${h(H)} – ${h(A)} <span class="hinweis">${h(d.label)}</span></span><b class="m" style="color:${d.e>d.g?'var(--rasen)':d.e<d.g?'var(--rot)':'var(--grau)'}">${d.th}:${d.ta}${d.ie?` ${W.worte.ie} ${d.ie[0]}:${d.ie[1]}`:''}</b></div>`; };
    return `<div class="sp" style="gap:6px;padding:8px 0;border-bottom:1px solid var(--linie)">
      <div class="reihe" style="justify-content:space-between">${mgrAva(mi,32)}<b class="d" style="font-size:26px">${b.s} : ${b.u} : ${b.n}</b>${mgrAva(j,32)}</div>
      <div class="reihe" style="justify-content:space-between;font-size:12px"><b style="color:${mgrFarbe(mi)}">${h(ich)} · ${b.s} ${b.s===1?'Sieg':'Siege'}</b><span class="grau">${b.u} Remis</span><b style="color:${mgrFarbe(j)}">${b.n} ${b.n===1?'Sieg':'Siege'} · ${h(er)}</b></div>
      <div style="flex:none;display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--linie)"><i style="width:${pc(b.s)}%;background:${mgrFarbe(mi)}"></i><i style="width:${pc(b.u)}%;background:#b9b2a3"></i><i style="width:${pc(b.n)}%;background:${mgrFarbe(j)}"></i></div>
      <span class="hinweis">${anf} · ${n} Duell${n>1?'e':''} · Tore ${b.tg}:${b.tgg}${b.hoch?` · Höchster Sieg: ${h(b.hoch.e>b.hoch.g?ich:er)} ${Math.max(b.hoch.e,b.hoch.g)}:${Math.min(b.hoch.e,b.hoch.g)} (Saison ${b.hoch.saison})`:''}</span>
      ${[...b.liste].reverse().slice(0,5).map(zeileErg).join('')}</div>`; }).join('');
  return `<div class="box"><span class="lab">Familienduelle · ${h(S.manager[mi].name)} gegen …</span>${karten}
    <span class="hinweis erkl">Zählt jedes Liga- und Pokalspiel gegeneinander. ${W.worte.elfmeter} zählt als Remis. Erfasst ab dieser Version.</span></div>`;
}

// ---------- Auswertung ----------
function gruppeVon(s){ return s.art==='liga'?W.ligen[s.liga].name:s.label.split(' · ')[0]; }
function renderAuswertung(){
  const Lz=S.letzte, ende=S.phase==='saisonende';
  const meine=S.manager.map((mg,i)=>{ const c=mc(i), sp=Lz.spiele.find(s=>s.h===c.id||s.a===c.id), a=c.abrechnung;
    return `<div class="box" style="border-top:8px solid ${mgrFarbe(i)}">
      <div class="reihe">${mgrAva(i,40)}${wappen(c)}<b class="f1">${h(mg.name)} · ${h(c.name)}</b><span class="m">${L(c).keineLiga?'':'Platz '+platzVon(c)}</span></div>
      ${sp?`<span class="lab">${h(sp.label)}</span><div class="d" style="font-size:30px">${h(S.clubs[sp.h].kurz)} ${sp.th}:${sp.ta} ${h(S.clubs[sp.a].kurz)}</div>${sp.ie?`<span class="m">${W.worte.ie} ${sp.ie[0]}:${sp.ie[1]}</span>`:''}`:'<span class="lab">Spielfrei</span>'}
      <div style="font-size:14px;line-height:1.4">„${h(c.meldung)}“</div>
      ${c.fertigBlick&&c.fertigBlick.length&&a&&a.termin===S.termin?`<span class="lab">Fertig geworden</span>${szZeige(c,c.fertigBlick[0])}`:''}
      ${c.u19Erg&&c.u19Erg.termin===S.termin?`<div class="hinweis">${W.worte.ball} ${h(c.kurz)} U19 ${c.u19Erg.th}:${c.u19Erg.ta} gegen ${h(c.u19Erg.gegner)}${c.u19Erg.sds?` · Spieler des Spiels: ${h(c.u19Erg.sds)}${c.u19Erg.sdsPlus?' (+1 Stärke)':''}`:''}</div>`:''}
      ${a&&a.zeilen.length?`<div>${a.zeilen.map(z=>`<div class="zeile" style="min-height:30px"><span class="f1">${h(z.t)}</span><span class="m ${z.v<0?'rotx':'gruen'}">${z.v<0?'−':'+'}${eur(Math.abs(z.v))}</span></div>`).join('')}</div>`:''}
      <div class="zeile"><b class="f1">Kontostand</b><b class="m">${eur(c.konto)}</b></div>
    </div>`; }).join('');
  const tore=Lz.spiele.filter(s=>s.live).flatMap(s=>s.tore.map(t=>({...t,sp:s}))).sort((a,b)=>a.min-b.min);
  let saison='';
  if(ende){
    const ligen=[...new Set(S.manager.map((m,i)=>mc(i).liga))].filter(i=>!W.ligen[i].keineLiga);
    saison=`<div class="dunkel"><span class="d" style="font-size:34px;color:var(--gold)">Saison ${S.saison} beendet</span><span>Je drei Vereine steigen auf und ab. Im Sommer: Transfers, neue Talente, neue Verträge.</span></div>
      <div class="grid2">${ligen.map(i=>`<div class="box"><span class="lab">Abschluss ${h(W.ligen[i].name)}</span>${tabelleHtml(i,-1)}</div>`).join('')}</div>`;
  }
  const gruppen={}; for(const s of Lz.spiele){ const g=gruppeVon(s); (gruppen[g]=gruppen[g]||[]).push(s); }
  const gNamen=Object.keys(gruppen).sort((a,b)=>(gruppen[b].some(s=>istMensch(s.h)||istMensch(s.a)))-(gruppen[a].some(s=>istMensch(s.h)||istMensch(s.a))));
  return `${saison}
    <div class="reihe" style="justify-content:space-between"><div class="d" style="font-size:34px">${h(Lz.label)}</div><span class="hinweis">Termin ${Lz.termin} · ${Lz.regen?'Regen':'trocken'}</span></div>
    <div class="grid2">${meine}</div>
    ${tore.length?`<div class="box"><span class="lab">Tore des Tages</span>${tore.map(t=>`<div class="zeile" style="min-height:30px"><span class="m grau" style="width:34px">${t.min}'</span><span class="f1">${h(t.txt)}</span></div>`).join('')}</div>`:''}
    <button class="btn ${ende?'rot':'voll'} gross" data-a="weiter">${ende?'Saisonwechsel: Auf- und Abstieg':'Weiter zur Planung'}</button>
    <div class="sp"><span class="lab">Alle Ergebnisse</span>${gNamen.map(g=>{ const l=gruppen[g], mensch=l.some(s=>istMensch(s.h)||istMensch(s.a));
      return `<details ${mensch?'open':''}><summary style="cursor:pointer;padding:6px 0;font-weight:700">${h(g)} <span class="hinweis">(${l.length})</span></summary>${l.map(x=>`<div class="pokal"><span style="text-align:right;font-weight:${istMensch(x.h)?700:400}">${h(S.clubs[x.h].name)}</span><b class="m">${kurzErg(x)}</b><span style="font-weight:${istMensch(x.a)?700:400}">${h(S.clubs[x.a].name)}${x.wunder?' <span class="chip rotx">Pokalwunder</span>':''}</span></div>`).join('')}</details>`; }).join('')}</div>`;
}

// ---------- Verein · Übersicht ----------
function vertrauenBox(mi){
  const A=S.manager[mi].amt, X=W.vertrauen; if(!A) return '';
  const gr=amtGrenze(A), v=Math.round(A.vertrauen), farbe=v<gr?'var(--rot)':v<gr+10?'var(--gold)':'var(--rasen)';
  const g=vertrauenGruende(A);
  const vota=A.vota.filter(s=>S.saison-s<X.votumVerfall);
  const warn=vota.length?`<div class="wegbox" style="gap:4px"><b class="rotx">Vorwarnung aktiv</b><span class="hinweis" style="color:var(--tinte)">Misstrauensvotum in Saison ${vota.join(', ')}. Verfällt, wenn bis zur Jahreshauptversammlung von Saison ${vota[vota.length-1]+X.votumVerfall-1} kein neues Votum kommt.</span></div>`:'';
  return `<div class="box" id="ziel-vertrauen">
    <div class="reihe" style="justify-content:space-between;align-items:flex-end"><div class="sp" style="gap:2px"><span class="lab">${A.praesident?'Vertrauen der Mitglieder':istCoAmt(A)?'Vertrauen des Cheftrainers':'Vertrauen des Vorstands'}</span><span class="hinweis">${A.praesident?'Du bist Trainer und Präsident':istCoAmt(A)?'Du bist Co-Trainer':istSdAmt(A)?'Du bist Sportdirektor':'Du bist Trainer, Präsident ist der Computer-Vorstand'}</span></div><b class="m" style="font-size:30px;color:${farbe}">${v}</b></div>
    <div class="vt-balken" role="img" aria-label="Vertrauen ${v} von 100, Grenze ${gr}"><i style="width:${v}%;background:${farbe}"></i><span style="left:${gr}%"></span>${A.praesident||istSdAmt(A)?'':`<span style="left:${istCoAmt(A)?W.co.befoerderungAb:X.wahlAb}%;background:var(--rasen)"></span>`}</div>
    <div class="reihe" style="justify-content:space-between;font-size:11px" ><span class="grau">0</span><span class="grau">${A.praesident?`Votum unter ${gr}`:istSdAmt(A)?`Entlassung unter ${gr}`:istCoAmt(A)?`Entlassung unter ${gr} · Beförderung ab ${W.co.befoerderungAb}`:`Entlassung unter ${gr} · Wahl ab ${X.wahlAb}`}</span><span class="grau">100</span></div>
    ${warn}
    <span class="lab" style="margin-top:4px">Saison ${S.saison} bisher</span>
    ${g.length?g.map(x=>`<div class="zeile" style="min-height:32px"><span class="f1">${h(x.t)}${x.n>1&&!/\(/.test(x.t)?` <span class="hinweis">· ${x.n}×</span>`:''}</span><b class="m ${x.d>0?'gruen':'rotx'}">${x.d>0?'+':'−'}${Math.abs(Math.round(x.d))}</b></div>`).join(''):`<span class="hinweis">Noch nichts passiert, was ${A.praesident?'die Mitglieder':istCoAmt(A)?'den Cheftrainer':'den Vorstand'} bewegt.</span>`}
    ${A.jhv?`<details><summary class="hinweis" style="cursor:pointer">Letzte Jahreshauptversammlung (Saison ${A.jhv.saison}): ${A.jhv.gewaehlt?'<b class="gruen">zum Präsidenten gewählt</b>':A.jhv.votum?`<b class="rotx">Misstrauensvotum</b>`:A.jhv.schonfrist?'Schonfrist im ersten Jahr':'bestätigt'} mit Vertrauen ${Math.round(A.jhv.vertrauen)}</summary>
      ${(A.jhv.gruende||[]).map(x=>`<div class="zeile" style="min-height:30px;font-size:13px"><span class="f1">${h(x.t)}</span><b class="m ${x.d>0?'gruen':'rotx'}">${x.d>0?'+':'−'}${Math.abs(Math.round(x.d))}</b></div>`).join('')||'<span class="hinweis">Keine besonderen Gründe.</span>'}</details>`:''}
  </div>`;
}
function laufbahnBox(mi){
  const st=(S.manager[mi].karriere||{}).stationen||[]; if(!st.length) return '';
  return `<div class="box" style="gap:0"><span class="lab">Bisherige Vereine</span>${[...st].reverse().map(x=>`<div class="zeile" style="min-height:40px"><span class="f1"><b>${h(x.verein)}</b><br><span class="hinweis">${h(x.rolle)} · Saison ${x.seit}–${x.bis} · ${h(x.liga)}</span></span><span class="hinweis rotx">${h(GRUND_TEXT[x.grund]||'')}</span></div>`).join('')}</div>`;
}
function renderWahl(mi){
  const mg=S.manager[mi], w=mg.wahl, alt=S.clubs[w.von];
  const karten=w.angebote.map(o=>{ const k=S.clubs[o.club], D=L(k), p=D.keineLiga?0:platzVon(k), z=S.tab[k.id];
    return `<div class="box wahl-karte"><div class="reihe" style="gap:12px">${wappen(k,30)}<div class="f1" style="min-width:0"><b style="font-size:17px">${h(k.name)}</b><div class="hinweis">${h(D.name)} · Ø ${staerke(k)}${p&&z&&z.sp?` · Platz ${p}`:''}</div></div></div>
      <div class="hinweis">Konto ${eur(k.konto)} · ${zahl(kapazitaet(k).gesamt)} Plätze · Rolle: Trainer</div>
      <button class="btn voll" data-a="wahlAnnehmen" data-v="${k.id}">Angebot annehmen</button></div>`; }).join('');
  return `<div class="dunkel" style="gap:6px"><span class="lab rotx">${h(alt.name)}</span><span class="d" style="font-size:28px">${mg.wahl.grund==='abgewaehlt'?'Abgewählt':'Entlassen'}</span>
      <span>${h(mg.name)} wurde ${GRUND_TEXT[w.grund]} und muss den Verein verlassen. Die bisherigen Vereine bleiben in der Laufbahn.</span></div>
    <span class="lab">Angebote · bei allen bist du zuerst nur Trainer</span>
    ${karten||'<div class="hinweis">Gerade kein Angebot.</div>'}
    ${laufbahnBox(mi)}`;
}
function renderVereinUebersicht(){
  const mi=S.aktiv, c=mc(mi), a=c.abrechnung, s=c.sponsoren, k=kapazitaet(c);
  const anl=Object.keys(W.anlagen).filter(id=>anlageStufe(c,id)).length;
  const sp=(s.trikot?1:0)+(s.aermel?1:0)+(s.name?1:0)+s.banden.length;
  const zeile=(ziel,t,v)=>`<div class="zeile sprung" role="button" tabindex="0" data-a="springe" data-v="${ziel}"><b class="f1">${t}</b><span class="hinweis">${v}</span><span class="pfeil" aria-hidden="true">›</span></div>`;
  return `<div class="grid2">
    <div class="sp" style="gap:14px">${sitzungBox(mi)}${vertrauenBox(mi)}${vorstandBox(mi)}${laufbahnBox(mi)}</div>
    <div class="box" style="gap:0"><span class="lab">Auf einen Blick</span>
      ${zeile('finanzen|ticket','Konto',`${eur(c.konto)}${a?` · zuletzt ${a.summe>0?'+':a.summe<0?'−':'±'}${eur(Math.abs(a.summe))}`:''}`)}
      ${zeile('finanzen|angebote','Werbepartner',`${sp} unter Vertrag${c.angebote.length?` · ${c.angebote.length} Angebot${c.angebote.length>1?'e':''}`:''}`)}
      ${zeile('stadion|stadion','Stadion',`${zahl(k.gesamt)} Plätze${c.stadion.bau.length?' · Bau läuft':''}`)}
      ${zeile('stadion|stadion','Anlagen',`${anl} von ${Object.keys(W.anlagen).length} gebaut`)}
      ${zeile('stadion|stadion','Fans',zahl(c.fans))}
    </div>
  </div>`;
}

function formHtml(c,n=5){ const f=formLetzte(c,n); return f?`<span class="form">${[...f].map(x=>`<i class="f-${x}">${x}</i>`).join('')}</span>`:''; }
function rufBox(mi){

    <div class="vt-balken"><i style="width:${r}%;background:var(--rasen)"></i>${RUF_STUFEN.slice(1).map(s=>`<span style="left:${s.ab}%"></span>`).join('')}</div>

function vereinZeile(c,rechts){
  const D=L(c), p=D.keineLiga?0:platzVon(c), z=S.tab[c.id];
  return `<div class="zeile" style="min-height:52px;gap:10px">${wappen(c,24)}<span class="f1" style="min-width:0"><b>${h(c.name)}</b><br><span class="hinweis">${h(D.name)}${p&&z&&z.sp?` · Platz ${p}`:''} · Ø ${staerke(c)}</span></span>${formHtml(c)}${rechts||''}</div>`;
}
function angebotBox(mi){
  const mg=S.manager[mi], o=mg.markt&&mg.markt.angebot; if(!o) return '';
  const k=S.clubs[o.club], alt=mc(mi), A=mg.amt, rest=Math.max(0,o.bis-S.termin);

    <span class="lab" style="color:var(--gold)">${o.herkunft==='bewerbung'?'Zusage auf deine Bewerbung':'Angebot'}${o.typ==='co'?' als Co-Trainer':o.typ==='sd'?' als Sportdirektor':''} · noch ${rest} Termin${rest===1?'':'e'}</span>
    ${vereinZeile(k)}
    <div class="folgen"><b>Wenn du annimmst:</b>
      <span>Du verlässt ${h(alt.name)}, das Traineramt dort endet.</span>

      <span>${o.typ==='sd'?`Bei ${h(k.name)} bist du Sportdirektor: Du machst Transfers, Verträge und Jugend, der Cheftrainer Aufstellung und Training.`:o.typ==='co'?`Bei ${h(k.name)} bist du Co-Trainer: Der Cheftrainer entscheidet über Aufstellung, Transfers und Prämien.`:`Bei ${h(k.name)} bist du zuerst nur Trainer.`}</span></div>
    <div class="reihe"><button class="btn voll" data-a="kAnnehmen">Annehmen</button><button class="btn" data-a="kAblehnen">Ablehnen</button></div>
  </div>`;
}
function renderStellenmarkt(){
  const mi=S.aktiv, mg=S.manager[mi], M=mg.markt, c=mc(mi), land=UI.kLand||L(c).land;
  const offen=(S.stellen||[]).map(s=>({s,c:S.clubs[s.club]})).filter(x=>x.c.human<0&&(land==='alle'||L(x.c).land===land))
    .sort((a,b)=>niv(a.c)-niv(b.c)||staerke(b.c)-staerke(a.c));
  const beworben=new Set(M.bewerbungen.filter(b=>!b.erg).map(b=>b.club));
  const stellen=offen.slice(0,UI.kAlle?999:15).map(({s,c:k})=>{ const ch=bewerbungsChance(mi,k.id), st=stufeFuerNiveau(niv(k));
    const rechts=!ch?`<span class="chip grau">ab Ruf ${st.ab}</span>`:beworben.has(k.id)?'<span class="chip">beworben</span>'
      :`<span class="sp" style="align-items:flex-end;gap:4px"><span class="chance c-${ch.wort}">Chance ${ch.wort}</span><button class="btn klein" data-a="bewerben" data-v="${k.id}">Bewerben</button></span>`;
    return vereinZeile(k,rechts); }).join('');
  const bew=M.bewerbungen.map(b=>{ const k=S.clubs[b.club], rest=b.antwort-S.termin;
    return `<div class="zeile" style="min-height:36px"><span class="f1"><b>${h(k.name)}</b> <span class="hinweis">· ${b.typ==='co'?'Co-Trainer · ':b.typ==='sd'?'Sportdirektor · ':''}Chance ${b.wort}</span></span>${b.erg==='zusage'?'<b class="gruen">Zusage</b>':b.erg==='absage'?'<b class="rotx">Absage</b>':`<span class="hinweis">Antwort in ${Math.max(1,rest)} Termin${rest>1?'en':''}</span>`}</div>`; }).join('');
  const eigen=niv(c);
  const druck=S.clubs.filter(k=>k.human<0&&!L(k).keineLiga&&!stelleVon(k.id)&&L(k).land===L(c).land&&Math.abs(niv(k)-eigen)<=2)
    .filter(k=>{ const f=formLetzte(k,4); return f.length===4&&!f.includes('S')&&(f.match(/N/g)||[]).length>=3; })
    .sort((a,b)=>niv(a)-niv(b)).slice(0,8).map(k=>vereinZeile(k)).join('');
  const laender=[...new Set(W.ligen.filter(D=>!D.keineLiga).map(D=>D.land))];
  const beworbenCo=new Set(M.bewerbungen.filter(b=>!b.erg&&b.typ==='co').map(b=>b.club));
  if(M.angebot) beworbenCo.add(M.angebot.club);
  for(const b of M.bewerbungen) if(!b.erg&&b.typ==='sd') beworbenCo.add(b.club);
  const sd=mg.ruf<W.sd.rufAb?'':sdStellenFuer(mi).map(id=>S.clubs[id]).filter(k=>land==='alle'||L(k).land===land).sort((a,b)=>niv(a)-niv(b)).map(k=>{ const ch=sdChance(mi,k.id);
    return vereinZeile(k,beworbenCo.has(k.id)?'<span class="chip">beworben</span>':`<span class="sp" style="align-items:flex-end;gap:4px"><span class="chance c-${ch.wort}">Chance ${ch.wort}</span><button class="btn klein" data-a="bewerbenSd" data-v="${k.id}">Bewerben</button></span>`); }).join('');
  const co=coStellenFuer(mi).map(id=>S.clubs[id]).filter(k=>land==='alle'||L(k).land===land).sort((a,b)=>niv(a)-niv(b)).map(k=>{ const ch=coChance(mi,k.id);
    return vereinZeile(k,beworbenCo.has(k.id)?'<span class="chip">beworben</span>':`<span class="sp" style="align-items:flex-end;gap:4px"><span class="chance c-${ch.wort}">Chance ${ch.wort}</span><button class="btn klein" data-a="bewerbenCo" data-v="${k.id}">Bewerben</button></span>`); }).join('');
  return `<div class="grid2">
    <div class="sp" style="gap:14px">${angebotBox(mi)}${rufBox(mi)}
      ${bew?`<div class="box" style="gap:0"><span class="lab">Deine Bewerbungen</span>${bew}</div>`:''}
      <div class="box" style="gap:0"><span class="lab">Sportdirektor-Stellen</span>${mg.ruf<W.sd.rufAb?`<span class="hinweis" style="padding:6px 0">Ab Ruf ${W.sd.rufAb} (Überregional).</span>`:sd||'<span class="hinweis" style="padding:6px 0">Gerade keine passende Stelle in diesem Land.</span>'}</div>
      <div class="box" style="gap:0"><span class="lab">Co-Trainer-Stellen</span>${co||'<span class="hinweis" style="padding:6px 0">Keine Co-Trainer-Stelle 1–2 Ruf-Stufen über dir in diesem Land.</span>'}</div>
      <div class="box" style="gap:0"><span class="lab">Trainer unter Druck</span>${druck||'<span class="hinweis" style="padding:6px 0">Gerade wackelt in deiner Nähe kein Trainerstuhl.</span>'}</div>
    </div>
    <div class="box" style="gap:0">
      <div class="reihe" style="justify-content:space-between;margin-bottom:6px"><span class="lab">Freie Stellen · ${offen.length}</span>
        <select data-c="kLand" aria-label="Land" style="min-height:36px">${['alle',...laender].map(l=>`<option value="${l}" ${l===land?'selected':''}>${l==='alle'?'Alle Länder':h(W.laender[l].name)}</option>`).join('')}</select></div>
      ${stellen||'<span class="hinweis" style="padding:6px 0">Im Moment ist hier keine Stelle frei. Vereine trennen sich nach Negativserien von ihren Trainern.</span>'}
      ${offen.length>15&&!UI.kAlle?`<button class="btn klein" data-a="kAlle" style="margin-top:8px">Alle ${offen.length} zeigen</button>`:''}
    </div>
  </div>`;
}

function naechstesLaenderspiel(){

  return null;
}

    const b=mg.markt&&mg.markt.nBewerbung;
    const liste=S.national.offen.map(l=>{ const ch=nationalChance(mi,l), ab=nationalRufAb(l);
      const rechts=b&&!b.erg&&b.land===l?'<span class="chip">beworben</span>':!ch?`<span class="chip grau">ab Ruf ${ab}</span>`
        :`<span class="sp" style="align-items:flex-end;gap:4px"><span class="chance c-${ch.wort}">Chance ${ch.wort}</span><button class="btn klein" data-a="nBewerben" data-v="${l}">Bewerben</button></span>`;
      return `<div class="zeile" style="min-height:52px"><span class="f1"><b>${h(nationName(l))}</b><br><span class="hinweis">Teamstärke Ø ${Math.round(nationalStaerke(l))}</span></span>${rechts}</div>`; }).join('');

        ${b&&b.erg?`<span class="hinweis" style="padding-top:6px">Bewerbung bei ${h(nationName(b.land))}: ${b.erg==='zusage'?'Zusage':'Absage'}</span>`:''}</div>
      <span class="hinweis erkl">Nationaltrainer bist du zusätzlich zu deinem Verein. Der Kader sind die besten Spieler der Vereine des Landes. Länderspiele gibt es nach dem ${X.nachLigaTermin.join('., ')}. Ligatermin, alle ${X.turnierAlle} Saisons eine Europameisterschaft. Große Länder ab Ruf ${X.rufAb.DE}, kleinere ab ${X.rufAb.standard}.</span>
    </div><div class="sp" style="gap:14px">${turnierBox}<span class="hinweis">${emText}</span></div></div>`;
  }

    <div class="box">
      <div class="reihe" style="justify-content:space-between;align-items:flex-end"><div class="sp" style="gap:2px"><span class="lab">Nationaltrainer</span><b style="font-size:20px">${h(nationName(N.land))}</b></div><b class="m" style="font-size:30px;color:${farbe}">${v}</b></div>
      <div class="vt-balken"><i style="width:${v}%;background:${farbe}"></i><span style="left:${X.grenze}%"></span></div>

      <span class="hinweis">${nl?`Nächstes Länderspiel nach dem ${nl.nr}. Ligatermin (Termin ${nl.termin}).`:'Diese Saison kein Länderspiel mehr.'} ${emText}</span>
      <span class="lab" style="margin-top:4px">Ausrichtung in Länderspielen</span>
      <div class="seg" style="grid-template-columns:repeat(3,1fr)">${['offensiv','neutral','defensiv'].map(a=>`<button class="${N.ausrichtung===a?'an':''}" data-a="nAusrichtung" data-v="${a}">${a[0].toUpperCase()+a.slice(1)}</button>`).join('')}</div>
      <button class="btn klein" data-a="nRuecktritt" style="align-self:flex-start;margin-top:6px">Zurücktreten</button>

    <div class="box" style="gap:0"><span class="lab">Letzte Länderspiele</span>${N.spiele.map(s=>`<div class="zeile" style="min-height:32px;font-size:13px"><span class="m grau" style="width:40px">S${s.saison}</span><span class="f1">${h(s.heim?nationName(N.land):nationName(s.gegner))} – ${h(s.heim?nationName(s.gegner):nationName(N.land))}</span><b class="m ${s.eig>s.gg?'gruen':s.eig<s.gg?'rotx':'grau'}">${s.heim?s.eig:s.gg}:${s.heim?s.gg:s.eig}</b></div>`).join('')||'<span class="hinweis" style="padding:6px 0">Noch keins.</span>'}</div>

}
function renderKarriere(){ return UI.karriereSub==='laufbahn'?renderLaufbahn():UI.karriereSub==='national'?renderNational():renderStellenmarkt(); }

// ---------- Kader ----------
function renderKader(){
  const c=mc(S.aktiv), mg=S.manager[S.aktiv];
  if(UI.kaderSub==='jugend') return renderJugend(c);
  if(UI.kaderSub==='training') return renderTraining(c);
  pruefeAufstellung(c);
  const a=c.aufstellung, sl=slots(a.formation), map=new Map(c.kader.map(p=>[p.id,p]));
  const reihen={TW:[],AB:[],MF:[],ST:[]}; sl.forEach((pos,i)=>reihen[pos].push(i));
  const hb=W.sport==='handball', yPos=hb?{TW:90,AB:20,MF:50,ST:24}:{TW:90,AB:68,MF:44,ST:18}, punkte=[];
  for(const pos in reihen){ const r=reihen[pos]; r.forEach((idx,j)=>punkte.push({idx,x:hb&&pos==='ST'?(j?90:10):(j+1)*100/(r.length+1),y:yPos[pos]})); }
  const feld=punkte.map(pt=>{ const p=map.get(a.ids[pt.idx]); if(!p) return ''; const off=p.pos!==sl[pt.idx];
    return `<button class="spieler ${UI.sel===p.id?'sel':''}" data-a="selSpieler" data-v="${p.id}" style="left:${pt.x}%;top:${pt.y}%"><span class="kreis m" style="${off?'border-color:var(--rot)':''}">${p.staerke}</span><span class="nm">${h(p.name)}${off?' ('+posK(p.pos)+')':''}</span></button>`; }).join('');
  const inElf=new Set(a.ids), fenster=fensterOffen();
  const liste=['TW','AB','MF','ST'].flatMap(pos=>c.kader.filter(p=>p.pos===pos).sort((x,y)=>y.staerke-x.staerke)).map(p=>`
    <div class="zeile klick ${UI.sel===p.id?'sel':''}" data-a="spielerMenue" data-v="${p.id}" title="Antippen für Prämie, Gespräch und mehr">
      <span class="m grau" style="width:26px">${posK(p.pos)}</span>
      <span class="f1"><b>${h(p.name)}</b>${p.wechsel?' <span class="weg" title="will weg">⚠ will weg</span>':''}${p.versprechen?` <span class="chip gruen" title="Stammplatz versprochen">★ Stammplatz · ${p.versprechen.rest}</span>`:''}${p.potenzial&&p.staerke<p.potenzial?` <span title="Rohdiamant, Potenzial ca. ${p.potAnz}">💎</span>`:''} <span class="hinweis">${p.alter} J.${p.tore?' · '+p.tore+' Tore':''}</span></span>
      ${launeBalken(p)}
      <span style="font-size:12px;font-weight:700;color:${p.verletzt||p.gesperrt?'var(--rot)':inElf.has(p.id)?'var(--rasen)':'var(--grau)'}">${p.verletzt?'verletzt '+p.verletzt:p.gesperrt?'gesperrt '+p.gesperrt:inElf.has(p.id)?W.worte.startelf:'Bank'}</span>
      <span class="m" style="width:70px;text-align:right;font-size:12px">${eur(marktwert(p))}</span>
      <b class="m" style="width:26px;text-align:right">${p.staerke}</b>
      <span class="pfeil grau" aria-hidden="true" style="font-size:20px">›</span>
    </div>`).join('');
  const weg=c.kader.filter(p=>p.wechsel).length, kAlle=bonusAlleKosten(c);
  const teamBox=`<div class="box" style="gap:8px"><div class="reihe" style="justify-content:space-between"><span class="lab">Stimmung im Kader</span><span class="hinweis">Ø ${launeText(summe(c.kader.map(laune))/Math.max(1,c.kader.length))}${weg?` · <b class="rotx">${weg} ${weg>1?'wollen':'will'} weg</b>`:''}</span></div>
    <div class="reihe"><button class="btn gold klein" data-a="bonusAlle" ${c.bonusAlleTermin===S.termin||c.konto<kAlle?'disabled':''}>Prämie für alle · ${eur(kAlle)}</button><span class="hinweis">+${W.laune.bonusAlle[1]} Stimmung für jeden, einmal pro Spiel</span></div>
    <span class="hinweis erkl">Spieler antippen: Einzelprämie, Gespräch bei Wechselwunsch, Tauschen, Verkaufen. Wer oft auf der Bank sitzt, wird unzufrieden. Gute Stimmung macht die Startelf etwas stärker.</span></div>`;
  return `<div class="grid2">
    <div class="sp" style="gap:12px">
      <div class="reihe" id="ziel-aufstellung" style="justify-content:space-between"><span class="d" style="font-size:30px">Aufstellung</span>
        <select data-c="formation" aria-label="${W.worte.formation}" title="${W.worte.formation}">${Object.keys(W.formationen).map(f=>`<option ${f===a.formation?'selected':''}>${f}</option>`).join('')}</select></div>
      <div class="feld"><div class="linie"></div><div class="strafraum"></div>${feld}</div>
      <div class="hinweis">${UI.sel?'Jetzt einen zweiten Spieler antippen, um zu tauschen.':'Spieler antippen, dann zweiten Spieler zum Tauschen wählen. Rot umrandet: falsche Position (−22 %).'}</div>
      <div class="sp"><span class="lab">Ausrichtung</span><div class="seg" style="grid-template-columns:repeat(3,1fr)">${['offensiv','neutral','defensiv'].map(x=>`<button class="${c.ausrichtung===x?'an':''}" data-a="ausrichtung" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>
      <div class="reihe"><button class="btn" data-a="autoElf">Beste ${W.worte.elf} aufstellen</button></div>
      ${autoSchalter(mg)}
    </div>
    <div class="sp" id="ziel-kaderliste" style="border-radius:16px">${teamBox}<div class="reihe" style="justify-content:space-between"><span class="lab">Kader ${c.kader.length} / ${W.kaderMax}</span><span class="hinweis">${fenster?'Transferfenster offen':''}</span></div>${liste}</div>
  </div>`;
}
function spielerMenueHtml(pid){
  const c=mc(S.aktiv), p=c.kader.find(x=>x.id===pid);

  const l=laune(p), inElf=c.aufstellung.ids.includes(p.id), fenster=fensterOffen(), halb=bonusHalb(p), gps=gehaltProSpiel(c,p);

  let weg='';

  else if(p.wechsel){
    const heute=p.verhTermin===S.termin;
    const angebote=W.laune.halte.map(([f],i)=>{ const k=halteKosten(c,p,i);
      return `<button class="btn" data-a="pHalte" data-v="${p.id}|${i}" ${heute||c.konto<k?'disabled':''}>${W.laune.halteNamen[i]}<small>${eur(k)} · ${Math.round(halteChance(p,i)*100)} %</small></button>`; }).join('');
    weg=`<div class="wegbox"><b class="rotx">${h(p.name)} will den Verein verlassen.</b>
      <span class="hinweis erkl" style="color:var(--tinte)">Biete eine Halteprämie an. Die Prozentzahl ist die Chance, dass er zusagt. Bezahlt wird nur bei Zusage. Ohne Einigung geht er am Ende ${fenster?'dieses':'des nächsten'} Transferfensters für ${Math.round(W.laune.abgangQuote*100)} % des Marktwerts.</span>
      <div class="pm">${angebote}</div>
      ${(()=>{ const g=stammGesperrt(c,p), X=W.laune.stamm;
        return `<button class="btn" data-a="pStamm" data-v="${p.id}" ${g?'disabled':''} style="flex-direction:column;gap:0;min-height:54px;line-height:1.2">Stammplatz versprechen<small style="font-weight:400;font-size:11px">kostenlos · ${Math.round(stammChance(p)*100)} %</small></button>
        <span class="hinweis" style="color:var(--tinte)">${g&&!heute?h(g)+' ':''}Sagt er zu, muss er in den nächsten ${X.spiele} Spielen, in denen er fit ist, in der Startelf stehen. Brichst du das, stürzt seine Stimmung ab und er will sofort wieder weg.</span>`; })()}
      ${heute?'<span class="hinweis">Für heute ist das Gespräch beendet. Nach dem nächsten Spiel geht es wieder.</span>':''}
      ${fenster?`<button class="btn klein" data-a="pVerkaufen" data-v="${p.id}">Ziehen lassen: jetzt für ${eur(marktwert(p)*W.verkaufQuote)} verkaufen</button>`:''}</div>`;
  }
  return `<div class="overlay" data-a="hinterZu"><div class="box" role="dialog" aria-label="${h(p.name)}">
    <div class="reihe" style="justify-content:space-between"><div><span class="lab">${posK(p.pos)} · ${p.alter} Jahre · ${status}</span><div class="d" style="font-size:32px">${h(p.name)}</div></div><b class="d" style="font-size:40px">${p.staerke}</b></div>
    <div class="hinweis" style="color:var(--tinte)">Marktwert ${eur(marktwert(p))} · Gehalt ca. ${eur(gps)} pro Spiel${p.tore?` · ${p.tore} Tore`:''}</div>
    ${p.potenzial?`<div class="hinweis" style="color:var(--tinte)">💎 Rohdiamant · der Scout schätzt sein Potenzial auf ${p.potAnz}${p.staerke>=p.potenzial?'. Er ist ausgereift.':p.alter>W.scout.wachstumBisAlter?'. Er ist zu alt, um noch viel zu lernen.':''}</div>`:''}

// ---------- Stadion & Vereinsgelände ----------
function zufall(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const GL={px:170,py:135,pw:180,ph:120,gap:6,tiefe:[0,18,30,44],flach:14};
function tribRect(k,d){
  const {px,py,pw,ph,gap}=GL;
  if(k==='nord') return {x:px-4,y:py-gap-d,w:pw+8,h:d,quer:false,aussen:'oben'};
  if(k==='sued') return {x:px-4,y:py+ph+gap,w:pw+8,h:d,quer:false,aussen:'unten'};
  if(k==='west') return {x:px-gap-d,y:py-4,w:d,h:ph+8,quer:true,aussen:'links'};
  return {x:px+pw+gap,y:py-4,w:d,h:ph+8,quer:true,aussen:'rechts'};
}
function glLabel(x,y,t,anker='middle',gr=10){ return `<text x="${x}" y="${y}" text-anchor="${anker}" font-size="${gr}" font-weight="700" font-family="Bricolage Grotesque,sans-serif" fill="#1d1f1a" stroke="#f4efe4" stroke-width="3" paint-order="stroke">${h(t)}</text>`; }
function glKran(x,y,rest,mitText=true){
  return `<g><rect x="${x-3}" y="${y-3}" width="6" height="6" fill="#e8b04a" stroke="#1d1f1a"/>
    <line x1="${x-14}" y1="${y}" x2="${x+38}" y2="${y-10}" stroke="#e8b04a" stroke-width="3"/><line x1="${x-14}" y1="${y}" x2="${x+38}" y2="${y-10}" stroke="#1d1f1a" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="${x-18}" y="${y-2}" width="6" height="5" fill="#5e5a50"/><line x1="${x+30}" y1="${y-8}" x2="${x+30}" y2="${y+4}" stroke="#1d1f1a" stroke-width="1"/>
    ${mitText?glLabel(x+12,y+16,'Bau · noch '+rest,'middle',9):''}</g>`;
}
function glZuschauer(r,dichte,rand,c,reihen){
  const farben=[c.farbe||'#c8321e',c.farbe2||'#ffffff','#d9d2c3','#3a3c35',c.farbe||'#c8321e'];
  let o='';
  const lang=r.quer?r.h:r.w, quer=r.quer?r.w:r.h, schritt=5.5, rh=quer/reihen;
  for(let i=0;i<reihen;i++) for(let p=3;p<lang-2;p+=schritt){
    if(rand()>dichte) continue;
    const a=p+(rand()-0.5)*1.5, b=rh*(i+0.5);
    const x=r.quer?r.x+b:r.x+a, y=r.quer?r.y+a:r.y+b;
    o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.5" fill="${h(farben[Math.floor(rand()*farben.length)])}"/>`;
  }
  return o;
}
function glTribuene(c,k,dichte,rand){
  const st=c.stadion, t=st.trib[k], b=imBau(st,k), sel=UI.stadionSel===k;
  let d=GL.tiefe[t.lvl], art='ring';
  if(t.lvl===0&&k==='nord'&&st.holz){ d=GL.flach; art='holz'; }
  else if(t.lvl===0&&k==='sued'&&st.stehwall){ d=GL.flach; art='wall'; }
  else if(t.lvl>0) art='sitz';
  const r=tribRect(k,Math.max(d,10));
  const sonderBau=(art==='holz'&&imBau(st,'holz'))||(art==='wall'&&imBau(st,'stehwall'));
  const ganzGesperrt=(b&&b.art==='ausbau')||sonderBau;
  let o=`<g data-a="stadionSel" data-v="${k}" style="cursor:pointer"><title>${h(TRIB[k])}: ${zahl(tribKap(st,k))} Plätze</title>`;
  o+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="transparent"/>`;
  if(art==='ring'){
    const lx=r.quer?(k==='west'?r.x+r.w:r.x):null, ly=r.quer?null:(k==='nord'?r.y+r.h:r.y);
    o+=r.quer?`<line x1="${lx}" y1="${r.y}" x2="${lx}" y2="${r.y+r.h}" stroke="#f4efe4" stroke-width="2" stroke-dasharray="1 2"/>`:`<line x1="${r.x}" y1="${ly}" x2="${r.x+r.w}" y2="${ly}" stroke="#f4efe4" stroke-width="2" stroke-dasharray="1 2"/>`;
    o+=glZuschauer(r,dichte*0.35,rand,c,2);
  } else {
    const fill=art==='holz'?'#a77b4f':art==='wall'?'#7f9a5a':'#6f6a5e';
    o+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fill}" stroke="#1d1f1a" stroke-width="1"/>`;
    const reihen=art==='sitz'?Math.round(d/4):3;
    if(art==='sitz') o+=`<rect x="${r.x+1}" y="${r.y+1}" width="${r.w-2}" height="${r.h-2}" fill="${h(c.farbe||'#c8321e')}" opacity=".55"/>`;
    for(let i=1;i<reihen;i++){ const q=(r.quer?r.w:r.h)*i/reihen;
      o+=r.quer?`<line x1="${r.x+q}" y1="${r.y}" x2="${r.x+q}" y2="${r.y+r.h}" stroke="rgba(0,0,0,.28)" stroke-width="1"/>`:`<line x1="${r.x}" y1="${r.y+q}" x2="${r.x+r.w}" y2="${r.y+q}" stroke="rgba(0,0,0,.28)" stroke-width="1"/>`; }
    if(!ganzGesperrt) o+=glZuschauer(r,dichte,rand,c,reihen);
    if(t.vip){
      const v=r.aussen==='oben'?{x:r.x+40,y:r.y-6,w:r.w-80,h:6}:{x:r.x+40,y:r.y+r.h,w:r.w-80,h:6};
      const vb=b&&b.art==='vip';
      o+=`<rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}" fill="${vb?'url(#glBau)':'#9fd3e6'}" stroke="#1d1f1a" stroke-width="1"/>`;
      for(let x=v.x+9;x<v.x+v.w;x+=9) o+=`<line x1="${x}" y1="${v.y}" x2="${x}" y2="${v.y+v.h}" stroke="#1d1f1a" stroke-width=".6"/>`;
    }
    if(t.dach){

// ---------- Zusammensetzen ----------
function szZeige(c,id){
  const st=c.stadion;
  let inhalt, bau=null;
  if(TRIB[id]){ inhalt=szTribuene(c,id); bau=imBau(st,id)||(id==='nord'&&imBau(st,'holz'))||(id==='sued'&&imBau(st,'stehwall')); bau=bau?{was:bau.name,rest:bau.rest}:null; }
  else if(id==='platz'){ inhalt=szPlatz(c); const b=imBau(st,'flutlicht')||imBau(st,'tafel'); bau=b?{was:b.name,rest:b.rest}:null; }
  else if(id==='stadion') inhalt=szStadion(c);
  else if(id==='eingang') inhalt=szEingang(c);
  else if(id==='kabine') inhalt=szKabine(c);
  else if(id==='shop'){ inhalt=szShop(c); if(c.merch.bau) bau={was:W.merch.staende[c.merch.bau.typ].name,rest:c.merch.bau.rest}; }
  else if(id==='internat'){ if(!c.internat&&!c.internatBau) inhalt=szBauplatz('Jugendinternat'); else { inhalt=szInternat(c); if(c.internatBau) bau={was:'Jugendinternat',rest:c.internatBau}; } }
  else if(W.anlagen[id]){ const A=W.anlagen[id], s=anlageStufe(c,id), b=anlageImBau(c,id), zeig=b?b.stufe:s;
    if(!zeig) inhalt=szBauplatz(A.stufen[0]); else { inhalt=SZ_ANL[id](c,zeig); if(b) bau={was:A.stufen[b.stufe-1],rest:b.rest}; } }
  else inhalt=szEingang(c);
  if(bau) inhalt=`<g opacity=".55">${inhalt}</g>`+szBaustelle(bau.was,bau.rest);
  return szSvg(inhalt,szTitel(id));
}
// Rundgang: kürzer als die Knopfleiste. Die vier Tribünen sind im Stadionbild schon zu sehen.
const rgStationen = c => szStationen(c).filter(id=>!TRIB[id]);
function szStationen(c){
  return ['stadion','eingang','nord','ost','sued','west','platz','kabine','shop',...(c.internat||c.internatBau?['internat']:[]),...ANL_ORT.filter(id=>anlageStufe(c,id)||anlageImBau(c,id))];
}
function szInfo(c,id){
  const st=c.stadion, D=L(c);
  if(id==='stadion'){ const k=kapazitaet(c), bau=st.bau.length; return `Das ganze Stadion von oben. ${zahl(k.gesamt)} Plätze${k.gesperrt?`, davon ${zahl(k.gesperrt)} gerade gesperrt`:''}. Die ${D.name} verlangt ${zahl(D.mindest)} Plätze${D.niveau<=W.stadion.flutlichtPflichtAb?' und Flutlicht':''}.${bau?` ${bau} Baustelle${bau>1?'n':''} laufen gerade.`:''}`; }
  if(id==='eingang'){ const ab=c.abrechnung; return `Hier kommen die Fans rein. Eintritt ${eur(D.ticket*c.ticketFaktor)}, ${zahl(c.fans)} Fans hat der Verein.${ab&&ab.heim&&ab.zuschauer?` Beim letzten Heimspiel waren ${zahl(ab.zuschauer)} Zuschauer da.`:''}`; }
  if(TRIB[id]){ const t=st.trib[id], b=imBau(st,id)||(id==='nord'&&imBau(st,'holz'))||(id==='sued'&&imBau(st,'stehwall'));
    const art=t.lvl>0?`Tribüne Stufe ${t.lvl}${t.dach?', überdacht':''}${t.vip?', mit VIP-Logen':''}.`:(id==='nord'&&st.holz)?'Eine Holztribüne mit Sitzbänken.':(id==='sued'&&st.stehwall)?'Ein Stehwall: Hier wird gesungen.':'Noch keine Tribüne. Die Fans stehen am Geländer.';
    return `${art} ${zahl(tribKap(st,id))} Plätze.${b?` Gerade wird gebaut: ${b.name}, noch ${b.rest} Termin(e). Solange ist hier gesperrt.`:''}`; }
  if(id==='platz') return `Der Blick von der Tribüne aufs Feld. ${st.flutlicht?'Das Flutlicht macht Abendspiele möglich.':'Noch kein Flutlicht.'} ${st.tafel?'Auf der Anzeigetafel steht das letzte Ergebnis.':'Eine Anzeigetafel fehlt noch.'}`;
  if(id==='kabine'){ const avg=summe(c.kader.map(laune))/Math.max(1,c.kader.length), weg=c.kader.filter(p=>p.wechsel).length; return `${c.kader.length} Spieler, Taktik ${c.aufstellung.formation}. Die Stimmung ist ${launeText(avg)}.${weg?` ${weg} Spieler ${weg>1?'wollen':'will'} weg.`:''}`; }
  if(id==='shop'){ const n=summe(Object.keys(W.merch.artikel).map(a=>lagerBestand(c,a))); return `${W.merch.staende[c.merch.stand].name}. Im Lager: ${zahl(n)} Fanartikel.${c.merch.bau?` Im Bau: ${W.merch.staende[c.merch.bau.typ].name}, noch ${c.merch.bau.rest} Termin(e).`:''}`; }
  if(id==='internat') return c.internat?`Hier wohnen die Talente. ${jugendBelegt(c)} von ${jugendPlaetze(c)} Plätzen belegt.`:c.internatBau?`Das Internat wird gebaut, noch ${c.internatBau} Termin(e).`:'Noch kein Internat. Bauen kannst du es im Kader unter Nachwuchs.';
  const A=W.anlagen[id]; if(!A) return '';
  const s=anlageStufe(c,id), b=anlageImBau(c,id);
  let t=s?`${A.stufen[s-1]}: ${A.txt(A.w[s-1])}.`:`Noch nichts gebaut. Als Erstes kann hier entstehen: ${A.stufen[0]}.`;
  if(id==='museum'&&s) t+=` ${museum(c).erfolge.length} Erfolge in der Sammlung.`;
  if(b) t+=` Im Bau: ${A.stufen[b.stufe-1]}, noch ${b.rest} Termin(e).`;
  return t;
}

// ---------- Live-Platz (Ballposition wie bei Live-Trackern) ----------
const PLATZ={b:240,hh:100,zone:48};
function hexRgb(x){ const m=/^#?([0-9a-f]{6})$/i.exec(String(x||'')); if(!m) return [255,255,255]; const n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]; }
function helligkeit(x){ const [r,g,b]=hexRgb(x); return (0.299*r+0.587*g+0.114*b)/255; }
function sichtbarAufRasen(x){ const [r,g,b]=hexRgb(x); return helligkeit(x)>0.35 && !(g>r+30&&g>b+30); }
function platzFarbe(c){
  if(sichtbarAufRasen(c.farbe)) return c.farbe;
  if(sichtbarAufRasen(c.farbe2)) return c.farbe2;
  return '#ffffff';
}
function ballZiel(m,top){
  const x=PLATZ.zone/2+m.col*PLATZ.zone, y=Math.round(m.by*PLATZ.hh/100);
  if(!top) return [x,y];
  if(top.typ==='tor') return [top.s?2:238, 50];
  if(top.typ==='chance') return [top.s?14:226, clamp(y,38,62)];
  if(top.typ==='ecke') return [top.s?5:235, m.min%2?6:94];
  return [x,y];
}
// Kleine, feste Zufallszahl je Minute und Spieler, damit die Punkte "leben", ohne bei jedem Neuzeichnen zu springen
function wackel(m,k){ let x=Math.sin((m.min*12.9898+k*78.233)*43758.5453); return (x-Math.floor(x))*2-1; }
function farbAbstand(a,b){ const A=hexRgb(a), B=hexRgb(b); return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]); }
function teamFarben(H,A){
  const fh=platzFarbe(H); let fa=platzFarbe(A);
  if(farbAbstand(fh,fa)<110){ const alt=[A.farbe2,A.farbe,'#ffffff','#ffd400','#7fd3ff'].find(x=>x&&sichtbarAufRasen(x)&&farbAbstand(fh,x)>=110); fa=alt||(helligkeit(fh)>0.7?'#ffd400':'#ffffff'); }
  return [fh,fa];
}
// Positionen der 22 Spieler aus Formation, Ballposition und Ereignis. Rückgabe: [{k,x,y,s,tw}]
function spielerPositionen(m,ball,top){
  const P=PLATZ, out=[], tiefe={TW:0.03,AB:0.19,MF:0.38,ST:0.56};
  const angreifer=top&&['chance','ecke','tor'].includes(top.typ)?top.s:null;
  for(const s of [0,1]){
    const l=spielerVon(m,s), bes=m.bes===s, bu=s?1-ball[0]/P.b:ball[0]/P.b, by=ball[1];
    const reihen={TW:[],AB:[],MF:[],ST:[]}; l.forEach(x=>reihen[x.pos].push(x));
    for(const pos in reihen){ const r=reihen[pos];
      r.forEach((x,j)=>{
        const k=s*100+x.p.id%97;
        let d, y=(j+1)/(r.length+1)*P.hh;
        if(pos==='TW'){ d=0.025+Math.max(0,bu-0.5)*0.06; y=50+(by-50)*0.2; }
        else {
          d=tiefe[pos]+(bes?0.1:-0.02)+(bu-0.5)*(bes?0.5:0.42);
          y+= (by-50)*(bes?0.25:0.38);
          if(angreifer===s&&(pos==='ST'||(pos==='MF'&&j%2===0))){ d=0.84+0.07*wackel(m,k+3); y=50+30*wackel(m,k+5); }
          if(angreifer===1-s&&pos==='AB'){ d=0.05+0.04*(j%2); y=30+40*(j+0.5)/r.length; }
          if(angreifer===1-s&&pos==='MF'){ d=Math.min(d,0.22); }
        }
        d+=0.018*wackel(m,k); y+=3*wackel(m,k+1);
        d=clamp(d,0.015,0.96);
        out.push({k:s+'-'+x.p.id, s, tw:pos==='TW', x:clamp(s?P.b*(1-d):P.b*d,4,P.b-4), y:clamp(y,5,P.hh-5)});
      });
    }
  }
  // Ballführer und nächster Gegenspieler gehen zum Ball
  if(!top||top.typ!=='tor'){
    const naechst=t=>out.filter(o=>o.s===t&&!o.tw).sort((a,b)=>Math.hypot(a.x-ball[0],a.y-ball[1])-Math.hypot(b.x-ball[0],b.y-ball[1]))[0];
    const dir=m.bes?-1:1, f=naechst(m.bes), g=naechst(1-m.bes);
    if(f){ f.x=clamp(ball[0]-dir*4,4,PLATZ.b-4); f.y=clamp(ball[1]+2,5,PLATZ.hh-5); }
    if(g){ g.x=clamp(ball[0]+dir*7,4,PLATZ.b-4); g.y=clamp(ball[1]-3,5,PLATZ.hh-5); }
  }
  return out;
}
function livePlatz(m){
  if(W.sport!=='fussball') return '';
  const P=PLATZ, H=S.clubs[m.h], A=S.clubs[m.a];
  const evNow=m.ev.filter(e=>e.min===m.min&&e.typ!=='pfiff'&&e.typ!=='wechsel');
  const prio=['tor','chance','ecke','rot','gelb','verletzt'];
  const top=prio.map(t=>evNow.find(e=>e.typ===t)).find(Boolean);
  const bes=m.bes??0, team=bes?A:H, [fh,fa]=teamFarben(H,A), farbe=bes?fa:fh;
  const pause=LIVE.phase!=='laeuft', ende=m.min>=SPIELMIN(), ruhe=LIVE.phase==='halbzeit'||ende||m.min===0;
  const spielTop=top&&['tor','chance','ecke'].includes(top.typ)?top:null;
  const ball=ruhe?[P.b/2,P.hh/2]:ballZiel(m,spielTop);
  // Vorherige Positionen merken, damit Ball und Spieler von dort aus laufen
  if(m._bmin!==m.min){
    m._b0=m._b1||ball; m._b1=ball; m._bes0=m._bes1??bes; m._bes1=bes;
    m._p0=m._p1||{}; m._p1={};
    for(const o of spielerPositionen(m,ball,ruhe?null:spielTop)) m._p1[o.k]=o;
    m._bmin=m.min;
  }
  const [x1,y1]=m._b1, [x0,y0]=pause?m._b1:(m._b0||m._b1);
  const dauer=Math.round(W.msProMinute/UI.speed), weite=Math.hypot(x1-x0,y1-y0);
  const hoch=Math.min(18,weite*0.22), xm=(x0+x1)/2, ym=(y0+y1)/2-hoch;
  const dist=bes?m.col:4-m.col;
  let lab, klasse='';

// ---------- Ablauf ----------
function liveStarten(){
  const seed=Math.floor(Math.random()*4294967296);
  S.laufend={saison:S.saison, termin:S.termin, seed};
  speichern();
  zufallsQuelle(seed);
  const spiele=terminVorbereiten();
  for(const m of spiele) if(!m.live) spieleKomplett(m);
  LIVE={spiele,min:0,phase:'laeuft',wahl:{},hzRest:W.halbzeitMs,hzHalten:false,elferStep:0,pausen:{},pauseMi:null};
  liveTakt();
}
function liveTakt(){
  clearTimeout(LIVE.t);
  const live=LIVE.spiele.filter(m=>m.live);
  if(LIVE.phase==='laeuft'){
    LIVE.min++; for(const m of live) schritt(m);
    if(LIVE.min===SPIELMIN()/2){ LIVE.phase='halbzeit'; LIVE.hzRest=W.halbzeitMs; LIVE.hzHalten=false; }
    if(LIVE.min>=SPIELMIN()){ return elferOderEnde(); }
    const tor=live.some(m=>m.ev.some(e=>e.typ==='tor'&&e.min===LIVE.min));
    renderKonferenz();
    LIVE.t=setTimeout(liveTakt, LIVE.phase==='halbzeit'?250:(W.msProMinute+(tor?W.torPauseMs:0))/UI.speed);
  } else if(LIVE.phase==='halbzeit'){
    if(!LIVE.hzHalten){ LIVE.hzRest-=250; if(LIVE.hzRest<=0) LIVE.phase='laeuft'; }
    renderKonferenz(); LIVE.t=setTimeout(liveTakt, LIVE.phase==='laeuft'?W.msProMinute/UI.speed:250);
  } else if(LIVE.phase==='elfer'){
    LIVE.elferStep++;
    const max=Math.max(0,...live.map(m=>m.elfer?m.elfer.length:0));
    if(LIVE.elferStep>=max){ LIVE.phase='ende'; renderKonferenz(); LIVE.t=setTimeout(liveEnde,2200/UI.speed); return; }
    renderKonferenz(); LIVE.t=setTimeout(liveTakt,W.elferMs/UI.speed);
  }
}
function elferOderEnde(){
  const live=LIVE.spiele.filter(m=>m.live);
  if(live.some(m=>m.elfer)){ LIVE.phase='elfer'; LIVE.elferStep=0; renderKonferenz(); LIVE.t=setTimeout(liveTakt,1200/UI.speed); }
  else { LIVE.phase='ende'; renderKonferenz(); LIVE.t=setTimeout(liveEnde,1500/UI.speed); }
}
function liveEnde(){
  clearTimeout(LIVE.t); const sp=LIVE.spiele; LIVE=null;
  try{ terminAbschliessen(sp); }
  finally{ delete S.laufend; zufallsQuelle(null); }
  speichern(); UI.tab='spieltag'; UI.sub='planung'; render(); window.scrollTo(0,0);
}
function terminBerechnen(){
  const spiele=terminVorbereiten(); for(const m of spiele) spieleKomplett(m);
  terminAbschliessen(spiele); speichern(); UI.tab='spieltag'; UI.sub='planung'; render(); window.scrollTo(0,0);
}
function simulieren(modus){
  let n = modus==='ende'? S.kalender.length-S.termin : modus==='winter'? S.winterIdx-S.termin : Number(modus);
  if(n<=0) return;
  if(UI.simStop && wichtigAlsNaechstes()){ toast('Als Nächstes kommt ein wichtiges Spiel. Live spielen oder den Haken entfernen.'); return; }
  UI.simLaeuft=true;
  const lauf=()=>{
    try{
      for(let i=0;i<S.manager.length;i++){ const c=mc(i); if(S.manager[i].auto.aufstellung) c.aufstellung=autoAufstellung(c); }
      const spiele=terminVorbereiten(); for(const m of spiele) spieleKomplett(m);
      terminAbschliessen(spiele); speichern(); n--;
      const stop=(UI.simStop && S.phase!=='saisonende' && wichtigAlsNaechstes()) || S.manager.some(m=>m.wahl);
      if(S.phase==='saisonende'||n<=0||S.termin===S.winterIdx||stop){
        UI.simLaeuft=false; speichern(); render(); if(stop&&n>0) toast('Angehalten: Als Nächstes kommt ein wichtiges Spiel.'); return;
      }
      S.phase='planung'; render(); setTimeout(lauf, W.simMsProTermin);
    }catch(err){ UI.simLaeuft=false; console.error(err); toast('Fehler beim Simulieren: '+err.message); }
  };
  lauf();
}

      if(!d) return toast('Diese Sicherung ist beschädigt und kann nicht geladen werden.');
      const jetzt=S&&UI.screen==='spiel'?JSON.stringify(S):ladeRoh();
      if(jetzt){ try{ await sicherungAnlegen('Vor Wiederherstellung',jetzt); }catch(e){ console.error(e); } }
      if(LIVE){ clearTimeout(LIVE.t); LIVE=null; }
      standUebernehmen(d); UI.overlay=null; UI.sel=null; UI.screen='spiel'; UI.tab='spieltag'; UI.sub='planung'; render(); toast(`Sicherung geladen: Saison ${d.saison}, Termin ${d.termin}.`);
    }).catch(e=>toast('Wiederherstellen nicht möglich: '+e.message)); },
  menuZu(){ clearTimeout(UI.rgT); UI.overlay=null; UI.rg=null; render(); },
  hinterZu(v,el,e){ if(e.target===el){ clearTimeout(UI.rgT); UI.overlay=null; UI.rg=null; render(); } },
  speichernDatei(){ download(`kreisklassenkaiser-s${S.saison}-t${S.termin}.json`,JSON.stringify(S),'application/json'); },
  csvExport(){ download(`kader-saison${S.saison}.csv`,kaderCsvExport(),'text/csv;charset=utf-8'); },
  formatAendern(v){ const e=formatAendern(v); if(e) return toast(e); speichern(); render(); toast('Saisonformat: '+W.formate[v]); },
  neuBestaetigen(){ if(confirm('Wirklich neues Spiel? Der aktuelle Stand im Browser wird beim nächsten Speichern überschrieben.')){ UI.overlay=null; ACT.neu(); } },
  hilfe(){ UI.overlay=()=>{ const fb=W.sport==='fussball', euro=S&&S.format==='komplett';
    const punkte=[
      'Jede Person plant im eigenen Bereich (oben umschalten): Aufstellung, '+W.worte.halle+', Finanzen, Markt.',
      `Alle drücken „Bereit“, dann „Live spielen“. Alle Familienspiele laufen gleichzeitig in der Konferenz, rund eine Minute pro Spiel.${fb?' Auf dem Mini-Spielfeld siehst du alle 22 Spieler und den Ball, die farbige Fläche zeigt, wer gerade angreift.':''} Hat niemand ein Spiel, wird der Termin sofort berechnet.`,
      `In der Halbzeit für alle, sonst über den Knopf „Pause“ (${W.live.pausen} pro Person und Spiel): Ausrichtung ändern und auswechseln, ${W.live.wechsel} Wechsel pro Spiel. Ausgewechselte dürfen nicht zurück.`,
      `Pokal: Der klassentiefere Verein hat Heimrecht, Unentschieden geht ins Elfmeterschießen. Ist der Gegner viel stärker, bekommt der Außenseiter einen Bonus.`,
      'Transfers und Nachwuchsprogramme nur in Sommer- und Winterpause.',
      `Am Saisonende: je ${W.auf} Auf- und Absteiger.${euro?' Die Plätze für die Europapokale ergeben sich aus der Vorjahrestabelle und dem Pokalsieger.':''}`,
      `Spieler im Kader antippen: Prämie zahlen (einzeln oder für alle), bei Wechselwunsch verhandeln. Wer lange auf der Bank sitzt, wird unzufrieden und will irgendwann weg. Ohne Einigung geht er am Ende des Transferfensters. Kostenlos: einen Stammplatz versprechen. Dann muss er die nächsten ${W.laune.stamm.spiele} Spiele in der Startelf stehen, sonst ist er richtig sauer.`
    ];
    return `<div class="overlay" data-a="hinterZu"><div class="box"><span class="lab">Anleitung</span>
      <div class="hinweis" style="color:var(--tinte)">${punkte.map((x,i)=>`${i+1}. ${h(sportText(x))}`).join('<br>')}</div>
      <button class="btn voll" data-a="menuZu">Verstanden</button></div></div>`; }; render(); }
};
const CHG={
  foto(el){ const [ort,i]=el.dataset.v.split('.'); const f=el.files&&el.files[0]; el.value='';
    fotoLaden(f).then(d=>{ if(ort==='setup') UI.setup.m[i].foto=d; else { S.manager[Number(i)].foto=d; speichern(); } render(); }).catch(e=>toast(e.message)); },
  setup(el){ const [i,k]=el.dataset.v.split('.'); const m=UI.setup.m[i]; m[k]=k==='liga'?Number(el.value):el.value; if(k==='liga'){ m.verein=null; render(); } else if(['verein','farbe','farbe2'].includes(k)) render(); },
  ve(el){ UI.vereinEdit[el.dataset.v]=el.value; if(el.type==='color') render(); },
  formation(el){ const c=mc(S.aktiv); c.aufstellung=autoAufstellung(c,el.value); render(); },
  ticket(el){ mc(S.aktiv).ticketFaktor=Number(el.value); render(); },
  preis(el){ mc(S.aktiv).merch.preis[el.dataset.v]=Math.max(1,Math.round(Number(el.value)||1)); render(); },
  mQuelle(el){ UI.markt.quelle=el.value; render(); },
  mLand(el){ UI.markt.land=el.value; render(); },
  mMax(el){ UI.markt.max=el.value; render(); },
  simStop(el){ UI.simStop=el.checked; },
  kLand(el){ UI.kLand=el.value; UI.kAlle=false; render(); },
  fokus(el){ const e=fokusSetzen(mc(S.aktiv),Number(el.dataset.v),el.value); if(e) toast(e); else render(); },
  tabLiga(el){ UI.tabLiga=EURO.includes(el.value)?el.value:Number(el.value); render(); },
  wb(el){ UI.wb=el.value; UI.alleRunden=false; render(); },
  hzRaus(el){ const i=el.dataset.v; LIVE.wahl[i]={...(LIVE.wahl[i]||{}),raus:el.value}; LIVE.hzHalten=true; renderKonferenz(); },
  hzRein(el){ const i=el.dataset.v; LIVE.wahl[i]={...(LIVE.wahl[i]||{}),rein:el.value}; LIVE.hzHalten=true; renderKonferenz(); },
  ladeDatei(el){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=migrieren(JSON.parse(r.result)); if(!d) throw 0; const vorher=ladeRoh(); if(vorher) sicherungStill('Vor Laden aus Datei',vorher); standUebernehmen(d); UI.overlay=null; UI.screen='spiel'; UI.tab='spieltag'; UI.sub='planung'; render(); }catch(e){ toast('Datei ist kein gültiger Spielstand (Version 2).'); } }; r.readAsText(f); },
  csvImport(el){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const e=kaderCsvImport(String(r.result)); if(e.fehler) return toast(e.fehler); UI.overlay=null; speichern(); render();
      toast(`${e.ersetzt} Kader ersetzt.${e.unbekannt.length?` Nicht gefunden: ${e.unbekannt.slice(0,3).join(', ')}${e.unbekannt.length>3?' …':''}.`:''}${e.fehlerZeilen?` ${e.fehlerZeilen} fehlerhafte Zeilen übersprungen.`:''}`); }; r.readAsText(f,'utf-8'); }
};
const NUR_PRAESIDENT=new Set(['bauen','anlageBauen','stand','bestellen','kampagne','angebot','internat','fest','umbenennenVerein','veSpeichern','veWappen','ticket','preis']);
const NUR_CHEF=new Set(['scoutHolen','scoutKauf','kaufen','pVerkaufen','msAngebot','msAntwort','msGegen','leihen','leihMenue','pBonus','bonusAlle','pHalte','pStamm','jtrainer','programm','hochziehen','umbenennenSpieler']);
const NUR_TRAINER=new Set(['beobachten','geheim','konterUebernehmen','selSpieler','autoElf','ausrichtung','pTauschen','pStamm','training','formation']);
const istSd = () => !!(S&&S.manager[S.aktiv]&&istSdAmt(S.manager[S.aktiv].amt));
const istCo = () => !!(S&&S.manager[S.aktiv]&&istCoAmt(S.manager[S.aktiv].amt));
const istPraesident = () => !S||!S.manager[S.aktiv]||!S.manager[S.aktiv].amt||S.manager[S.aktiv].amt.praesident;
function nurPraesident(name){ if(UI.screen==='spiel'&&NUR_CHEF.has(name)&&istCo()){ toast('Das entscheidet der Cheftrainer.'); render(); return true; }
  if(UI.screen==='spiel'&&NUR_TRAINER.has(name)&&istSd()){ toast('Aufstellung und Training macht der Cheftrainer.'); render(); return true; }
  if(UI.screen!=='spiel'||!NUR_PRAESIDENT.has(name)||istPraesident()) return false; toast('Das entscheidet der Vorstand. Nur als Präsident möglich.'); render(); return true; }
document.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; if(gastGesperrt(el.dataset.a,false,el,e)) return; if(nurPraesident(el.dataset.a)) return; const f=ACT[el.dataset.a]; if(f){ try{ f(el.dataset.v,el,e); }catch(err){ console.error(err); toast('Fehler: '+err.message); } } });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-c]'); if(!el) return; if(gastGesperrt(el.dataset.c,true,el)) return; if(nurPraesident(el.dataset.c)) return; const f=CHG[el.dataset.c]; if(f){ try{ f(el); }catch(err){ console.error(err); toast('Fehler: '+err.message); } } });
document.addEventListener('keydown',e=>{ if(UI.rg&&UI.overlay){ if(e.key==='ArrowRight') return ACT.rgSchritt(1); if(e.key==='ArrowLeft') return ACT.rgSchritt(-1); if(e.key==='Escape') return ACT.rgEnde(); } if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){ e.preventDefault(); e.target.click(); } });
window.addEventListener('beforeunload',()=>{ if(S&&UI.screen==='spiel'&&!LIVE) speichern(); });
</script>

<script id="mehrspieler">
// ================= MEHRSPIELER (Etappe 1+2: Raum, QR-Code, Zuschauer und Mitspieler auf Handys) =================
// Der Spielleiter rechnet und speichert wie bisher lokal und schickt nach jedem Speichern den Stand in den Raum.
// Mitspieler planen auf dem Handy: Anzeige-Aktionen laufen dort, alles, was den Spielstand ändert, wird als Aktion
// an den Spielleiter geschickt und dort mit dem Verein des Mitspielers ausgeführt. Der eigene lokale Spielstand
// eines Handys wird dabei nie überschrieben.
// Die Firebase-Web-Konfiguration ist kein Geheimnis: Geschützt wird über die Datenbank-Regeln.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB_EuHuhTXpd3JIEazGAywV1rdBmxR8N4U",
  authDomain: "kreisklassenkaiser.firebaseapp.com",
  databaseURL: "https://kreisklassenkaiser-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kreisklassenkaiser",
  storageBucket: "kreisklassenkaiser.firebasestorage.app",
  messagingSenderId: "1096331059463",
  appId: "1:1096331059463:web:94d5a42fccf1be15e125a2"
};
const FB_VERSION = '13.0.0';
const RAUM_RE = /^[A-Za-z0-9]{24}$/;
const RAUM_KEY = 'kk_raum', NAME_KEY = 'kk_spitzname';
const MP = { rolle:null, raum:null, uid:null, D:null, db:null, abos:[], anfragen:{}, mitglieder:{}, rev:0, timer:null,
  phase:null, fehler:null, name:'', gesendet:null, sendeFehler:null, standZeit:null, verbinde:false,
  rollen:{}, gastRolle:null, offen:0, erledigt:new Set(), schlange:[], nr:0, antwortId:null, ein:null, einGesendet:false,
  replay:false, trocken:false, toasts:[] };

function mpOnlineMoeglich(){ return location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname); }
async function mpFirebase(){
  if(MP.D) return;
  if(!mpOnlineMoeglich()) throw new Error('Mehrspieler geht nur über die Online-Adresse (…github.io), nicht mit einer Datei vom PC.');
  const b=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  let app, auth, db;
  try{ [app,auth,db]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-database.js'].map(f=>import(b+f))); }
  catch(e){ throw new Error('Keine Verbindung zum Online-Dienst. Ist das Internet an?'); }
  const a=app.getApps().length?app.getApp():app.initializeApp(FIREBASE_CONFIG);
  const au=auth.getAuth(a);
  await au.authStateReady();
  if(!au.currentUser) await auth.signInAnonymously(au);
  MP.uid=au.currentUser.uid; MP.db=db.getDatabase(a); MP.D=db;
}
const mpRef = p => MP.D.ref(MP.db, `raeume/${MP.raum}${p?'/'+p:''}`);
const mpVerweigert = e => /permission/i.test(String(e&&(e.code||e.message)));
function mpAbmelden(){ for(const f of MP.abos){ try{ f(); }catch(e){} } MP.abos=[]; clearTimeout(MP.timer); }
function mpZuruecksetzen(){ mpAbmelden(); Object.assign(MP,{rolle:null,raum:null,anfragen:{},mitglieder:{},phase:null,fehler:null,gesendet:null,sendeFehler:null,standZeit:null,verbinde:false,rollen:{},gastRolle:null,offen:0,schlange:[],antwortId:null,ein:null,einGesendet:false}); MP.erledigt.clear(); UI.gast=false; }
function neueRaumId(){
  const z='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', out=[], buf=new Uint8Array(64);
  while(out.length<24){ crypto.getRandomValues(buf); for(const x of buf){ if(x<248&&out.length<24) out.push(z[x%62]); } }
  return out.join('');
}
const mpLink = () => `${location.origin}${location.pathname}?raum=${MP.raum}`;
const mpName = s => String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,20);
function mpRender(){ if(UI.screen==='spiel'||UI.screen==='beitritt') render(); }

// ---------- Spielleiter ----------
function standPaket(){
  MP.rev++;
  return { json:JSON.stringify(S,(k,v)=>k==='foto'?undefined:v), rev:MP.rev, zeit:MP.D.serverTimestamp() };
}
async function mpRaumOeffnen(){
  if(!S) return toast('Erst ein Spiel starten oder fortsetzen.');
  MP.verbinde=true; mpRender();
  try{
    await mpFirebase();
    MP.raum=neueRaumId();
    await MP.D.update(mpRef(''), { leiter:MP.uid, [`mitglieder/${MP.uid}`]:'Spielleiter', stand:standPaket() });
    try{ localStorage.setItem(RAUM_KEY,MP.raum); }catch(e){}
    MP.gesendet=Date.now();
    mpLeiterVerbinden();
  }catch(e){ console.error(e); MP.raum=null; toast('Raum konnte nicht geöffnet werden: '+(e.message||e)); }
  finally{ MP.verbinde=false; mpRender(); }
}
function mpLeiterVerbinden(){
  mpAbmelden(); MP.rolle='leiter';
  const fehler=e=>{ console.error(e); MP.sendeFehler='Verbindung zum Raum unterbrochen.'; mpRender(); };
  MP.abos.push(MP.D.onValue(mpRef('anfragen'), s=>{
    const neu=s.val()||{};
    const dazu=Object.keys(neu).filter(k=>!MP.anfragen[k]);
    MP.anfragen=neu;
    if(dazu.length) toast(`${mpName(neu[dazu[0]])||'Jemand'} möchte deinem Raum beitreten.`); else mpRender();
  }, fehler));
  MP.abos.push(MP.D.onValue(mpRef('mitglieder'), s=>{ MP.mitglieder=s.val()||{}; mpRender(); }, fehler));
  MP.abos.push(MP.D.onValue(mpRef('rollen'), s=>{ MP.rollen=s.val()||{}; mpRender(); }, fehler));
  MP.abos.push(MP.D.onValue(mpRef('aktionen'), s=>{
    const alle=s.val()||{};
    for(const [uid,liste] of Object.entries(alle)) for(const [id,json] of Object.entries(liste||{})){
      const key=uid+'/'+id; if(MP.erledigt.has(key)) continue;
      MP.erledigt.add(key); MP.schlange.push({uid,id,json});
    }
    MP.schlange.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    mpVerarbeiten();
  }, fehler));
}
// Nach einem Neuladen: Raum vom letzten Mal wieder aufnehmen
async function mpLeiterAuto(){
  let id=null; try{ id=localStorage.getItem(RAUM_KEY); }catch(e){}
  if(!id||!RAUM_RE.test(id)||MP.rolle||UI.gast) return;
  if(!mpOnlineMoeglich()) return;
  try{
    await mpFirebase(); MP.raum=id;
    const l=(await MP.D.get(mpRef('leiter'))).val();
    if(l!==MP.uid) throw Object.assign(new Error('nicht Leiter'),{code:'PERMISSION_DENIED'});
    mpLeiterVerbinden(); mpSenden(0);
  }catch(e){
    MP.raum=null;
    if(mpVerweigert(e)){ try{ localStorage.removeItem(RAUM_KEY); }catch(x){} toast('Der Raum vom letzten Mal besteht nicht mehr.'); }
    else toast('Der Raum ist gerade nicht erreichbar. Ist das Internet an?');
  }
}
function mpSenden(ms=1200){
  if(MP.rolle!=='leiter'||!MP.raum||!S) return;
  clearTimeout(MP.timer);
  MP.timer=setTimeout(async()=>{
    try{ await MP.D.set(mpRef('stand'),standPaket()); MP.gesendet=Date.now(); MP.sendeFehler=null; }
    catch(e){ console.error(e); MP.sendeFehler='Der Spielstand konnte nicht in den Raum geschickt werden.'; mpRender(); }
  },ms);
}
function mpNachSpeichern(){ mpSenden(); if(!MP.replay) setTimeout(mpVerarbeiten); }
async function mpAufnehmen(uid,rolle){
  const name=mpName(MP.anfragen[uid]); if(!name) return;
  if(rolle!=='mitspieler') rolle='zuschauer';
  try{ await MP.D.update(mpRef(''),{[`mitglieder/${uid}`]:name,[`rollen/${uid}`]:rolle,[`anfragen/${uid}`]:null});
    toast(rolle==='mitspieler'?`${name} ist im Raum und sucht sich jetzt einen Verein aus.`:`${name} schaut jetzt zu.`); }
  catch(e){ console.error(e); toast('Aufnehmen hat nicht geklappt.'); }
}
async function mpAblehnen(uid){ try{ await MP.D.remove(mpRef(`anfragen/${uid}`)); }catch(e){ console.error(e); toast('Ablehnen hat nicht geklappt.'); } }
async function mpEntfernen(uid){
  if(uid===MP.uid) return;
  if(!confirm(`${mpName(MP.mitglieder[uid])} aus dem Raum nehmen?`)) return;
  try{ await MP.D.update(mpRef(''),{[`mitglieder/${uid}`]:null,[`rollen/${uid}`]:null}); }catch(e){ console.error(e); toast('Entfernen hat nicht geklappt.'); }
}
async function mpRaumSchliessen(){
  if(!confirm('Raum schließen? Alle Handys verlieren die Verbindung, der Stand im Netz wird gelöscht. Dein Spiel hier bleibt erhalten.')) return;
  try{ await MP.D.remove(mpRef('')); }catch(e){ console.error(e); return toast('Schließen hat nicht geklappt. Ist das Internet an?'); }
  try{ localStorage.removeItem(RAUM_KEY); }catch(e){}
  mpZuruecksetzen(); UI.overlay=null; render(); toast('Raum geschlossen und im Netz gelöscht.');
}

// ---------- Gast ----------
async function mpGastStart(){
  MP.phase='verbinde'; MP.fehler=null; render();
  try{
    await mpFirebase();
    const drin=(await MP.D.get(mpRef(`mitglieder/${MP.uid}`))).exists();
    if(drin) return mpGastAufgenommen();
    try{ MP.name=localStorage.getItem(NAME_KEY)||''; }catch(e){}
    MP.phase='name';
  }catch(e){ console.error(e); MP.phase='fehler'; MP.fehler=e.message||String(e); }
  render();
}
async function mpBeitreten(){
  const feld=document.querySelector('[data-c=mpName]'); if(feld) MP.name=feld.value;
  const name=mpName(MP.name);
  if(!name) return toast('Bitte einen Spitznamen eingeben.');
  try{ localStorage.setItem(NAME_KEY,name); }catch(e){}
  try{ await MP.D.set(mpRef(`anfragen/${MP.uid}`),name); }
  catch(e){ console.error(e); MP.phase='fehler'; MP.fehler='Die Anfrage kam nicht an. Stimmt der Link?'; return render(); }
  MP.phase='warten'; render();
  mpAbmelden();
  MP.abos.push(MP.D.onValue(mpRef(`mitglieder/${MP.uid}`), s=>{ if(s.exists()&&MP.phase==='warten') mpGastAufgenommen(); }, ()=>{}));
  MP.abos.push(MP.D.onValue(mpRef(`anfragen/${MP.uid}`), s=>{
    if(s.exists()||MP.phase!=='warten') return;
    setTimeout(async()=>{
      if(MP.phase!=='warten') return;
      try{ if((await MP.D.get(mpRef(`mitglieder/${MP.uid}`))).exists()) return mpGastAufgenommen(); }catch(e){}
      mpAbmelden(); MP.phase='abgelehnt'; render();
    },1500);
  }, ()=>{}));
}
function mpGastAufgenommen(){
  mpAbmelden(); MP.phase='drin'; MP.rolle='gast'; render();
  MP.abos.push(MP.D.onValue(mpRef(`rollen/${MP.uid}`), s=>{ MP.gastRolle=s.val()==='mitspieler'?'mitspieler':'zuschauer'; if(UI.gast) render(); }, ()=>{}));
  MP.abos.push(MP.D.onValue(mpRef(`antworten/${MP.uid}`), s=>{
    let a=null; try{ a=s.val()&&JSON.parse(s.val()); }catch(e){}
    if(!a||a.id===MP.antwortId) return;
    const erst=MP.antwortId===null; MP.antwortId=a.id;
    if(erst&&!MP.offen) return;
    MP.offen=Math.max(0,MP.offen-1);
    toast((a.toasts||[]).filter(Boolean).join(' ')||'Erledigt.');
  }, ()=>{}));
  MP.abos.push(MP.D.onValue(mpRef('stand'), s=>{
    const v=s.val(); if(!v||typeof v.json!=='string') return;
    let d=null; try{ d=migrieren(JSON.parse(v.json)); }catch(e){ console.error(e); }
    if(!d){ MP.fehler='Der Spielstand im Raum ist nicht lesbar. Läuft bei allen dieselbe Spielversion?'; return render(); }
    const aktiv=UI.gast&&S?S.aktiv:0;
    S=d; S.aktiv=Math.min(aktiv,S.manager.length-1); UI.gast=true; MP.standZeit=Date.now(); MP.fehler=null;
    const ich=eigenerMi(); if(ich>=0){ S.aktiv=ich; MP.einGesendet=false; }
    if(UI.sel!=null&&!(S.manager[S.aktiv]&&mc(S.aktiv).kader.some(p=>p.id===UI.sel))) UI.sel=null;
    if(LIVE){ clearTimeout(LIVE.t); LIVE=null; }
    if(UI.screen!=='spiel'){ UI.screen='spiel'; UI.tab='spieltag'; UI.sub='planung'; UI.overlay=null; }
    render();
  }, e=>{
    console.error(e); mpAbmelden(); UI.gast=false; S=null; UI.overlay=null;
    MP.phase=mpVerweigert(e)?'entfernt':'fehler'; MP.fehler=mpVerweigert(e)?null:'Verbindung zum Raum verloren.';
    UI.screen='beitritt'; render();
  }));
}
async function mpVerlassen(){
  if(!confirm('Raum verlassen?')) return;
  try{ if(MP.D&&MP.raum) await MP.D.remove(mpRef(`mitglieder/${MP.uid}`)); }catch(e){}
  try{ if(MP.D&&MP.raum) await MP.D.remove(mpRef(`anfragen/${MP.uid}`)); }catch(e){}
  mpZuruecksetzen(); S=null; UI.overlay=null; UI.screen='start';
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  render();
}

// ---------- Mitspieler: Verein auswählen und einsteigen ----------
const eigenerMi = () => S&&MP.uid ? S.manager.findIndex(m=>m.online===MP.uid) : -1;
const mpEinstiegNoetig = () => UI.gast&&S&&MP.gastRolle==='mitspieler'&&eigenerMi()<0;
// Läuft beim Spielleiter: fügt eine Person mitten im Spiel hinzu. Rückgabe: Fehlertext oder null.
function managerHinzufuegen(uid,d){
  if(!S) return 'Beim Spielleiter läuft gerade kein Spiel.';
  if(S.manager.some(m=>m.online===uid)) return 'Du hast schon einen Verein.';
  if(S.manager.length>=MGR_FARBEN.length) return `Höchstens ${MGR_FARBEN.length} Personen.`;
  d=d||{};
  const liga=Number(d.liga), D=W.ligen[liga];
  if(!D||!D.spielbar||D.keineLiga) return 'Diese Liga gibt es nicht.';
  const hc=W.handicap[d.handicap]?d.handicap:'Normal', name=mpName(d.name)||'Gast';
  let c;
  if(d.gruenden){
    const vn=String(d.vereinsname||'').replace(/[<>]/g,'').trim().slice(0,40); if(!vn) return 'Bitte einen Vereinsnamen eingeben.';
    const frei=S.ligen[liga].filter(id=>S.clubs[id].human<0); if(!frei.length) return 'In dieser Liga ist kein Platz frei.';
    c=S.clubs[pick(frei)];
    c.name=vn; c.kurz=(String(d.kurz||'').replace(/[^\p{L}0-9]/gu,'').toUpperCase().slice(0,3)||kuerzel(vn));
    if(farbeOk(d.farbe)) c.farbe=d.farbe; if(farbeOk(d.farbe2)) c.farbe2=d.farbe2; if(WAPPEN.includes(d.wappen)) c.wappen=d.wappen;
    c.land=L(c).land;
  } else {
    c=S.clubs[Number(d.verein)];
    if(!c||c.liga!==liga) return 'Bitte einen Verein aus der Liste wählen.';
    if(c.human>=0) return 'Diesen Verein spielt schon jemand.';
  }
  const mi=S.manager.length;
  menschlichMachen(c,mi,hc,!!d.gruenden);
  const mg={ name, club:c.id, handicap:hc, auto:{...W.handicap[hc].auto}, amt:neuesAmt(c), bereit:false,
    farbe:farbeOk(d.mfarbe)?d.mfarbe:MGR_FARBEN[mi%MGR_FARBEN.length], foto:null, online:uid };
  S.manager.push(mg);
  karriereInit(mg,c); amtSaisonStart(mi); museum(c);
  if(mg.auto.training) autoTraining(c);
  S.stellen=(S.stellen||[]).filter(s=>s.club!==c.id);
  c.meldung=`${name} übernimmt ${c.name}. Willkommen!`;
  return null;
}

const GAST_LOKAL=new Set(['springe','bereich','reiter','alleRunden','kAlle','musDetail','pTauschen','umbenennenVerein','veWappen','leihMenue',
  'stadionSel','erkl','blick','rundgang','rgSchritt','rgEnde','anlageSel','mFilter','hilfeBereich','menu','menuZu','hinterZu','hilfe','nRuecktritt',
  'mpVerlassen','mpBeitreten','mpNochmal','mpESet','mpEinsteigen']);
const GAST_LOKAL_CHG=new Set(['mQuelle','mLand','mMax','kLand','tabLiga','wb','ve','simStop','mpName','mpE']);
const GAST_REMOTE=new Set(['bereit','wahlAnnehmen','sJa','sNein','vEntscheid','nBewerben','nAusrichtung','nRuecktrittJa','bewerbenSd','bewerbenCo',
  'training','beobachten','geheim','konterUebernehmen','pGespraech','bewerben','kAnnehmen','kAblehnen','selSpieler','pBonus','bonusAlle','pStamm',
  'pHalte','pVerkaufen','ausrichtung','autoElf','auto','verkaufen','umbenennenSpieler','veSpeichern','hochziehen','programm','internat','leihen',
  'scoutHolen','scoutKauf','jtrainer','anlageBauen','fest','bauen','stand','bestellen','kampagne','angebot','kaufen','msAngebot','msAntwort','msGegen']);
const GAST_REMOTE_CHG=new Set(['formation','ticket','preis','fokus']);
// Gibt true zurück, wenn der normale Handler NICHT laufen soll.
function gastGesperrt(name,chg,el,e){
  if(!UI.gast) return false;
  const mitspieler=MP.gastRolle==='mitspieler'&&eigenerMi()>=0;
  if(!chg&&name==='spielerMenue'){ if(UI.sel==null) return false; name='selSpieler'; }
  if(!chg&&name==='selSpieler'&&(UI.sel==null||String(UI.sel)===String(el&&el.dataset.v))) return false;
  if(!chg&&name==='mgr'){ if(!mitspieler) return false; toast('Du spielst mit deinem eigenen Verein.'); return true; }
  if(chg?GAST_LOKAL_CHG.has(name):GAST_LOKAL.has(name)) return false;
  if(chg?GAST_REMOTE_CHG.has(name):GAST_REMOTE.has(name)){
    if(!mitspieler){ toast(MP.gastRolle==='mitspieler'?'Such dir zuerst einen Verein aus.':'Du schaust nur zu.'); if(chg) render(); return true; }
    if(!chg&&nurPraesident(name)) return true;
    mpGastRemote(name,chg,el,e); return true;
  }
  toast(['anpfiff','losgehts','sim','weiter'].includes(name)?'Das macht der Spielleiter.':'Das geht nur beim Spielleiter.');
  if(chg) render();
  return true;
}
// Probelauf auf einer Kopie: holt Rückfragen (Bestätigen, Betrag) beim Handy ab und setzt Anzeige-Zustand (z. B. Fenster zu).
function mpGastRemote(name,chg,el,e){
  const ui={sel:UI.sel, vereinEdit:UI.vereinEdit?{...UI.vereinEdit}:null, spielerId:UI.spielerId??null, leihId:UI.leihId??null};
  const f=chg?{value:el.value, checked:!!el.checked, v:el.dataset.v??null, type:el.type||''}:null;
  const echt=S, antw=[], oc=window.confirm, op=window.prompt; let abbruch=false;
  window.confirm=t=>{ const r=oc.call(window,t); antw.push(r); if(!r) abbruch=true; return r; };
  window.prompt=(t,d)=>{ const r=op.call(window,t,d); antw.push(r); if(r==null) abbruch=true; return r; };
  S=typeof structuredClone==='function'?structuredClone(S):JSON.parse(JSON.stringify(S)); MP.trocken=true;
  try{ chg?CHG[name](el):ACT[name](el.dataset.v,el,e); }catch(err){ console.error(err); }
  finally{ S=echt; MP.trocken=false; MP.toasts=[]; window.confirm=oc; window.prompt=op; }
  if(abbruch){ render(); return; }
  mpAktionSenden(chg?{c:name,f,ui,antw}:{a:name,v:el.dataset.v??null,ui,antw});
}
// Läuft beim Spielleiter: Aktion mit dem Verein des Mitspielers ausführen, Meldungen einsammeln.
function mpAktionAusfuehren(uid,msg){
  if(msg.a==='mpEinsteigen'){ if(MP.rollen[uid]!=='mitspieler') return ['Der Spielleiter hat dich als Zuschauer aufgenommen.']; const f=managerHinzufuegen(uid,msg.d); return [f||'Willkommen im Spiel! Dein Verein ist eingerichtet.']; }
  const mi=S.manager.findIndex(m=>m.online===uid);
  if(mi<0) return ['Du hast noch keinen Verein.'];
  if(MP.rollen[uid]==='zuschauer') return ['Du schaust nur zu.'];
  const name=msg.a||msg.c;
  if(msg.a?!GAST_REMOTE.has(name):!GAST_REMOTE_CHG.has(name)) return ['Das geht nur beim Spielleiter.'];
  if(msg.a==='bereit'){ if(S.phase!=='planung') return ['Gerade wird nicht geplant.']; const m=S.manager[mi]; m.bereit=!m.bereit; return [m.bereit?'Du bist bereit. Der Spielleiter startet, sobald alle so weit sind.':'Bereit zurückgenommen.']; }
  if((msg.a==='msAntwort'||msg.a==='msGegen')){ const id=Number(String(msg.v).split('|').pop()); const o=S.mitspielerAngebote.find(x=>x.id===id); if(!o||o.an!==mi) return ['Dieses Angebot ist nicht an dich.']; }
  const uiAlt={...UI}, aktivAlt=S.aktiv, oc=window.confirm, op=window.prompt, os=window.scrollTo, antw=[...(msg.antw||[])];
  MP.replay=true; MP.toasts=[];
  window.confirm=()=>antw.length?!!antw.shift():true;
  window.prompt=()=>antw.length?antw.shift():null;
  window.scrollTo=()=>{};
  const u=msg.ui||{};
  Object.assign(UI,{sel:u.sel??null, vereinEdit:u.vereinEdit||null, spielerId:u.spielerId??null, leihId:u.leihId??null, overlay:null});
  S.aktiv=mi;
  try{
    if(!(msg.a&&nurPraesident(name))){
      if(msg.a) ACT[name](msg.v, {dataset:{v:msg.v}, closest:()=>null}, {target:null});
      else { const f=msg.f||{}; CHG[name]({value:String(f.value??''), checked:!!f.checked, type:f.type||'', dataset:{v:f.v}}); }
    }
  }catch(err){ console.error(err); MP.toasts.push('Fehler: '+err.message); }
  finally{
    for(const k of Object.keys(UI)) if(!(k in uiAlt)) delete UI[k];
    Object.assign(UI,uiAlt); S.aktiv=aktivAlt; MP.replay=false;
    window.confirm=oc; window.prompt=op; window.scrollTo=os;
  }
  const t=MP.toasts; MP.toasts=[]; return t;
}
let mpArbeitet=false;
async function mpVerarbeiten(){
  if(mpArbeitet||MP.rolle!=='leiter'||!MP.schlange.length||!S||UI.screen!=='spiel'||LIVE||UI.simLaeuft) return;
  mpArbeitet=true;
  try{
    while(MP.schlange.length&&!LIVE&&!UI.simLaeuft){
      const {uid,id,json}=MP.schlange.shift();
      let msg=null; try{ msg=JSON.parse(json); }catch(e){}
      const toasts=msg?mpAktionAusfuehren(uid,msg):['Die Aktion war nicht lesbar.'];
      const wer=S.manager.find(m=>m.online===uid);
      if(msg&&msg.a==='bereit'&&wer) toast(`${wer.name} ${wer.bereit?'ist bereit.':'plant doch noch.'}`);
      try{ await MP.D.update(mpRef(''),{[`aktionen/${uid}/${id}`]:null,[`antworten/${uid}`]:JSON.stringify({id,toasts:toasts.slice(0,4).map(x=>String(x).slice(0,300))})}); }catch(e){ console.error(e); }
    }
    speichern(); render();
  } finally { mpArbeitet=false; }
}

function qrSvg(text){
  const q=qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(), r=4; let d='';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) d+=`M${x+r} ${y+r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*r} ${n+2*r}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR-Code zum Beitreten" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

      UI.overlay=()=>`<div class="overlay" data-a="hinterZu"><div class="box"><span class="lab">Menü</span><span class="hinweis" style="color:var(--tinte)">Du schaust im Raum des Spielleiters zu. Dein eigener Spielstand auf diesem Gerät bleibt unberührt.</span><button class="btn" data-a="hilfe">Kurze Anleitung</button><button class="btn rot" data-a="mpVerlassen">Raum verlassen</button><button class="btn voll" data-a="menuZu">Schließen</button></div></div>`; render(); },
    fortsetzen(){ altFort(); if(UI.screen==='spiel') mpLeiterAuto(); },
    spielStarten(){ altStart(); if(UI.screen==='spiel'){ if(MP.rolle==='leiter') mpSenden(0); else mpLeiterAuto(); } },
    mpOverlay(){ UI.overlay=mpOverlayHtml; render(); },
    mpOeffnen(){ mpRaumOeffnen(); },
    mpKopieren(){ navigator.clipboard.writeText(mpLink()).then(()=>toast('Link kopiert.'),()=>toast('Kopieren nicht möglich. Link bitte von Hand markieren.')); },
    mpAufnehmen(v){ const [u,r]=String(v).split('|'); mpAufnehmen(u,r); },
    mpAblehnen(v){ mpAblehnen(v); },
    mpEntfernen(v){ mpEntfernen(v); },
    mpSchliessen(){ mpRaumSchliessen(); },
    mpBeitreten(){ mpBeitreten(); },
    mpNochmal(){ mpAbmelden(); MP.phase=null; mpGastStart(); },
    mpVerlassen(){ mpVerlassen(); },
    mpESet(v){ const [k,x]=String(v).split('|'); if(!MP.ein) mpEinstiegStart(); if(k==='gruenden') MP.ein.gruenden=x==='1'; else MP.ein[k]=x; render(); },
    mpEinsteigen(){ if(!MP.ein) return; const E={...MP.ein};
      for(const el of document.querySelectorAll('[data-c=mpE]')) E[el.dataset.v]=el.value;
      if(!mpName(E.name)) return toast('Bitte einen Namen eingeben.');
      if(E.gruenden&&!String(E.vereinsname).trim()) return toast('Bitte einen Vereinsnamen eingeben.');
      if(!E.gruenden&&E.verein==='') return toast('Bitte einen Verein auswählen.');
      MP.ein=E; MP.einGesendet=true; mpAktionSenden({a:'mpEinsteigen',d:E}); }
  });
  Object.assign(CHG,{ mpName(el){ MP.name=el.value; },
    mpE(el){ if(!MP.ein) mpEinstiegStart(); const k=el.dataset.v; MP.ein[k]=k==='liga'?Number(el.value):el.value; if(k==='liga'){ MP.ein.verein=''; render(); } } });
}
// Start: Mit ?raum=… im Link als Gast beitreten, sonst normal
{
  const raum=new URLSearchParams(location.search).get('raum');
  if(raum!==null){
    UI.screen='beitritt';
    if(RAUM_RE.test(raum)){ MP.raum=raum; mpGastStart(); }
    else { MP.phase='fehler'; MP.fehler='Der Link ist unvollständig. Bitte den QR-Code noch einmal scannen.'; render(); }
  } else render();
}
</script>
