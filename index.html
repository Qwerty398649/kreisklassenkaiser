// ---------- Termin abschließen ----------
function terminAbschliessen(spiele){
  const t=aktTermin(), regen=rnd()<W.regenChance, fensterSchliesst=S.termin===0||S.termin===S.winterIdx;
  for(const m of spiele){
    const e={h:m.h,a:m.a,th:m.th,ta:m.ta,ie:m.ie,sieger:m.sieger};
    if(m.art==='liga'){ eintragenIn(S.tab,m); formEintragen(m); }
    else if(m.art==='pokal'){ pokalRunde(m.wb,m.runde).erg.push(e); }
    else if(m.art==='euro'){ const E=S.euro[m.wb], LP=W.euro.ligaphase; if(m.runde<=LP){ eintragenIn(E.tab,m); E.erg.push({...e,runde:m.runde}); } else E.ko[m.runde-LP-1].erg.push(e); }
  }
  familienduelleEintragen(spiele);
  // Runden auswerten
  if(t.art==='pokal'){
    const keys=t.wb==='vp'?['vp']:LAENDER;
    for(const key of keys){ const P=S.pokale[key], R=P&&P.runden[t.runde-1]; if(!R) continue; P.alive=[...R.erg.map(e=>e.sieger),...R.frei]; if(P.alive.length===1&&key!=='vp') P.sieger=P.alive[0]; }
  }
  if(t.art==='euro'&&S.euro){
    for(const wb of EURO){ const E=S.euro[wb], LP=W.euro.ligaphase;
      if(t.runde>=LP && t.runde<LP+W.euro.koNamen.length) euroKoBauen(wb,t.runde+1);
      if(t.runde===LP+W.euro.koNamen.length){ E.sieger=E.ko[E.ko.length-1].erg[0].sieger; S.euroSieger[wb]=E.sieger; } }
  }
  if(t.art==='super') S.superErg=spiele.map(m=>({h:m.h,a:m.a,th:m.th,ta:m.ta,ie:m.ie,sieger:m.sieger,label:m.label}));
  // Sperren, Verletzungen, Serien
  for(const c of S.clubs){ const physio=c.human>=0?anlageWert(c,'physio'):0;
    for(const p of c.kader){ if(p.verletzt>0) p.verletzt--; if(p.verletzt>0&&physio&&rnd()<physio) p.verletzt--; if(p.gesperrt>0) p.gesperrt--; } }
  for(const m of spiele) for(const x of m.strafen){ const c=[S.clubs[m.h],S.clubs[m.a]].find(k=>k.kader.some(p=>p.id===x.pid)); const p=c&&c.kader.find(q=>q.id===x.pid); if(p) p[x.art]=Math.max(p[x.art],x.n); }
  for(const m of spiele) if(m.art==='liga') for(const s of [0,1]) for(const x of spielerVon(m,s)){ if(x.p._tor){ x.p.serie++; delete x.p._tor; } else x.p.serie=0; }
  for(const m of spiele) for(const s of [0,1]) for(const x of spielerVon(m,s)) delete x.p._tor;
  S.termin++;
  for(let mi=0;mi<S.manager.length;mi++){ const c=mc(mi); menschAbrechnen(c, spiele.find(m=>m.h===c.id||m.a===c.id), t, regen); }
  for(let mi=0;mi<S.manager.length;mi++){ vorstandTermin(mi); sitzungTermin(mi);
    if(t.art==='liga'&&!S.manager[mi].wahl){ const c=mc(mi), b=trainingTermin(c); if(b.length) c.meldung+=` Training: ${b.join(', ')} ${b.length>1?'haben':'hat'} sich verbessert.`; } }
  nationalTermin(t);
  if(fensterSchliesst) for(let mi=0;mi<S.manager.length;mi++){ const c=mc(mi), w=wechselAbgaenge(c); vertrauenAbgang(mi,w.filter(x=>x.includes('hat den Verein verlassen')).length); if(w.length) c.meldung+=' '+w.join(' '); }
  S.letzte={ termin:S.termin, label:terminLabel(t), art:t.art, saison:S.saison, regen,
    spiele:spiele.map(m=>({h:m.h,a:m.a,th:m.th,ta:m.ta,ie:m.ie,label:m.label,art:m.art,liga:m.liga,live:m.live,wunder:m.wunder&&m.sieger!=null&&m.bonus[m.sieger===m.h?0:1]>0,
      tore:m.ev.filter(e=>e.typ==='tor'||e.typ==='elfer').map(e=>({min:e.min,s:e.s,txt:e.txt}))})) };
  S.mitspielerAngebote=[];
  for(const mg of S.manager) mg.bereit=false;
  if(S.termin===S.winterIdx) for(let mi=0;mi<S.manager.length;mi++){ const c=mc(mi); c.programme={}; if(S.manager[mi].auto.training) autoTraining(c); }
  S.phase = S.termin>=S.kalender.length ? 'saisonende' : 'auswertung';
  stellenmarktTermin(t.art==='liga');
  abgaengePruefen();
  // Auslosung des nächsten Termins sofort ziehen, damit sie mitgespeichert wird und nicht durch Neuladen neu gezogen werden kann
  if(S.termin<S.kalender.length) paarungenTermin();
}
function menschAbrechnen(c,m,t,regen){
  const D=L(c), X=W.stadion, buch=c._buch||[]; c._buch=[];
  const zeilen=[]; let z=0, heim=false, gegner=null, eigene=0, gegen=0;
  const ligaTermin=t.art==='liga', runde=ligaTermin?ligaRunde(D,t.nr):null;
  if(m){
    heim=m.h===c.id; gegner=S.clubs[heim?m.a:m.h]; eigene=heim?m.th:m.ta; gegen=heim?m.ta:m.th;
    if(heim && !m.neutral){
      const k=kapazitaet(c), n=D.vereine;
      const dachAnteil=summe(Object.keys(TRIB).map(x=>c.stadion.trib[x].dach?tribKap(c.stadion,x):0))/Math.max(1,k.frei);
      let f;
      if(m.art==='liga'){ const p=platzVon(c), gp=platzVon(gegner); f=(0.55+0.45*(n+1-p)/n)*(0.9+0.2*(n+1-gp)/n); }
      else { f=clamp(1+X.pokalZuschauer*Math.max(0,niv(c)-niv(gegner)),1,X.pokalMax); if(m.art==='euro') f*=X.euroZuschauer; if(m.art==='super') f*=1.2; }
      let zz=c.fans*f*c.stimmung*(1+anlageWert(c,'familie'));
      if(c.kampagne) zz*=1+c.kampagne.bonus;
      if(c.stadion.flutlicht) zz*=1+X.flutlichtBonus;
      if(regen) zz*=0.85+X.dachRegen*dachAnteil;
      const tf=c.ticketFaktor; zz*= tf>=1 ? clamp(1-0.9*(tf-1),0.3,1) : 1+0.4*(1-tf);
      z=Math.round(Math.min(k.frei,zz));
      const preis=D.ticket*tf;
      zeilen.push({t:`Zuschauer ${zahl(z)} × ${preis.toLocaleString('de-DE',{maximumFractionDigits:2})} €`,v:z*preis});
      const logen=summe(Object.keys(TRIB).map(x=>c.stadion.trib[x].vip&&!imBau(c.stadion,x)?X.vipLogen:0));
      if(logen) zeilen.push({t:`VIP-Logen (${logen})`,v:Math.round(logen*vipProLoge(c)*c.stimmung)});
      const tq=D.ticket/3, bg=anlageWert(c,'biergarten'), mu=anlageWert(c,'museum');
      if(bg&&z) zeilen.push({t:W.anlagen.biergarten.stufen[anlageStufe(c,'biergarten')-1],v:z*bg*tq});
      if(mu&&z) zeilen.push({t:'Museumsbesucher',v:z*mu*tq*(1+0.1*Math.min(10,museum(c).erfolge.length))});
      const merch=merchVerkauf(c, Math.round(z*W.merch.staende[c.merch.stand].quote*c.stimmung));
      if(merch.stueck) zeilen.push({t:`Merch (${merch.stueck} Stück)`,v:merch.umsatz});
      if(m.art==='liga' && pflichtVerletzt(c) && S.saison!==c.gnadeSaison){ const s=pflichtStrafe(c); zeilen.push({t:'Strafe Ligapflicht',v:-s}); c.meldungExtra=meldung('strafe',{x:eur(s)}); }
    } else if(c.merch.stand==='fanshop'||c.merch.stand==='megastore'){
      const merch=merchVerkauf(c, Math.round(c.fans*W.merch.onlineQuote*c.stimmung));
      if(merch.stueck) zeilen.push({t:`Onlineshop (${merch.stueck} Stück)`,v:merch.umsatz});
    }
    // Prämien
    const gewonnen=(m.sieger!=null?m.sieger===c.id:eigene>gegen);
    if(m.art==='pokal'){ const pr= m.wb==='vp' ? W.pokal.vpPraemie : W.pokal.praemie1*Math.pow(2,m.runde-1); zeilen.push({t:`Prämie ${S.pokale[m.wb].name}`,v:pr}); }
    if(m.art==='euro'){ const E=W.euro[m.wb], LP=W.euro.ligaphase;
      if(m.runde===1) zeilen.push({t:`Startgeld ${E.name}`,v:E.start});
      if(m.runde<=LP&&gewonnen) zeilen.push({t:`Siegprämie ${E.name}`,v:E.sieg});
      if(m.runde>LP) zeilen.push({t:`Prämie ${E.name} · ${W.euro.koNamen[m.runde-LP-1]}`,v:E.ko[m.runde-LP-1]}); }
    if(m.art==='super'&&gewonnen) zeilen.push({t:`Siegprämie ${m.label}`,v:m.wb==='uefa'?W.euro.superPraemie:W.pokal.supercup});
  }
  if(runde){
    const rps=rundenProSaison(D), platz=platzVon(c);
    const sp=sponsorSumme(c)/rps; if(sp) zeilen.push({t:'Werbepartner',v:sp});
    const sol=anlageWert(c,'solar')*ertragsFaktor(c); if(sol) zeilen.push({t:'Stromverkauf',v:sol});
    const unt=anlagenUnterhalt(c); if(unt) zeilen.push({t:'Unterhalt Vereinsanlagen',v:-unt});

    const jt=trainerVon(c).gehalt*ertragsFaktor(c); if(jt) zeilen.push({t:`Jugendtrainer (${trainerVon(c).name})`,v:-jt});
    const sg=(scoutVon(c).gehalt||0)*ertragsFaktor(c); if(sg) zeilen.push({t:scoutVon(c).name,v:-sg});
    const g=summe(c.kader.map(p=>gehalt(p,c.liga)))*34/rps; zeilen.push({t:D.niveau>=W.aufwandAbNiveau&&D.land==='DE'?'Aufwandsentschädigung':'Gehälter',v:-g});
  }
  let ausv=0;
  if(ligaTermin) for(const a in c.merch.lager){ for(const b of c.merch.lager[a]){ b.alter++; if(b.alter>=W.merch.ausverkaufNach&&b.n>0){ zeilen.push({t:`Ausverkauf ${W.merch.artikel[a].name} (${b.n})`,v:b.n*c.merch.preis[a]*W.merch.ausverkaufQuote}); ausv+=b.n; b.n=0; } } c.merch.lager[a]=c.merch.lager[a].filter(b=>b.n>0); }
  const sTermin=summe(zeilen.map(x=>x.v));
  c.konto+=sTermin;
  c.abrechnung={termin:S.termin, label:terminLabel(t), zuschauer:z, heim, zeilen:[...buch,...zeilen], summe:sTermin};
  const mgr=S.manager[c.human];
  if(mgr.auto.finanzen && ligaTermin){
    for(const a in W.merch.artikel) if(artikelVerfuegbar(c,a)&&lagerBestand(c,a)<W.merch.nachbestellenUnter&&c.konto>2000*D.lf) bestellen(c,a,0);
    for(const o of [...c.angebote]) angebotAnnehmen(c,o.id);
  }
  // Bau
  const fertig=[];
  for(const b of c.stadion.bau){ b.rest--; if(b.rest<=0) fertig.push(b); }
  c.stadion.bau=c.stadion.bau.filter(b=>b.rest>0);
  for(const b of c.anlagenBau||[]){ b.rest--; if(b.rest<=0){ c.anlagen=c.anlagen||{}; c.anlagen[b.id]=b.stufe; fertig.push({name:`${W.anlagen[b.id].stufen[b.stufe-1]}`,art:'anlage',id:b.id}); } }
  if(c.anlagenBau) c.anlagenBau=c.anlagenBau.filter(b=>b.rest>0);
  if(c.merch.bau){ c.merch.bau.rest--; if(c.merch.bau.rest<=0){ c.merch.stand=c.merch.bau.typ; fertig.push({name:W.merch.staende[c.merch.stand].name,art:'stand',id:'shop'}); c.merch.bau=null; } }
  if(c.internatBau){ c.internatBau--; if(!c.internatBau){ c.internat=true; fertig.push({name:'Das Jugendinternat',art:'internat',id:'internat'}); } }
  if(c.kampagne){ c.kampagne.rest--; if(c.kampagne.rest<=0) c.kampagne=null; }
  if(c.merch.sonderRest>0 && ligaTermin) c.merch.sonderRest--;
  // Stimmung
  let wechselNeu=[], stammInfo=[]; const jugendInfo=[];
  if(m){
    const won=m.sieger!=null?m.sieger===c.id:eigene>gegen, lost=m.sieger!=null?m.sieger!==c.id:eigene<gegen;
    if(won){ c.stimmung=clamp(c.stimmung+W.stimmung.sieg,W.stimmung.min,W.stimmung.max); c.fans*=1+W.fans.sieg; }
    else if(lost){ c.stimmung=clamp(c.stimmung+W.stimmung.niederlage,W.stimmung.min,W.stimmung.max); c.fans*=1+W.fans.niederlage; }
    c.fans=Math.max(50,Math.round(c.fans));
    const ln=launeNachSpiel(c,m,won,lost); wechselNeu=ln.neu; stammInfo=ln.stamm;
  }
  // Jugend
  if(ligaTermin){
    const J=W.jugend, T=trainerVon(c), u=u19Spiel(c);
    c.u19Erg=u;
    const pk=u19PokalRunde(c,t.nr); if(pk) jugendInfo.push(pk);
    if(t.nr===W.kalender.winterNach){ const ht=hallenturnier(c); if(ht) jugendInfo.push(ht); }
    for(const tl of c.jugend){
      if(tl.leihe){ leiheTermin(c,tl); continue; }
      const ch=jugendChance(c,tl)+(u?J.u19.einsatz+(u.sieg?J.u19.sieg:0):0);
      if(rnd()<ch && tl.staerke<tl.cap+T.cap) tl.staerke++;
      if(rnd()<J.rueckschlag*(J.fokus[fokusVon(tl)].rueck??1)) tl.staerke=Math.max(1,tl.staerke-ri(1,3));
    }
    if(t.nr%J.trendAlle===0) for(const tl of c.jugend.filter(x=>!x.leihe)){ if(tl.letzte!==null) tl.trend= tl.staerke>tl.letzte?'steigt':tl.staerke<tl.letzte?'fällt':'stagniert'; tl.letzte=tl.staerke; }
    { const rd=rohdiamantenWachsen(c); if(rd.length) jugendInfo.push(`Rohdiamant${rd.length>1?'en':''} ${rd.join(', ')} ${rd.length>1?'haben':'hat'} sich verbessert.`); }
    const tr=anlageWert(c,'training'), twb=anlageWert(c,'torwart');
    if(tr||twb) for(const p of c.kader){ const ch=(p.alter<=26?tr:0)+(p.pos==='TW'&&p.alter<=32?twb:0); if(ch&&p.staerke<99&&rnd()<ch) p.staerke++; }
    if(rnd()<W.sponsor.neuChance) sponsorAngebote(c,false);
  }
  if(S.termin===S.winterIdx) jugendInfo.push(...leihenZurueck(c));
  if(c.jugendAbgang){ jugendInfo.push(...c.jugendAbgang); delete c.jugendAbgang; }
  // Pokalsieg
  const wbSieg = m && m.final && m.sieger===c.id && m.art!=='super';
  if(wbSieg){ sonderedition(c); c.fans=Math.round(c.fans*(1+W.fans.pokalsieg)); }
  // Meldung
  const rekordNeu=museumNachSpiel(c,m,heim,eigene,gegen,z,wbSieg);
  c.meldung=meldungFuer(c,m,heim,eigene,gegen,fertig,ausv,wbSieg);
  if(m&&m.konter&&m.konter[heim?0:1].length) c.meldung+=` Die Gegnerbeobachtung hat sich ausgezahlt (${m.konter[heim?0:1].join(', ')}).`;
  if(rekordNeu.length) c.meldung+=` Neuer Vereinsrekord: ${rekordNeu.join(' und ')}! Schon im Museum.`;
  if(wechselNeu.length) c.meldung+=' '+meldung('wechsel',{s:wechselNeu.join(', ')});
  for(const x of stammInfo) c.meldung+=' '+meldung(x.ok?'stammOk':'stammBruch',{s:x.name});
  if(jugendInfo.length) c.meldung+=' '+jugendInfo.join(' ');
  vertrauenNachTermin(c,m,t,fertig,ligaTermin);
  c.meldungExtra=null; c.fertig=fertig.map(f=>f.name); c.fertigBlick=[...new Set(fertig.map(f=>f.id&&blickVon(f.id)).filter(Boolean))];
}
function meldungFuer(c,m,heim,eigene,gegen,fertig,ausv,wbSieg){
  if(fertig.some(f=>f.art==='flutlicht')) return meldung('flutlicht',{});
  if(fertig.length) return meldung('bau',{b:fertig[0].name});
  if(c.meldungExtra) return c.meldungExtra;
  if(!m) return meldung('spielfrei',{});
  const e=`${S.clubs[m.h].kurz} ${ergebnisText(m)} ${S.clubs[m.a].kurz}`, g=S.clubs[heim?m.a:m.h];
  if(wbSieg) return meldung('pokalSieg',{v:c.name,w:wbName(m)});
  if(m.ko){
    if(m.sieger===c.id){ if(niv(g)<niv(c)-1) return meldung('pokalWunder',{v:c.kurz,g:g.name}); if(m.ie) return meldung('elfer',{}); return meldung('pokalWeiter',{w:wbName(m),v:c.kurz}); }
    return meldung('pokalAus',{w:wbName(m)});
  }
  if(m.art==='euro'&&heim) return meldung('euroAbend',{});
  const torjaeger=c.kader.filter(p=>p.serie>=3).sort((a,b)=>b.serie-a.serie)[0];
  if(torjaeger&&torjaeger.serie===3&&W.sport!=='handball') return meldung('serie',{s:torjaeger.name});
  if(m.art==='liga'&&platzVon(c)===1&&eigene>gegen) return meldung('fuehrer',{});
  if(ausv>50) return meldung('restposten',{x:ausv});
  const ers={v:c.kurz,e};
  if(eigene-gegen>=3) return meldung('sieghoch',ers);
  if(eigene>gegen) return meldung('sieg',ers);
  if(eigene===gegen) return meldung('remis',ers);
  if(gegen-eigene>=3) return meldung('niederlagehoch',ers);
  return meldung('niederlage',ers);
}

// ---------- Präsident: Mitglieder-Vertrauen und Jahreshauptversammlung ----------
// Das Amt gehört der Person (S.manager[i].amt), gilt aber nur für ihren aktuellen Verein.
// praesident=true: Trainer und Präsident, die Mitglieder bewerten. false: nur Trainer, der Vorstand bewertet.
function neuesAmt(c,praesident=true){ return { verein:c.id, seit:S.saison, seitTermin:S.termin, rolle:'chef', praesident, vertrauen:praesident?W.vertrauen.start:W.vertrauen.trainerStart, gruende:{}, vota:[], start:null, jhv:null, raus:null }; }
const amtVon = mi => S.manager[mi].amt;
// Volle Saisons im Amt, die laufende eingerechnet, wenn man zur Sommerpause angefangen hat.
const volleSaisons = A => S.saison-A.seit+((A.seitTermin??1)===0?1:0);
const amtGrenze = A => A.praesident?W.vertrauen.grenze:A.rolle==='co'?W.co.grenze:W.vertrauen.trainerGrenze;
const ROLLE_NAME={chef:'Trainer', co:'Co-Trainer', sd:'Sportdirektor'};
const rolleText = A => !A?'Trainer':A.praesident?'Trainer und Präsident':ROLLE_NAME[A.rolle]||'Trainer';
function erwartungPlatz(c){
  if(L(c).keineLiga) return 0;
  const ids=[...S.ligen[c.liga]].sort((a,b)=>staerke(S.clubs[b])-staerke(S.clubs[a]));
  return ids.indexOf(c.id)+1;
}
function amtSaisonStart(mi){
  const A=amtVon(mi), c=mc(mi); if(!A) return;
  A.start={ saison:S.saison, konto:c.konto, erwartung:erwartungPlatz(c), ticket:c.ticketFaktor, serie:0, ligaSpiele:0, staerke:staerke(c), kern:kernStaerke(c) };
}
// Ein Grund pro Schlüssel und Saison, gleichartige Ereignisse werden zusammengezählt.
function vertrauenGrund(mi,key,text,d){
  const A=amtVon(mi); if(!A||!d) return;
  const g=A.gruende[key]||(A.gruende[key]={t:text,d:0,n:0});
  g.t=text; g.d=Math.round((g.d+d)*10)/10; g.n++;
  A.vertrauen=clamp(Math.round((A.vertrauen+d)*10)/10,0,100);
}
const vertrauenGruende = A => Object.values(A.gruende).filter(g=>Math.round(g.d)!==0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
function vertrauenNachTermin(c,m,t,fertig,ligaTermin){
  const mi=c.human, A=amtVon(mi), X=W.vertrauen; if(!A||A.raus) return;
  coNachSpiel(mi,c,m);
  if(!A.start) amtSaisonStart(mi);
  const st=A.start;
  if(m){
    const heim=m.h===c.id, eigene=heim?m.th:m.ta, gegen=heim?m.ta:m.th, g=S.clubs[heim?m.a:m.h];
    const won=m.sieger!=null?m.sieger===c.id:eigene>gegen, lost=m.sieger!=null?m.sieger!==c.id:eigene<gegen;
    if(m.art==='liga'){
      st.ligaSpiele=(st.ligaSpiele||0)+1;
      st.serie = won ? Math.max(1,st.serie+1) : lost ? Math.min(-1,st.serie-1) : 0;
      if(!istCoAmt(A)){
        if(st.serie===X.serieAb) vertrauenGrund(mi,'siegserie','Siegesserien',X.siegserie);
        if(st.serie===-X.serieAb) vertrauenGrund(mi,'pleiteserie','Niederlagenserien',X.pleiteserie);
      }
      if(!A.praesident&&(A.rolle||'chef')==='chef'&&st.erwartung&&st.ligaSpiele%X.trendAlle===0){
        const d=st.erwartung-platzVon(c);
        vertrauenGrund(mi,'trend','Tabellenplatz im Saisonverlauf',clamp(d*X.trendProPlatz,-X.trendMax,X.trendMax));
      }
    }
    if(m.ko&&m.art!=='super'&&won&&niv(g)<niv(c)-1) vertrauenGrund(mi,'wunder','Pokalwunder',X.pokalwunder);
    if(m.final&&won&&m.art!=='super') vertrauenGrund(mi,'titel_'+m.art,m.art==='euro'?'Europapokalsieg':'Pokalsieg',X.pokalsieg);
  }
  if(istCoAmt(A)&&ligaTermin) vertrauenGrund(mi,'coAlltag','Der Chef erwartet Fortschritte',(W.co.driftZiel-A.vertrauen)*W.co.drift);
  if(A.praesident){
    if(ligaTermin){
      const alt=st.ticket??1, neu=c.ticketFaktor;
      if(neu>alt+0.001) vertrauenGrund(mi,'ticketHoch','Ticketpreise erhöht',-(neu-alt)*X.ticketHoch);
      if(neu<alt-0.001) vertrauenGrund(mi,'ticketRunter','Ticketpreise gesenkt',(alt-neu)*X.ticketRunter);
      st.ticket=neu;
      if(c.konto<0) vertrauenGrund(mi,'minus','Konto im Minus',X.minus);
    }
    for(const f of fertig) vertrauenGrund(mi,'bau','Neue Bauten im Verein',X.bau);
  } else if(st.ligaSpiele>=X.entlassAbSpielen && A.vertrauen<amtGrenze(A)){
    amtRaus(mi,'entlassen');
    c.meldung+=` Der Vorstand hat genug: ${S.manager[mi].name} wird als Trainer entlassen und muss den Verein verlassen.`;
  }
}
function vertrauenAbgang(mi,anzahl){ const A=amtVon(mi); if(anzahl&&A&&A.praesident) vertrauenGrund(mi,'abgang','Spieler im Streit verloren',W.vertrauen.abgang*anzahl); }
// Saisonbilanz eintragen und abstimmen. Läuft im Saisonwechsel, bevor Auf- und Abstieg umgesetzt werden.
function jahreshauptversammlung(mi,vj){
  const A=amtVon(mi), c=mc(mi), X=W.vertrauen, D=L(c); if(!A||A.raus) return null;
  const st=A.start||{konto:c.konto,erwartung:0};
  if(!D.keineLiga){
    const platz=vj.tab[c.liga].indexOf(c.id)+1, n=vj.tab[c.liga].length;
    const hoch=platz<=W.auf&&W.ligen.some(x=>x.unter===D.id), runter=D.unter&&platz>n-W.auf;
    if(st.erwartung&&!istCoAmt(A)){ const diff=st.erwartung-platz;
      vertrauenGrund(mi,'platz',`Platz ${platz} (erwartet: ${st.erwartung})`,clamp(diff*X.proPlatz,-X.platzMax,X.platzMax)); }
    if(platz===1) vertrauenGrund(mi,'meister','Meisterschaft',X.meister);
    if(hoch) vertrauenGrund(mi,'aufstieg','Aufstieg',X.aufstieg);
    if(runter&&!istCoAmt(A)) vertrauenGrund(mi,'abstieg','Abstieg',X.abstieg);
  }
  const erg={saison:S.saison, verein:c.name, praesident:A.praesident};
  if(A.praesident){
    vorstandJhv(mi);
    const bilanz=c.konto-st.konto;
    if(bilanz>0) vertrauenGrund(mi,'bilanz',`Gewinn in der Saison (${eur(bilanz)})`,X.gewinn);
    else if(bilanz<0) vertrauenGrund(mi,'bilanz',`Verlust in der Saison (${eur(-bilanz)})`,X.verlust);
    A.vota=A.vota.filter(s=>S.saison-s<X.votumVerfall);
    const schonfrist=S.saison-(A.seit??0)<X.schonfrist;
    erg.votum=0;
    if(A.vertrauen<X.grenze&&!schonfrist){ A.vota.push(S.saison); erg.votum=A.vota.length; }
    erg.schonfrist=schonfrist&&A.vertrauen<X.grenze;
    if(erg.votum>=2) amtRaus(mi,'abgewaehlt');
  } else {
    erg.co=istCoAmt(A); erg.sd=istSdAmt(A);
    if(erg.sd) sdSaisonende(mi,A,c);
    if(A.vertrauen<amtGrenze(A)){ erg.entlassen=true; amtRaus(mi,'entlassen'); }
    else if(erg.sd) rufAendern(mi,`Sportdirektor bei ${c.name}`,W.sd.rufSaison);
    else if(!erg.co&&A.vertrauen>=X.wahlAb&&volleSaisons(A)>=X.wahlNachSaisons){ erg.gewaehlt=true; zumPraesidentenGewaehlt(mi); }
    else if(erg.co){ const Y=W.co, a=coArbeit(A);
      rufAendern(mi,`Co-Trainer bei ${c.name}`,Y.rufCoSaison);
      rufAendern(mi,'Gute Arbeit als Co-Trainer',Math.min(Y.rufArbeitMax,a.training*Y.rufProTraining+a.gespraeche*Y.rufProGespraech+a.vorschlaege*Y.rufProVorschlag));
      erg.arbeit={...a}; A.coArbeit=null; }
  }
  erg.vertrauen=A.vertrauen; erg.gruende=vertrauenGruende(A);
  rufSaisonende(mi,A);
  A.jhv=erg; A.gruende={}; A.start=null;
  return erg;
}
function jhvText(mg,e){
  const v=Math.round(e.vertrauen), X=W.vertrauen;
  if(!e.praesident){
    if(e.gewaehlt) return `Jahreshauptversammlung ${e.verein}: Die Mitglieder wählen ${mg.name} zum Präsidenten! Ab jetzt Trainer und Präsident.`;
    if(e.entlassen) return `Saisonende ${e.verein}: ${e.co?'Der Cheftrainer':'Der Vorstand'} trennt sich von ${mg.name} (Vertrauen ${v}). Der Verein muss verlassen werden.`;
    if(e.co) return `Saisonende ${e.verein}: Der Cheftrainer will weiter mit Co-Trainer ${mg.name} arbeiten. Vertrauen ${v} von 100.`;
    if(e.sd) return `Saisonende ${e.verein}: Der Vorstand bestätigt Sportdirektor ${mg.name}. Vertrauen ${v} von 100.`;
    return `Saisonende ${e.verein}: Der Vorstand hält an Trainer ${mg.name} fest. Vertrauen ${v} von 100, für die Wahl zum Präsidenten braucht es ${X.wahlAb}.`;
  }
  if(e.votum===0&&e.schonfrist) return `Jahreshauptversammlung ${e.verein}: Die Mitglieder sind unzufrieden (Vertrauen ${v}), geben ${mg.name} im ersten Amtsjahr aber noch Zeit.`;
  if(e.votum===0) return `Jahreshauptversammlung ${e.verein}: ${mg.name} bleibt Präsident. Vertrauen der Mitglieder ${v} von 100.`;
  if(e.votum===1) return `Jahreshauptversammlung ${e.verein}: Misstrauensvotum gegen ${mg.name}! Vertrauen nur ${v}. Offizielle Vorwarnung, beim nächsten Votum innerhalb von ${X.votumVerfall} Saisons ist das Amt weg.`;
  return `Jahreshauptversammlung ${e.verein}: Zweites Misstrauensvotum. ${mg.name} ist abgewählt und muss den Verein als Präsident und Trainer verlassen.`;
}

// ---------- Abwahl, Entlassung, Vereinswechsel ----------
// Wer einen Posten verliert, verliert beide und muss den Verein verlassen (amt.raus).
// Der alte Verein bleibt menschlich, bis die Person ein Angebot annimmt (mg.wahl), damit nichts halb übergeben wird.
function amtRaus(mi,grund){
  const A=amtVon(mi), c=mc(mi); if(!A||A.raus) return;
  A.raus={grund, saison:S.saison, termin:S.termin, niveau:niv(c), land:L(c).land};
  rufAendern(mi,grund==='abgewaehlt'?'Abwahl als Präsident':'Entlassung als Trainer',grund==='abgewaehlt'?W.karriere.rufAbwahl:W.karriere.rufEntlassung);
}
function angeboteErzeugen(mi){
  const A=amtVon(mi), c=mc(mi), land=A.raus.land, X=W.vertrauen;
  const nivs=W.ligen.filter(D=>!D.keineLiga&&D.land===land).map(D=>D.niveau);
  const ziel=Math.min(Math.max(...nivs),A.raus.niveau+1);
  const frei=n=>W.ligen.map((D,i)=>i).filter(i=>!W.ligen[i].keineLiga&&W.ligen[i].land===land&&n(W.ligen[i].niveau))
    .flatMap(i=>S.ligen[i]).filter(id=>id!==c.id&&S.clubs[id].human<0);
  let pool=frei(n=>n===ziel);
  if(pool.length<X.angebote) pool=[...new Set([...pool,...frei(n=>Math.abs(n-ziel)<=1)])];
  if(pool.length<X.angebote) pool=[...new Set([...pool,...frei(()=>true)])];
  return shuffle([...pool]).slice(0,X.angebote).map(id=>({club:id}));
}
function abgaengePruefen(){
  const neu=[];
  S.manager.forEach((mg,mi)=>{ const A=mg.amt;
    if(!A||!A.raus||mg.wahl) return;
    mg.wahl={grund:A.raus.grund, von:mg.club, saison:S.saison, angebote:angeboteErzeugen(mi)};
    mg.bereit=false; neu.push(mi);
  });
  return neu;
}
// Einrichtung, die jeder menschliche Verein braucht (Sponsoren, Merch, Nachwuchs). Konto und Kader bleiben unberührt.
function menschFelder(c,mi,talente,sternBonus){
  c.human=mi; c.ticketFaktor=1; c.sponsoren={trikot:null,aermel:null,banden:[],name:null}; c.angebote=[];
  c.merch={stand:'klapptisch',bau:null,lager:{},preis:{},sonderRest:0};
  for(const a in W.merch.artikel){ c.merch.lager[a]=[]; c.merch.preis[a]=W.merch.artikel[a].vk; }
  c.merch.lager.schal=[{n:30,alter:0}]; c.merch.lager.muetze=[{n:20,alter:0}];
  c.jugend=[]; c.programme={}; c.scouting=0; c.scoutingInt=false; c.internat=false; c.internatBau=0;
  c.kampagne=null; c.abrechnung=null; c.gnadeSaison=S.saison; c.meldung=''; c.fertig=[];
  for(const p of c.kader) if(p.laune==null) p.laune=W.laune.start;
  c.aufstellung=autoAufstellung(c,W.formationStandard);
  for(let i=0;i<talente;i++) c.jugend.push(neuesTalent(c,sternBonus));

function vereinAbgeben(c){
  c.human=-1; c.basis=staerke(c); c.ausrichtung='neutral';
  for(const p of c.kader) for(const k of ['wechsel','wechselSeit','verhTermin','bonusTermin','versprechen','stammBruch']) delete p[k];

function angebotAnnehmenTrainer(mi,clubId){

  trainerWechsel(mi,clubId,w.grund);

// Person verlässt ihren Verein und wird beim neuen Verein (Computer-Verein) Trainer, zunächst ohne Präsidentenamt.
function trainerWechsel(mi,clubId,grund,rolle='chef'){

    rolle:rolleText(A), grund });
  S.mitspielerAngebote=S.mitspielerAngebote.filter(o=>o.von!==mi&&o.an!==mi);
  vereinAbgeben(alt);
  menschFelder(neu,mi,W.handicap[mg.handicap].talente,W.handicap[mg.handicap].sternBonus);
  neu.konto=Math.round(L(neu).start*W.handicap[mg.handicap].budget*W.karriere.kontoNeu);

function zumPraesidentenGewaehlt(mi){

const GRUND_TEXT={abgewaehlt:'als Präsident abgewählt', entlassen:'als Trainer entlassen', wechsel:'gewechselt'};

// ---------- Karriere: Ruf, Stellenmarkt, Bewerbungen, Angebote ----------
// Ruf 0–100 gehört der Person. Stufen bestimmen, auf welchem Niveau man sich bewerben kann.
const RUF_STUFEN=[
  {name:'Lokal',ab:0,niveau:[8,10]}, {name:'Regional',ab:30,niveau:[6,7]}, {name:'Überregional',ab:50,niveau:[4,5]},
  {name:'National',ab:70,niveau:[2,3]}, {name:'International',ab:85,niveau:[1,1]}
];
const rufStufe = ruf => [...RUF_STUFEN].reverse().find(s=>ruf>=s.ab);
const stufeFuerNiveau = n => RUF_STUFEN.find(s=>n>=s.niveau[0]&&n<=s.niveau[1])||RUF_STUFEN[0];
const rufStartFuer = niveau => Math.min(95, stufeFuerNiveau(niveau).ab+W.karriere.rufStartPlus);
function karriereInit(mg,c){
  if(mg.ruf==null) mg.ruf=rufStartFuer(niv(c));
  mg.rufLog=mg.rufLog||[];
  mg.karriere=mg.karriere||{stationen:[]};
  mg.markt=mg.markt||{angebot:null, bewerbungen:[], saisonAngebote:0, pauseBis:0};
  vorstandInit(mg);
}
function rufAendern(mi,text,d){
  const mg=S.manager[mi]; if(!d) return;
  d=Math.round(d*10)/10;
  mg.ruf=clamp(Math.round((mg.ruf+d)*10)/10,0,100);
  mg.rufLog.unshift({saison:S.saison,t:text,d}); mg.rufLog=mg.rufLog.slice(0,W.karriere.rufLogMax);
}
// Am Saisonende aus den Gründen der Saison: sportliche Leistung zählt, Finanzen und Ticketpreise nicht.
function rufSaisonende(mi,A){
  const X=W.karriere, g=A.gruende, c=mc(mi);
  for(const [k,f] of Object.entries(X.rufAusGrund)) if(g[k]) rufAendern(mi,g[k].t,g[k].d*f);
  for(const k of Object.keys(g)) if(k.startsWith('titel_')) rufAendern(mi,g[k].t,g[k].d*X.rufTitel);
  if(S.manager[mi].ruf<rufStartFuer(niv(c))) rufAendern(mi,`Arbeit in der ${L(c).name}`,X.rufLigaBonus);
}
// ---- Formkurve aller Vereine (für Entlassungen der Computer-Trainer) ----
function formEintragen(m){
  const e=(id,eig,geg)=>{ const c=S.clubs[id]; c.form=((c.form||'')+(eig>geg?'S':eig<geg?'N':'U')).slice(-6); };
  e(m.h,m.th,m.ta); e(m.a,m.ta,m.th);
}
const formLetzte = (c,n) => (c.form||'').slice(-n);
const stelleVon = id => (S.stellen||[]).find(s=>s.club===id);
function stelleOeffnen(c,grund){
  if(c.human>=0||stelleVon(c.id)) return;
  (S.stellen=S.stellen||[]).push({club:c.id, seit:S.termin, saison:S.saison, bis:S.termin+W.karriere.stelleOffen, grund});
  c.trainerSeit=S.termin; c.form='';
}
function stellenmarktTermin(ligaTermin){
  const X=W.karriere;
  S.stellen=(S.stellen||[]).filter(s=>s.bis>S.termin&&S.clubs[s.club].human<0);
  if(ligaTermin) for(const c of S.clubs){
    if(c.human>=0||L(c).keineLiga||stelleVon(c.id)) continue;
    if(S.termin-(c.trainerSeit??-99)<X.trainerMindest) continue;
    const f=formLetzte(c,X.krisenSpiele);
    if(f.length===X.krisenSpiele&&!f.includes('S')&&(f.match(/N/g)||[]).length>=X.krisenNiederlagen&&rnd()<X.entlassChance) stelleOeffnen(c,'Negativserie');
  }
  if(!S.coStellen) coStellenErzeugen();
  if(!S.sdStellen) sdStellenErzeugen();
  if(ligaTermin) S.manager.forEach((mg,mi)=>coChefTermin(mi));
  S.manager.forEach((mg,mi)=>karriereTermin(mi,ligaTermin));
}
// Chance einer Bewerbung als Wort und Zahl. null = Stelle liegt über der eigenen Ruf-Stufe.
function bewerbungsChance(mi,club){
  const mg=S.manager[mi], c=S.clubs[club], st=stufeFuerNiveau(niv(c)), diff=mg.ruf-st.ab;
  if(diff<0) return null;
  const X=W.karriere.chance;
  return diff>=X.hochAb?{wort:'hoch',p:X.hoch}:diff>=X.mittelAb?{wort:'mittel',p:X.mittel}:{wort:'gering',p:X.gering};
}
function bewerben(mi,club,typ='chef'){
  const mg=S.manager[mi], M=mg.markt, s=stelleFrei(club,typ);
  if(mg.wahl) return 'Erst einen neuen Verein wählen.';
  if(!s) return 'Die Stelle ist nicht mehr frei.';
  if(club===mg.club) return 'Das ist dein eigener Verein.';
  if(M.bewerbungen.some(b=>b.club===club&&!b.erg)) return 'Du hast dich dort schon beworben.';
  if(M.bewerbungen.filter(b=>!b.erg).length>=W.karriere.maxBewerbungen) return `Höchstens ${W.karriere.maxBewerbungen} offene Bewerbungen.`;
  const ch=typ==='co'?coChance(mi,club):typ==='sd'?sdChance(mi,club):bewerbungsChance(mi,club); if(!ch) return typ==='co'?'Diese Co-Trainer-Stelle passt nicht zu deinem Ruf.':typ==='sd'?`Sportdirektor wird man ab Ruf ${W.sd.rufAb}, bis zu deiner Ruf-Stufe.`:`Dafür reicht dein Ruf noch nicht (ab ${stufeFuerNiveau(niv(S.clubs[club])).ab}).`;
  M.bewerbungen.push({club, typ, termin:S.termin, antwort:S.termin+ri(1,3), wort:ch.wort, p:ch.p, erg:null});
  return null;
}
const stelleFrei = (club,typ) => S.clubs[club].human<0&&(typ==='co'?(S.coStellen||[]).includes(club):typ==='sd'?(S.sdStellen||[]).includes(club):!!stelleVon(club));
function angebotMachen(mi,club,herkunft,typ='chef'){
  const M=S.manager[mi].markt;
  M.angebot={club, bis:S.termin+W.karriere.angebotFrist, herkunft, typ};
  S.manager[mi].bereit=false;
}
function karriereTermin(mi,ligaTermin){
  const mg=S.manager[mi], M=mg.markt, X=W.karriere; if(!M||mg.wahl) return;
  if(M.angebot&&(M.angebot.bis<=S.termin||!stelleFrei(M.angebot.club,M.angebot.typ))){ M.angebot=null; M.pauseBis=S.termin+X.pauseNachAbsage; }
  for(const b of M.bewerbungen) if(!b.erg&&S.termin>=b.antwort){
    const frei=stelleFrei(b.club,b.typ);
    if(frei&&!M.angebot&&rnd()<b.p){ b.erg='zusage'; angebotMachen(mi,b.club,'bewerbung',b.typ||'chef'); }
    else if(frei&&M.angebot&&rnd()<b.p) b.antwort=S.termin+1;
    else b.erg='absage';
  }
  M.bewerbungen=M.bewerbungen.filter(b=>!b.erg||S.termin-b.antwort<X.bewerbungZeigen);
  if(!ligaTermin||M.angebot||M.saisonAngebote>=X.angeboteProSaison||S.termin<M.pauseBis) return;
  const eigen=niv(mc(mi)), stufe=rufStufe(mg.ruf);
  const pool=(S.stellen||[]).map(s=>S.clubs[s.club]).filter(c=>c.id!==mg.club&&niv(c)<=eigen&&niv(c)>=stufe.niveau[0]&&stufeFuerNiveau(niv(c)).ab<=mg.ruf);
  if(pool.length&&rnd()<X.angebotChance){ angebotMachen(mi,pick(pool).id,'unaufgefordert'); M.saisonAngebote++; }
}
function angebotAblehnen(mi){
  const M=S.manager[mi].markt; if(!M.angebot) return 'Kein Angebot offen.';
  M.angebot=null; M.pauseBis=S.termin+W.karriere.pauseNachAbsage; return null;
}
function marktAngebotAnnehmen(mi){
  const mg=S.manager[mi], M=mg.markt, o=M.angebot;
  if(!o) return 'Kein Angebot offen.';
  if(!stelleFrei(o.club,o.typ)) { M.angebot=null; return 'Die Stelle ist inzwischen vergeben.'; }
  const warChef=!istCoAmt(mg.amt)&&!istSdAmt(mg.amt);
  const alt=mc(mi);
  trainerWechsel(mi,o.club,'wechsel',o.typ||'chef');
  if(warChef) stelleOeffnen(alt,'Trainer gewechselt');
  return null;
}
function karriereSaisonwechsel(vj){
  const X=W.karriere;
  S.stellen=[];
  for(const c of S.clubs) delete c.trainerSeit;
  coStellenErzeugen(); sdStellenErzeugen();
  for(const mg of S.manager) if(mg.amt&&mg.amt.chefSeit!=null) mg.amt.chefSeit=0;
  for(const i of spielLigen()){
    const ids=(vj.tab[i]||[]).filter(id=>S.clubs[id].human<0&&S.clubs[id].liga===i), unten=ids.slice(Math.floor(ids.length/2));
    if(unten.length&&rnd()<X.sommerStellen) stelleOeffnen(S.clubs[pick(unten)],'Trennung im Sommer');
  }
  for(const mg of S.manager){ if(!mg.markt) continue; mg.markt.saisonAngebote=0; mg.markt.bewerbungen=[]; mg.markt.angebot=null; mg.markt.pauseBis=0; }
}

// ---------- Vorstandsthemen ----------
// Nur für Präsidenten. Höchstens ein offenes Thema; wer es bis zum nächsten Termin nicht entscheidet, dem nimmt die Kassenwartin die Entscheidung ab.
function vorstandInit(mg){
  mg.vorstand=mg.vorstand||{ thema:null, letzte:-99, genutzt:{}, haltung:{helga:0,marco:0,guenter:0}, folgen:[], verlauf:[], naechsteSitzung:S.termin+W.sitzung.erste };
}
const haltungWort = v => v>=1?'zufrieden':v<=-1?'verärgert':'neutral';
const themaVon = id => { const T=THEMEN.find(t=>t.id===id); return T?sportThema(T):null; };
function effektAnwenden(mi,c,eff,titel){
  const mg=S.manager[mi], vs=mg.vorstand, X=W.vorstand, txt=[];
  if(eff.geld){ const v=Math.round(eff.geld*L(c).lf); c.konto+=v; buchen(c,'Vorstand: '+titel,v); txt.push(`${v>0?'+':'−'}${eur(Math.abs(v))}`); }
  if(eff.fans){ const n=Math.round(c.fans*eff.fans); c.fans=Math.max(50,c.fans+n); txt.push(`${n>0?'+':'−'}${zahl(Math.abs(n))} Fans`); }
  if(eff.vertrauen&&mg.amt&&mg.amt.praesident){ vertrauenGrund(mi,'vorstand','Entscheidungen im Vorstand',eff.vertrauen); txt.push(`Vertrauen ${eff.vertrauen>0?'+':'−'}${Math.abs(eff.vertrauen)}`); }
  if(eff.laune){ for(const p of c.kader) launeSetzen(p,eff.laune); txt.push(eff.laune>0?'Mannschaft zufriedener':'Mannschaft verstimmt'); }
  if(eff.stimmung){ c.stimmung=clamp(c.stimmung+eff.stimmung,W.stimmung.min,W.stimmung.max); txt.push(eff.stimmung>0?'bessere Stimmung im Stadion':'schlechtere Stimmung im Stadion'); }
  for(const [k,d] of Object.entries(eff.haltung||{})){ const alt=haltungWort(vs.haltung[k]);
    vs.haltung[k]=clamp(vs.haltung[k]+d,-X.haltungMax,X.haltungMax);
    const neu=haltungWort(vs.haltung[k]); if(neu!==alt) txt.push(`${VORSTAND[k].name.split(' ')[0]} ist jetzt ${neu}`); }
  if(eff.extra==='sonder'){ sonderedition(c); txt.push('Sondertrikot im Fanshop'); }
  if(eff.extra==='talent'){ if(jugendBelegt(c)<jugendPlaetze(c)){ const tl=neuesTalent(c,1); c.jugend.push(tl); txt.push(`Talent ${tl.name} (${tl.pos}) neu in der Jugend`); } else txt.push('Jugend voll, das Talent geht zum Nachbarverein'); }
  return txt;
}
function vorstandEntscheiden(mi,idx,kassenwart){
  const mg=S.manager[mi], vs=mg.vorstand, c=mc(mi);
  if(!vs||!vs.thema) return {fehler:'Kein offenes Vorstandsthema.'};
  const T=themaVon(vs.thema.id); if(!T){ vs.thema=null; return {fehler:'Thema unbekannt.'}; }
  if(kassenwart) idx=T.vorsichtig;
  const o=T.optionen[idx]; if(!o) return {fehler:'Unbekannte Möglichkeit.'};
  const eff=kassenwart?{...o.eff, haltung:{}}:o.eff;
  const txt=effektAnwenden(mi,c,eff,T.titel);
  if(o.folge&&rnd()<o.folge.chance) vs.folgen.push({termin:S.termin+ri(o.folge.in[0],o.folge.in[1]), text:o.folge.text, eff:o.folge.eff, titel:T.titel});
  vs.verlauf.unshift({saison:S.saison, termin:S.termin, titel:T.titel, wahl:o.t, kassenwart:!!kassenwart, wirkung:txt});
  vs.verlauf=vs.verlauf.slice(0,W.vorstand.verlaufMax);
  vs.thema=null; vs.letzte=S.termin; vs.genutzt[T.id]=S.saison;
  return {txt, wahl:o.t};
}
function vorstandTermin(mi){
  const mg=S.manager[mi], vs=mg.vorstand, A=mg.amt, c=mc(mi), X=W.vorstand; if(!vs) return;
  if(!A||!A.praesident||mg.wahl||A.raus){ vs.thema=null; return; }
  if(vs.thema&&vs.thema.seit<S.termin){
    const e=vorstandEntscheiden(mi,0,true);
    if(e.txt) c.meldung+=` Vorstand: Helga hat entschieden („${e.wahl}“).`;
  }
  for(const f of vs.folgen.filter(f=>f.termin<=S.termin)){
    const txt=effektAnwenden(mi,c,f.eff,f.titel);
    c.meldung+=` ${f.text}${txt.length?` (${txt.join(', ')})`:''}`;
    vs.verlauf.unshift({saison:S.saison, termin:S.termin, titel:f.titel, wahl:'Folge', folge:f.text, wirkung:txt});
  }
  vs.folgen=vs.folgen.filter(f=>f.termin>S.termin);
  vs.verlauf=vs.verlauf.slice(0,X.verlaufMax);
  if(vs.thema||S.termin-vs.letzte<X.abstand||rnd()>=X.chance) return;
  const pool=THEMEN.map(sportThema).filter(T=>T&&vs.genutzt[T.id]!==S.saison&&(!T.wenn||T.wenn(c)));
  if(pool.length) vs.thema={id:pick(pool).id, seit:S.termin};
}

// ---------- Vorstandssitzung ----------
// Alle paar Termine bringt jede Figur einen Vorschlag aus ihrem Bereich ein. Die Aktionen nutzen dieselben
// Funktionen wie die normalen Seiten (bauen, anlageBauen, kampagneStarten …), damit nichts doppelt gerechnet wird.
const SITZUNG_STIMME={'1':'dafür','0':'egal','-1':'dagegen'};
function sitzungPunktBudget(c){
  const D=L(c), X=W.sitzung;
  if(c.konto<0&&c.ticketFaktor<1.5-0.001) return { wer:'helga', titel:'Ticketpreis anheben',
    text:`Das Konto steht bei ${eur(c.konto)}. Helga will den Ticketpreis um 10 % anheben, von ${eur(D.ticket*c.ticketFaktor)} auf ${eur(D.ticket*Math.min(1.5,c.ticketFaktor+0.1))}.`,
    aktion:{typ:'ticket',d:0.1}, stimmen:{helga:1,marco:-1,guenter:0} };
  const best=[...c.angebote].sort((a,b)=>b.betrag-a.betrag)[0];
  if(best) return { wer:'helga', titel:'Werbevertrag unterschreiben',
    text:`${best.name} bietet ${eur(best.betrag)} pro Saison für ${SPART[best.art]} (${best.jahre} ${best.jahre>1?'Jahre':'Jahr'}). Helga will unterschreiben.`,
    aktion:{typ:'sponsor',id:best.id}, stimmen:{helga:1,marco:best.art==='name'?-1:0,guenter:0} };
  const k=bonusAlleKosten(c);
  if(c.konto>k*X.praemieAbVielfach&&c.bonusAlleTermin!==S.termin) return { wer:'helga', titel:'Prämie für die Mannschaft',
    text:`Die Kasse ist gut gefüllt (${eur(c.konto)}). Helga schlägt eine Prämie für die ganze Mannschaft vor: ${eur(k)}.`,
    aktion:{typ:'praemie'}, stimmen:{helga:1,marco:1,guenter:0} };
  return null;
}
function sitzungPunktBau(c){
  if(c.konto<=0) return null;
  const max=c.konto*W.sitzung.bauAnteil, k=kapazitaet(c), D=L(c), opts=[];
  for(const o of bauOptionen(c)) if(o.kosten<=max) opts.push({titel:o.name, kosten:o.kosten, info:o.info, aktion:{typ:'bauen',id:o.id,art:o.art}, plaetze:['ausbau','stehwall','holz'].includes(o.art)});
  for(const id of Object.keys(W.anlagen)){ const A=W.anlagen[id], st=anlageStufe(c,id)+1;
    if(st>A.stufen.length||anlageImBau(c,id)) continue;
    const kosten=anlageKosten(c,id,st); if(kosten<=max) opts.push({titel:A.stufen[st-1], kosten, info:A.txt(A.w[st-1]), aktion:{typ:'anlage',id}}); }
  if(!opts.length) return null;
  const pflicht=pflichtVerletzt(c)&&k.gesamt<D.mindest;
  const o=pflicht&&opts.some(x=>x.plaetze)?opts.filter(x=>x.plaetze).sort((a,b)=>a.kosten-b.kosten)[0]:pick(opts.sort((a,b)=>a.kosten-b.kosten).slice(0,3));
  return { wer:'guenter', titel:`Bauprojekt: ${o.titel}`,
    text:`Günter schlägt vor: ${o.titel} für ${eur(o.kosten)}. ${o.info}.${pflicht&&o.plaetze?' Das hilft bei der Ligapflicht.':''}`,
    aktion:o.aktion, stimmen:{guenter:1, helga:o.kosten>c.konto*W.sitzung.teuerAnteil?-1:0, marco:o.plaetze?1:0} };
}
function sitzungPunktFans(c){
  const D=L(c);
  if(c.ticketFaktor>1.05) return { wer:'marco', titel:'Ticketpreis senken',
    text:`Die Fans stöhnen über ${eur(D.ticket*c.ticketFaktor)} Eintritt. Marco will den Preis um 10 % senken.`,
    aktion:{typ:'ticket',d:-0.1}, stimmen:{marco:1,helga:-1,guenter:0} };
  if(!c.kampagne&&c.konto>0){
    let i=W.kampagnen.length-1; while(i>0&&kampagneKosten(c,i)>c.konto*W.sitzung.kampagneAnteil) i--;
    const K=W.kampagnen[i], kosten=kampagneKosten(c,i);
    if(kosten<=c.konto) return { wer:'marco', titel:`Werbekampagne: ${K.name}`,
      text:`Marco will mit einer Kampagne (${K.name}) neue Zuschauer holen. Kosten ${eur(kosten)}, für ${W.kampagneDauer} Termine mehr Fans im Stadion.`,
      aktion:{typ:'kampagne',i}, stimmen:{marco:1,helga:kosten>c.konto*0.05?-1:0,guenter:0} };
  }
  if(anlageStufe(c,'buehne')&&c.festKey!==festSchluessel()&&c.konto>=festKosten(c)) return { wer:'marco', titel:'Vereinsfest feiern',
    text:`Die Bühne steht, die Halbserie läuft. Marco will ein Vereinsfest. Kosten ${eur(festKosten(c))}, Einnahmen und neue Fans erwartet.`,
    aktion:{typ:'fest'}, stimmen:{marco:1,guenter:-1,helga:0} };
  return null;
}
function sitzungErzeugen(mi){
  const c=mc(mi), vs=S.manager[mi].vorstand;
  const punkte=[sitzungPunktBudget(c),sitzungPunktBau(c),sitzungPunktFans(c)].filter(Boolean).map((p,i)=>({...p,nr:i,status:null}));
  vs.naechsteSitzung=S.termin+ri(W.sitzung.abstand[0],W.sitzung.abstand[1]);
  if(!punkte.length) return;
  vs.sitzung={saison:S.saison, termin:S.termin, kontoVorher:vs.kontoLetzteSitzung??null, konto:c.konto, punkte};
  vs.kontoLetzteSitzung=c.konto;
}
function sitzungAusfuehren(c,a){
  if(a.typ==='ticket'){ c.ticketFaktor=Math.round(clamp(c.ticketFaktor+a.d,0.5,1.5)*100)/100; return null; }
  if(a.typ==='sponsor'){ if(!c.angebote.some(x=>x.id===a.id)) return 'Das Angebot ist nicht mehr da.'; angebotAnnehmen(c,a.id); return null; }
  if(a.typ==='praemie') return bonusAlleZahlen(c);
  if(a.typ==='bauen') return bauen(c,a.id,a.art);
  if(a.typ==='anlage') return anlageBauen(c,a.id);
  if(a.typ==='kampagne') return kampagneStarten(c,a.i);
  if(a.typ==='fest'){ const r=vereinsfest(c); return r.fehler||null; }
  return 'Unbekannter Vorschlag.';
}
function sitzungEntscheiden(mi,nr,ja){
  const mg=S.manager[mi], vs=mg.vorstand, c=mc(mi), X=W.vorstand;
  if(!mg.amt||!mg.amt.praesident) return 'Nur als Präsident.';
  const p=vs.sitzung&&vs.sitzung.punkte.find(x=>x.nr===nr);
  if(!p||p.status) return 'Dieser Punkt ist schon erledigt.';
  if(ja){ const e=sitzungAusfuehren(c,p.aktion); if(e) return e;
    for(const [k,s] of Object.entries(p.stimmen)) if(s) vs.haltung[k]=clamp(vs.haltung[k]+s,-X.haltungMax,X.haltungMax); }
  else vs.haltung[p.wer]=clamp(vs.haltung[p.wer]-1,-X.haltungMax,X.haltungMax);
  p.status=ja?'ja':'nein';
  return null;
}
function sitzungTermin(mi){
  const mg=S.manager[mi], vs=mg.vorstand, A=mg.amt; if(!vs) return;
  if(!A||!A.praesident||mg.wahl||A.raus){ vs.sitzung=null; return; }
  if(vs.sitzung&&vs.sitzung.termin<S.termin){
    const offen=vs.sitzung.punkte.filter(p=>!p.status);
    for(const p of offen) p.status='vertagt';
    if(offen.length) mc(mi).meldung+=` Vorstandssitzung: ${offen.length} Punkt${offen.length>1?'e':''} vertagt.`;
    vs.letzteSitzung=vs.sitzung; vs.sitzung=null;
  }
  if(vs.naechsteSitzung==null) vs.naechsteSitzung=S.termin+W.sitzung.erste;
  if(!vs.sitzung&&S.termin>=vs.naechsteSitzung) sitzungErzeugen(mi);
}
const sitzungOffen = mg => !!(mg.vorstand&&mg.vorstand.sitzung&&mg.vorstand.sitzung.punkte.some(p=>!p.status));
// Termine zählen jede Saison neu ab 0: offene Fristen in die neue Saison verschieben.
function vorstandSaisonwechsel(){
  const len=S.kalender.length;
  for(const mg of S.manager){ const vs=mg.vorstand; if(!vs) continue;
    vs.letzte-=len; vs.thema=null;
    if(vs.naechsteSitzung!=null) vs.naechsteSitzung=Math.max(W.sitzung.erste,vs.naechsteSitzung-len);
    if(vs.sitzung){ vs.letzteSitzung=vs.sitzung; vs.sitzung=null; }
    for(const f of vs.folgen) f.termin=Math.max(0,f.termin-len); }
}
function vorstandJhv(mi){
  const vs=S.manager[mi].vorstand; if(!vs) return;
  for(const [k,v] of Object.entries(vs.haltung)){
    const f=VORSTAND[k].name.split(' ')[0];

// ---------- Co-Trainer und Training ----------
// Rolle im Amt: 'chef' (Cheftrainer) oder 'co'. Der Co-Trainer schlägt die Aufstellung vor; der Computer-Chef übernimmt
// sie mit einer Wahrscheinlichkeit, die vom Vertrauen in den Co abhängt. Erfolgreiche übernommene Vorschläge stärken es.
const istCoAmt = A => !!A&&A.rolle==='co';
const coArbeit = A => A.coArbeit||(A.coArbeit={training:0,gespraeche:0,vorschlaege:0});
const coUebernahmeChance = A => clamp(A.vertrauen/100,W.co.minChance,W.co.maxChance);
function coAufstellungen(){
  S.manager.forEach((mg,mi)=>{ const A=mg.amt; if(mg.wahl) return;
    if(istSdAmt(A)){ const c=mc(mi); c.aufstellung=autoAufstellung(c); c.ausrichtung='neutral'; return; }
    if(!istCoAmt(A)) return;
    const c=mc(mi), n=naechstesSpiel(c); if(!n) return;
    pruefeAufstellung(c);
    const f=c.aufstellung&&c.aufstellung.formation, eigen=c.aufstellung, qCo=elfStaerke(c);
    c.aufstellung=autoAufstellung(c,f); const qChef=elfStaerke(c); c.aufstellung=eigen;
    const ja=rnd()<coUebernahmeChance(A);
    if(!ja){ c.aufstellung=autoAufstellung(c,f); c.ausrichtung='neutral'; }
    A.vorschlag={termin:S.termin, uebernommen:ja, diff:qCo-qChef};
  });
}
function coNachSpiel(mi,c,m){
  const A=amtVon(mi), X=W.co; if(!istCoAmt(A)||!m||!A.vorschlag||A.vorschlag.termin!==S.termin-1) return;
  const heim=m.h===c.id, eig=heim?m.th:m.ta, geg=heim?m.ta:m.th;
  const won=m.sieger!=null?m.sieger===c.id:eig>geg, lost=m.sieger!=null?m.sieger!==c.id:eig<geg;
  const d=A.vorschlag.diff??(A.vorschlag.gut?0:-1);
  if(d>0.05){ vertrauenGrund(mi,'coVorschlag','Gute Aufstellungsvorschläge',X.vorschlagGut); coArbeit(A).vorschlaege++; }
  else if(d<-X.vorschlagToleranz) vertrauenGrund(mi,'coVorschlagSchwach','Schwache Aufstellungsvorschläge',-X.vorschlagSchlecht);
  c.meldung+=A.vorschlag.uebernommen?' Der Cheftrainer hat deine Aufstellung übernommen.':' Der Cheftrainer hat seine eigene Aufstellung gewählt.';
  (A.vorschlaege=A.vorschlaege||[]).unshift({saison:S.saison, termin:S.termin, uebernommen:A.vorschlag.uebernommen, erg:won?'S':lost?'N':'U'});
  A.vorschlaege=A.vorschlaege.slice(0,10);
}
// Gespräch des Co-Trainers mit einem Spieler: kostenlos, höchstens alle paar Termine pro Spieler.
function coGespraech(mi,pid){
  const A=amtVon(mi), c=mc(mi), X=W.co; if(!istCoAmt(A)) return {fehler:'Gespräche sind Aufgabe des Co-Trainers.'};
  const p=c.kader.find(x=>x.id===pid); if(!p) return {fehler:'Spieler nicht gefunden.'};
  if(p.coGespraech!=null&&S.termin-p.coGespraech<X.gespraechAbstand&&S.termin>=p.coGespraech) return {fehler:`Mit ${p.name} hast du gerade erst gesprochen.`};
  p.coGespraech=S.termin;
  launeSetzen(p,X.gespraechLaune);
  coArbeit(A).gespraeche++;
  if(A.gespraechTermin!==S.termin){ A.gespraechTermin=S.termin; vertrauenGrund(mi,'coGespraeche','Gute Gespräche mit Spielern',X.gespraechVertrauenKlein); }
  let txt=`${p.name} fühlt sich ernst genommen.`;
  if(p.wechsel&&rnd()<X.gespraechHalten){ p.wechsel=false; delete p.wechselSeit; txt=`${p.name} hat sich überzeugen lassen und will bleiben.`; vertrauenGrund(mi,'coGespraech','Spieler zum Bleiben bewegt',X.gespraechVertrauen); }
  return {txt};
}
function coBefoerdern(mi){
  const mg=S.manager[mi], A=mg.amt, c=mc(mi);
  A.rolle='chef'; A.vertrauen=W.vertrauen.trainerStart; A.seit=S.saison; A.seitTermin=S.termin; A.vorschlag=null;
  rufAendern(mi,`Beförderung zum Cheftrainer bei ${c.name}`,W.co.rufBefoerderung);
  c.meldung+=` Der Cheftrainer ist entlassen worden. Der Vorstand befördert ${mg.name} zum neuen Cheftrainer!`;
}
// Der Computer-Cheftrainer eines Vereins mit menschlichem Co kann nach einer Negativserie ebenfalls fliegen.
function coChefTermin(mi){
  const mg=S.manager[mi], A=mg.amt, X=W.karriere; if(!istCoAmt(A)||A.raus) return;
  const c=mc(mi), f=formLetzte(c,X.krisenSpiele);
  if(S.termin-(A.chefSeit??A.seitTermin??0)<X.trainerMindest) return;
  if(f.length===X.krisenSpiele&&!f.includes('S')&&(f.match(/N/g)||[]).length>=X.krisenNiederlagen&&rnd()<X.entlassChance){
    if(A.vertrauen>=W.co.befoerderungAb) coBefoerdern(mi);
    else { A.chefSeit=S.termin; A.vertrauen=W.co.start; c.form=''; c.meldung+=' Der Cheftrainer wurde entlassen. Sein Nachfolger muss dich erst kennenlernen.'; }
  }
}
// Co-Trainer-Stellen: einige Vereine 1–2 Ruf-Stufen über der eigenen, feste Liste pro Saison und Land.
function coStellenErzeugen(){
  const X=W.co; S.coStellen=[];
  for(const land of LAENDER){
    const ids=W.ligen.map((D,i)=>i).filter(i=>!W.ligen[i].keineLiga&&W.ligen[i].land===land).flatMap(i=>S.ligen[i]).filter(id=>S.clubs[id].human<0);

function coChance(mi,club){

// Trainingsschwerpunkt der Profis. Der Co-Trainer leitet das Training besser (Faktor coFaktor).
const TRAINING={
  ausgewogen:{name:'Ausgewogen', pos:['TW','AB','MF','ST'], chance:0.006, txt:'Alle Spieler ein wenig'},
  abwehr:{name:'Abwehr', pos:['AB'], chance:0.02, txt:'Verteidiger werden besser'},
  mittelfeld:{name:'Mittelfeld', pos:['MF'], chance:0.02, txt:'Mittelfeldspieler werden besser'},
  angriff:{name:'Angriff', pos:['ST'], chance:0.02, txt:'Stürmer werden besser'},
  torwart:{name:'Torwart', pos:['TW'], chance:0.03, txt:'Torhüter werden besser'},
  erholung:{name:'Erholung', pos:[], chance:0, txt:'Verletzte werden schneller fit, gute Stimmung, aber kein Fortschritt'}
};
function trainingTermin(c){
  const mg=S.manager[c.human], T=TRAINING[c.training||'ausgewogen']||TRAINING.ausgewogen, X=W.co;
  const f=istCoAmt(mg&&mg.amt)?X.coFaktor:1, besser=[];
  if(c.training==='erholung'){ for(const p of c.kader){ if(p.verletzt>0&&rnd()<X.erholungHeilung) p.verletzt--; launeSetzen(p,X.erholungLaune); } return besser; }
  for(const p of c.kader) if(T.pos.includes(p.pos)&&p.alter<=X.trainingBisAlter&&p.staerke<99&&rnd()<T.chance*f){ p.staerke++; besser.push(p.name); }
  if(besser.length&&istCoAmt(mg&&mg.amt)){ vertrauenGrund(c.human,'coTraining','Gutes Training',X.trainingVertrauen*besser.length); coArbeit(mg.amt).training+=besser.length; }
  return besser;
}

// ---------- Nationalmannschaft ----------
// Zusatzamt neben dem Verein. Der Kader sind die besten Spieler aller Vereine eines Landes.
// Länderspiele nach bestimmten Ligaterminen, alle zwei Saisons eine Europameisterschaft mit 8 Teams.
const NATIONEN = () => [...LAENDER, 'EU'];
const nationName = l => l==='EU'?'Auswahl Europa':W.laender[l].name;
function nationalKader(land){
  const X=W.national, pool=[];
  for(const c of S.clubs){ if(L(c).keineLiga&&land!=='EU') continue; const cl=L(c).land;
    if(land==='EU'?cl!=='EU':cl!==land) continue;
    for(const p of c.kader) if(!p.verletzt) pool.push({p,c}); }
  const kader=[];
  for(const [pos,n] of Object.entries(X.kader)) kader.push(...pool.filter(x=>x.p.pos===pos).sort((a,b)=>b.p.staerke-a.p.staerke).slice(0,n));
  return kader;
}
function nationalStaerke(land){
  const k=nationalKader(land), elf=[];
  for(const [pos,n] of Object.entries({TW:1,AB:4,MF:4,ST:2})) elf.push(...k.filter(x=>x.p.pos===pos).slice(0,n));
  return elf.length?summe(elf.map(x=>x.p.staerke))/elf.length:40;
}
function laenderspiel(a,b,ausrA='neutral',ausrB='neutral',neutral=true){
  const fa={offensiv:1.15,neutral:1,defensiv:0.85}, d=nationalStaerke(a)-nationalStaerke(b)+(neutral?0:2);
  const lam=(x,aus,geg)=>clamp(1.25*Math.exp(x/14)*fa[aus]*fa[geg],0.15,4.5);
  return {th:poisson(lam(d,ausrA,ausrB)), ta:poisson(lam(-d,ausrB,ausrA))};
}
function nationalInit(){
  if(!S.national) S.national={ offen:[], turniere:[] };
}
function nationalStellenErzeugen(){
  nationalInit();
  if(W.national.aus){ S.national.offen=[]; return; }
  const besetzt=new Set(S.manager.filter(m=>m.national).map(m=>m.national.land));
  const frei=shuffle(LAENDER.filter(l=>!besetzt.has(l)));
  S.national.offen=frei.slice(0,ri(W.national.offenMin,W.national.offenMax));
}
const nationalRufAb = land => W.national.rufAb[land]??W.national.rufAb.standard;
function nationalChance(mi,land){
  const r=S.manager[mi].ruf, ab=nationalRufAb(land), X=W.karriere.chance;
  if(r<ab) return null;
  return r>=ab+W.national.hochAbPlus?{wort:'hoch',p:X.hoch}:{wort:'mittel',p:X.mittel};
}
function nationalBewerben(mi,land){
  const mg=S.manager[mi], M=mg.markt; nationalInit();
  if(mg.national) return 'Du bist schon Nationaltrainer.';
  if(!S.national.offen.includes(land)) return 'Diese Stelle ist nicht frei.';
  if(M.nBewerbung&&!M.nBewerbung.erg) return 'Du hast dich schon bei einem Nationalteam beworben.';
  const ch=nationalChance(mi,land); if(!ch) return `Dafür braucht es Ruf ${nationalRufAb(land)}.`;
  M.nBewerbung={land, antwort:S.termin+ri(1,3), p:ch.p, wort:ch.wort, erg:null};
  return null;
}
function nationalUebernehmen(mi,land){
  const mg=S.manager[mi];
  mg.national={land, seit:S.saison, vertrauen:W.national.start, ausrichtung:'neutral', spiele:[], turniere:[]};
  S.national.offen=S.national.offen.filter(l=>l!==land);
  rufAendern(mi,`Nationaltrainer ${nationName(land)}`,W.national.rufStart);
}
function nationalVertrauen(mi,d){ const N=S.manager[mi].national; if(N) N.vertrauen=clamp(Math.round((N.vertrauen+d)*10)/10,0,100); }
function nationalEntlassen(mi,grund){
  const mg=S.manager[mi], N=mg.national; if(!N) return '';
  (mg.karriere.national=mg.karriere.national||[]).push({land:N.land, seit:N.seit, bis:S.saison, grund});
  mg.national=null; nationalInit(); if(!S.national.offen.includes(N.land)) S.national.offen.push(N.land);
  rufAendern(mi,`Als Nationaltrainer ${nationName(N.land)} ${grund==='ruecktritt'?'zurückgetreten':'entlassen'}`,grund==='ruecktritt'?0:W.national.rufEntlassung);
  return grund==='ruecktritt'?'':` Der Verband trennt sich von Nationaltrainer ${mg.name}.`;
}
function nationalTermin(t){
  nationalInit();
  if(W.national.aus) return;
  S.manager.forEach((mg,mi)=>{ const M=mg.markt, c=mc(mi);
    const b=M&&M.nBewerbung;
    if(b&&!b.erg&&S.termin>=b.antwort){
      if(!mg.national&&S.national.offen.includes(b.land)&&rnd()<b.p){ b.erg='zusage'; nationalUebernehmen(mi,b.land); c.meldung+=` Der Verband ${nationName(b.land)} macht ${mg.name} zum Nationaltrainer!`; }
      else b.erg='absage';
    }
    const N=mg.national; if(!N||t.art!=='liga'||!W.national.nachLigaTermin.includes(t.nr)) return;
    const geg=pick(NATIONEN().filter(l=>l!==N.land)), heim=rnd()<0.5;
    const e=heim?laenderspiel(N.land,geg,N.ausrichtung,'neutral',false):laenderspiel(geg,N.land,'neutral',N.ausrichtung,false);
    const eig=heim?e.th:e.ta, gg=heim?e.ta:e.th, X=W.national;
    nationalVertrauen(mi,eig>gg?X.sieg:eig<gg?X.niederlage:0);
    N.spiele.unshift({saison:S.saison, termin:S.termin, gegner:geg, heim, eig, gg}); N.spiele=N.spiele.slice(0,12);
    c.meldung+=` Länderspiel: ${nationName(heim?N.land:geg)} ${e.th}:${e.ta} ${nationName(heim?geg:N.land)}.`;
    if(N.vertrauen<X.grenze) c.meldung+=nationalEntlassen(mi,'entlassen');
  });
}
// Europameisterschaft: zwei Vierergruppen, die Ersten und Zweiten ins Halbfinale, dann Finale. Elfmeterschießen per Zufall nach Stärke.
function europameisterschaft(){
  const teams=shuffle(NATIONEN()), ausr=l=>{ const m=S.manager.find(x=>x.national&&x.national.land===l); return m?m.national.ausrichtung:'neutral'; };
  const gruppen=[teams.slice(0,4),teams.slice(4,8)].map(g=>{
    const tab=Object.fromEntries(g.map(l=>[l,{l,pkt:0,tg:0,tgg:0}])), spiele=[];
    for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){ const a=g[i], b=g[j], e=laenderspiel(a,b,ausr(a),ausr(b)); spiele.push({a,b,...e});
      tab[a].tg+=e.th; tab[a].tgg+=e.ta; tab[b].tg+=e.ta; tab[b].tgg+=e.th;
      if(e.th>e.ta) tab[a].pkt+=3; else if(e.th<e.ta) tab[b].pkt+=3; else { tab[a].pkt++; tab[b].pkt++; } }
    return {tab:Object.values(tab).sort((x,y)=>y.pkt-x.pkt||(y.tg-y.tgg)-(x.tg-x.tgg)||y.tg-x.tg||rnd()-0.5), spiele};
  });
  const ko=(a,b)=>{ const e=laenderspiel(a,b,ausr(a),ausr(b)); let s=e.th>e.ta?a:e.th<e.ta?b:null;
    if(!s) s=rnd()<0.5+(nationalStaerke(a)-nationalStaerke(b))/60?a:b; return {a,b,...e,sieger:s,ie:e.th===e.ta}; };
  const g1=gruppen[0].tab, g2=gruppen[1].tab;
  const hf=[ko(g1[0].l,g2[1].l), ko(g2[0].l,g1[1].l)], fin=ko(hf[0].sieger,hf[1].sieger);
  const T={saison:S.saison, name:'Europameisterschaft', gruppen, hf, finale:fin, sieger:fin.sieger};
  nationalInit(); S.national.turniere.unshift(T); S.national.turniere=S.national.turniere.slice(0,6);
  return T;
}
function nationalSaisonwechsel(info){
  nationalInit();
  if(W.national.aus){ S.national.offen=[]; return; }
  const X=W.national;
  if(S.saison%X.turnierAlle===0){
    const T=europameisterschaft();
    { const F=T.finale, vorn=F.sieger===F.a; info.push(`${T.name}: ${nationName(T.sieger)} gewinnt das Finale gegen ${nationName(vorn?F.b:F.a)} (${vorn?F.th:F.ta}:${vorn?F.ta:F.th}${F.ie?' i.E.':''}).`); }
    S.manager.forEach((mg,mi)=>{ const N=mg.national; if(!N) return;
      const l=N.land, weit=T.sieger===l?'titel':(T.finale.a===l||T.finale.b===l)?'finale':T.hf.some(s=>s.a===l||s.b===l)?'halbfinale':'gruppe';
      const d={titel:X.titel,finale:X.finale,halbfinale:X.halbfinale,gruppe:X.gruppe}[weit];
      nationalVertrauen(mi,d); N.turniere.unshift({saison:S.saison, weit});
      if(weit==='titel') rufAendern(mi,`Europameister mit ${nationName(l)}`,X.rufTitel);
      if(weit==='finale') rufAendern(mi,`EM-Finale mit ${nationName(l)}`,X.rufFinale);
      info.push(`${mg.name} mit ${nationName(l)}: ${{titel:'Europameister!',finale:'im Finale',halbfinale:'im Halbfinale',gruppe:'in der Gruppe ausgeschieden'}[weit]}`);
      if(N.vertrauen<X.grenze){ const t=nationalEntlassen(mi,'entlassen'); if(t) info.push(mg.name+':'+t); }
    });
  }
  nationalStellenErzeugen();
  for(const mg of S.manager) if(mg.markt) mg.markt.nBewerbung=null;
}

// ---------- Saisonwechsel ----------
function saisonwechsel(){
  const info=[];
  for(let mi=0;mi<S.manager.length;mi++){ const c=mc(mi), t=c.sponsoren.trikot; if(t&&t.bonus&&platzVon(c)<=W.sponsor.bonusPlatz){ const b=Math.round(t.betrag*W.sponsor.bonusQuote); c.konto+=b; info.push(`${c.name}: Sponsorbonus ${eur(b)}.`); } }
  const vj={tab:{}, pokalsieger:{}, euroSieger:{...S.euroSieger}, saison:S.saison};
  for(const i of spielLigen()) vj.tab[i]=tabelle(i).map(r=>r.id);
  for(const land of LAENDER) vj.pokalsieger[land]=S.pokale&&S.pokale[land]?S.pokale[land].sieger:null;
  for(let mi=0;mi<S.manager.length;mi++) museumSaisonende(mc(mi),vj);
  for(let mi=0;mi<S.manager.length;mi++){ const e=jahreshauptversammlung(mi,vj); if(e) info.push(jhvText(S.manager[mi],e)); }
  // Meister melden
  for(let mi=0;mi<S.manager.length;mi++){ const c=mc(mi); if(!L(c).keineLiga && vj.tab[c.liga][0]===c.id) info.push(`${c.name} ist Meister der ${L(c).name}!`); }
  // Auf- und Abstieg
  const neu={}; for(const i of spielLigen()) neu[i]=[...vj.tab[i]];
  const wechsel=[];
  for(const i of spielLigen()){ const D=W.ligen[i]; if(!D.unter) continue; const u=LIGA_IDX[D.unter];
    const runter=vj.tab[i].slice(-W.auf), hoch=vj.tab[u].slice(0,W.auf);
    runter.forEach(id=>wechsel.push([id,i,u])); hoch.forEach(id=>wechsel.push([id,u,i])); }
  for(const [id,von,nach] of wechsel){ neu[von]=neu[von].filter(x=>x!==id); }
  for(const [id,von,nach] of wechsel){ neu[nach].push(id); }
  for(const i of spielLigen()) S.ligen[i]=neu[i];
  for(const [id,von,nach] of wechsel){
    const c=S.clubs[id], hoch=W.ligen[nach].niveau<W.ligen[von].niveau; c.liga=nach;
    if(c.human<0) c.basis=W.ligen[nach].kader+(hoch?-3:3);
    else {
      c.fans=Math.round(c.fans*(1+(hoch?W.fans.aufstieg:W.fans.abstieg)));
      museumAufAb(c,hoch,nach);
      if(hoch){ sonderedition(c); if(pflichtVerletzt(c)) c.gnadeSaison=S.saison+1; info.push(`${c.name} steigt auf in die ${W.ligen[nach].name}!`); }
      else info.push(`${c.name} steigt ab in die ${W.ligen[nach].name}.`);
    }
  }
  // Spieler altern, Computer-Vereine angleichen
  for(const c of S.clubs){
    delete c.bonusAlleTermin;
    for(const p of c.kader){ p.alter++; p.tore=0; p.serie=0; p.verletzt=0; p.gesperrt=0;
      // Termine zählen jede Saison neu ab 0: termin-basierte Felder zurücksetzen
      delete p.bonusTermin; delete p.verhTermin; delete p.coGespraech; if(p.wechsel) p.wechselSeit=-1;
      if(p.alter<=23) p.staerke+=ri(0,4); else if(p.alter<=29) p.staerke+=ri(-1,2); else p.staerke-=ri(1,4);
      p.staerke=clamp(p.staerke,1,99); }
    const weg=c.kader.filter(p=>p.alter>=35||(c.human<0&&p.alter>=33&&rnd()<0.4));
    if(weg.length){ c.kader=c.kader.filter(p=>!weg.includes(p)); if(c.human>=0) info.push(`${c.name}: ${weg.map(p=>p.name).join(', ')} beendet die Karriere.`); }
    if(c.human<0){
      for(const p of c.kader) p.staerke=clamp(Math.round(p.staerke+(c.basis-p.staerke)*0.25),1,99);
      while(c.kader.length<21) c.kader.push(neuerSpieler(c.basis,pick(['TW','AB','MF','ST','AB','MF']),c.land,18,24));
      if(!c.kader.some(p=>p.pos==='TW')) c.kader.push(neuerSpieler(c.basis,'TW',c.land,20,28));
      c.stadion=neuesStadion(L(c).stadion);
      c.kader.sort((a,b)=>b.staerke-a.staerke); while(c.kader.length>26) c.kader.pop();
    } else auffuellen(c);
    c.aufstellung=autoAufstellung(c);
  }
  // Menschen: Jugend, Abwerben, Verträge
  for(let mi=0;mi<S.manager.length;mi++){
    const c=mc(mi), mg=S.manager[mi], H=W.handicap[mg.handicap], J=W.jugend;
    for(const x of leihenZurueck(c)) info.push(`${c.name}: ${x}`);
    for(const tl of c.jugend){ tl.alter++; tl.jtore=0; tl.jspiele=0; }
    if(c.u19) c.u19={s:0,u:0,n:0,tg:0,tgg:0,letzte:[],vorjahr:{s:c.u19.s,u:c.u19.u,n:c.u19.n,tg:c.u19.tg,tgg:c.u19.tgg}};
    for(const tl of [...c.jugend]) if(tl.staerke>=Math.max(J.abwerbenAb,L(c).kader-5) && rnd()<(c.internat?J.abwerbenInternat:J.abwerbenChance)){
      const erl=Math.round(marktwert(tl)*J.abwerbenErloes); c.jugend=c.jugend.filter(x=>x!==tl); c.konto+=erl; info.push(`${c.name}: Talent ${tl.name} wurde abgeworben (${eur(erl)} Ausbildungsentschädigung).`); }
    const n=H.talente+(c.scouting?2:0);
    for(let i=0;i<n;i++) if(jugendBelegt(c)<jugendPlaetze(c)) c.jugend.push(neuesTalent(c,H.sternBonus));
    if(c.scouting) for(const tl of c.jugend){ tl.sterneAnz=tl.sterne; tl.genau=true; }
    c.scouting=0; c.scoutingInt=false; c.programme={};
    const s=c.sponsoren;
    for(const k of ['trikot','aermel','name']) if(s[k]){ s[k].jahre--; if(s[k].jahre<=0){ info.push(`${c.name}: Vertrag mit ${s[k].name} ausgelaufen.`); s[k]=null; } }
    s.banden=s.banden.filter(b=>--b.jahre>0);
    c.angebote=[]; sponsorAngebote(c,true);
  }
  for(const land of LAENDER){ const id=vj.pokalsieger[land]; if(id!=null){ const c=S.clubs[id]; if(c.human>=0) info.push(`${c.name} hat den ${W.laender[land].pokal} gewonnen!`); } }
  for(const wb of EURO){ const id=vj.euroSieger[wb]; if(id!=null&&S.clubs[id].human>=0) info.push(`${S.clubs[id].name} gewinnt die ${W.euro[wb].name}!`); }
  nationalSaisonwechsel(info);
  vorstandSaisonwechsel();
  S.vorjahr=vj; S.saison++; S.euroSieger={}; S.superErg=null;
  saisonStarten();
  karriereSaisonwechsel(vj);
  for(let mi=0;mi<S.manager.length;mi++) if(S.manager[mi].auto.training) autoTraining(mc(mi));
  abgaengePruefen();
  S.saisonInfo=info;
  return info;
}
function abgaengeJugend(){
  const out=[];
  for(let mi=0;mi<S.manager.length;mi++){ const c=mc(mi);
    for(const tl of c.jugend.filter(x=>x.alter>=W.jugend.abgang)){
      if(S.manager[mi].auto.training && tl.staerke>=L(c).kader-8 && c.kader.length<W.kaderMax) hochziehen(c,tl.id);
      else { c.jugend=c.jugend.filter(x=>x!==tl); const t=`Talent ${tl.name} ist zu alt für die Jugend und verlässt den Verein.`; out.push(t); (c.jugendAbgang=c.jugendAbgang||[]).push(t); } } }
  return out;
}

// ---------- Kader-CSV ----------
// Zellen, die mit = + - @ beginnen, würde Excel als Formel ausführen: mit ' entschärfen
const csvZelle = x => { const t=String(x).replace(/;/g,',').replace(/[\r\n]+/g,' '); return /^[=+\-@\t]/.test(t)?"'"+t:t; };
function kaderCsvExport(){
  const z=['﻿Verein;Liga;Name;Position;Alter;Stärke'];
  for(const i of W.ligen.keys()) for(const id of S.ligen[i]){ const c=S.clubs[id]; for(const p of c.kader) z.push([c.name,W.ligen[i].name,p.name,p.pos,p.alter,p.staerke].map(csvZelle).join(';')); }
  return z.join('\r\n');
}
function kaderCsvImport(text){
  const zeilen=text.replace(/^﻿/,'').split(/\r?\n/).map(z=>z.trim()).filter(Boolean);
  if(!zeilen.length) return {fehler:'Datei ist leer.'};
  const kopf=zeilen[0].toLowerCase().split(';');
  const ix=n=>kopf.findIndex(k=>k.startsWith(n));
  const iV=ix('verein'), iN=ix('name'), iP=ix('pos'), iA=ix('alter'), iS=ix('st');
  if([iV,iN,iP,iA,iS].some(i=>i<0)) return {fehler:'Kopfzeile muss Verein;Name;Position;Alter;Stärke enthalten.'};
  const proVerein=new Map(); let fehlerZeilen=0;
  for(const z of zeilen.slice(1)){
    const f=z.split(';'), pos=(f[iP]||'').trim().toUpperCase(), alter=parseInt(f[iA],10), st=parseInt(f[iS],10), name=(f[iN]||'').trim(), verein=(f[iV]||'').trim().replace(/^'(?=[=+\-@])/,'');
    if(!verein||!name||!['TW','AB','MF','ST'].includes(pos)||!(alter>=15&&alter<=45)||!(st>=1&&st<=99)){ fehlerZeilen++; continue; }
    if(!proVerein.has(verein.toLowerCase())) proVerein.set(verein.toLowerCase(),[]);
    proVerein.get(verein.toLowerCase()).push({name:name.replace(/^'(?=[=+\-@])/,'').slice(0,30),pos,alter,staerke:st});
  }
  const nachName=new Map(S.clubs.map(c=>[c.name.toLowerCase(),c]));
  let ersetzt=0; const unbekannt=[];
  for(const [v,liste] of proVerein){
    const c=nachName.get(v); if(!c){ unbekannt.push(v); continue; }
    if(!liste.some(p=>p.pos==='TW')||liste.length<11){ unbekannt.push(v+' (zu wenige Spieler oder kein TW)'); continue; }
    c.kader=liste.slice(0,W.kaderMax).map(p=>({id:S.nextId++,...p,verletzt:0,gesperrt:0,tore:0,serie:0}));
    if(c.human<0) c.basis=Math.round(summe(c.kader.map(p=>p.staerke))/c.kader.length);
    auffuellen(c); c.aufstellung=autoAufstellung(c); ersetzt++;
  }
  return {ersetzt, unbekannt, fehlerZeilen};
}

// status: 'leer' | 'ok' | 'kaputt'
let STAND_CACHE=null;
function ladeStand(cache=false){
  const t=ladeRoh(); if(!t) return {status:'leer'};
  if(cache&&STAND_CACHE&&STAND_CACHE.roh===t) return STAND_CACHE.st;
  if(cache){ const st=ladeStand(false); STAND_CACHE={roh:t,st}; return st; }
  let d; try{ d=JSON.parse(t); }catch(e){ return {status:'kaputt'}; }
  const m=migrieren(d); return m?{status:'ok',daten:m}:{status:'kaputt'};
}

function idbOeffnen(){
  return new Promise((ok,fail)=>{
    let r; try{ if(!window.indexedDB) throw new Error('fehlt'); r=indexedDB.open(SPEICHER.db,1); }catch(e){ return fail(new Error('Dieser Browser erlaubt hier keine Sicherungen.')); }
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(SPEICHER.store)) r.result.createObjectStore(SPEICHER.store,{keyPath:'id',autoIncrement:true}); };
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>fail(new Error('Dieser Browser erlaubt hier keine Sicherungen.'));
    r.onblocked=()=>fail(new Error('Sicherungen sind gerade blockiert. Andere Tabs mit dem Spiel schließen.'));
  });
}
async function idbAktion(modus,fn){
  const db=await idbOeffnen();
  try{ return await new Promise((ok,fail)=>{ const tx=db.transaction(SPEICHER.store,modus), st=tx.objectStore(SPEICHER.store); let erg; const r=fn(st); if(r) r.onsuccess=()=>{ erg=r.result; };
    tx.oncomplete=()=>ok(erg); tx.onerror=()=>fail(tx.error||new Error('Sicherung fehlgeschlagen.')); tx.onabort=()=>fail(tx.error||new Error('Sicherung abgebrochen.')); }); }
  finally{ db.close(); }
}
// Legt eine Sicherung an (text = JSON des Spielstands). Hält nur die neuesten SPEICHER.max Einträge.
async function sicherungAnlegen(anlass,text){
  let d; try{ d=JSON.parse(text); }catch(e){ return false; }
  if(!spielstandGueltig(d)) return false;
  const eintrag={ zeit:Date.now(), anlass, saison:d.saison, termin:d.termin, namen:d.manager.map(m=>m.name).join(', '), groesse:text.length, daten:text };
  await idbAktion('readwrite',st=>st.add(eintrag));
  const alle=(await idbAktion('readonly',st=>st.getAllKeys()))||[];
  const weg=alle.sort((a,b)=>a-b).slice(0,Math.max(0,alle.length-SPEICHER.max));
  if(weg.length) await idbAktion('readwrite',st=>{ weg.forEach(k=>st.delete(k)); return null; });
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  return true;
}
async function sicherungenListe(){
  const l=(await idbAktion('readonly',st=>st.getAll()))||[];
  return l.map(({daten,...meta})=>meta).sort((a,b)=>b.zeit-a.zeit);
}

function fotoLaden(file){
  return new Promise((ok,fail)=>{
    if(!file||!/^image\//.test(file.type)) return fail(new Error('Bitte eine Bilddatei wählen.'));
    if(file.size>15e6) return fail(new Error('Das Bild ist zu groß (höchstens 15 MB).'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ try{ const g=128, cv=document.createElement('canvas'), m=Math.min(img.width,img.height); cv.width=cv.height=g;
      cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,g,g); ok(cv.toDataURL('image/jpeg',0.82)); }catch(e){ fail(new Error('Bild konnte nicht verarbeitet werden.')); } finally{ URL.revokeObjectURL(url); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); fail(new Error('Bild konnte nicht gelesen werden.')); };

  kader:{titel:'Kader & Taktik',txt:['Zwei Spieler auf dem Feld antippen tauscht sie. „Beste Elf aufstellen“ macht das für dich.','Rot umrandet heißt: Der Spieler steht auf der falschen Position und ist dort schwächer.','Spieler in der Liste antippen: Prämie geben oder mit ihm reden, wenn er weg will. Wer oft auf der Bank sitzt, wird unzufrieden.']},
  nachwuchs:{titel:'Nachwuchs',txt:['Hier wachsen deine Talente. An jedem Ligatermin können sie besser werden, ein guter Jugendtrainer hilft dabei.','Die Sterne zeigen, wie gut ein Talent einmal werden kann.','Mit 19 musst du entscheiden: in die erste Mannschaft hochziehen, sonst verlässt er den Verein.']},
  stadion:{titel:'Stadion & Sportpark',txt:['Mehr Plätze bringen mehr Zuschauer und mehr Geld. In höheren Ligen schreibt der Verband eine Mindestgröße vor.','Achtung: Jede Anlage im Sportpark kostet danach an jedem Ligatermin Unterhalt. Bau nur, wenn genug Geld übrig bleibt.','Unter dem Bild siehst du jeden Bereich von innen. „Rundgang starten“ führt von allein einmal durch den ganzen Verein, Antippen beendet ihn.']},
  finanzen:{titel:'Finanzen',txt:['Die Abrechnung zeigt nach jedem Spiel, was reingekommen und rausgegangen ist.','Teure Tickets bringen mehr pro Fan, aber es kommen weniger. Werbepartner bringen jede Saison Geld.','Rutscht das Konto ins Minus, kannst du nichts mehr kaufen und nichts bauen.']},
  verein:{titel:'Verein',txt:['Als Präsident brauchst du das Vertrauen der Mitglieder. Die Zahl geht von 0 bis 100.','Was sie steigen oder fallen lässt, steht darunter: Abschneiden in der Liga im Vergleich zur Erwartung, Auf- und Abstieg, Titel, Serien, Ticketpreise, Gewinn oder Verlust, neue Bauten.','Bei der Jahreshauptversammlung am Saisonende wird abgerechnet. Liegt das Vertrauen unter '+W.vertrauen.grenze+', gibt es ein Misstrauensvotum. Das erste ist eine Vorwarnung. Ein zweites innerhalb von '+W.vertrauen.votumVerfall+' Saisons kostet das Amt.','Wer abgewählt oder entlassen wird, verliert Präsidenten- und Traineramt und muss den Verein verlassen. Danach gibt es Angebote eine Stufe tiefer, dort bist du zuerst nur Trainer.','Alle 4 bis 5 Termine tagt der Vorstand. Helga, Günter und Marco machen Vorschläge zu Geld, Bauprojekten und Fans. Du stimmst zu oder lehnst ab.','Ab und zu bringt ein Vorstandsmitglied ein Thema ein. Es erscheint in der Zentrale. Jede Entscheidung hat Für und Wider, manche haben später Folgen. Wie zufrieden Helga, Marco und Günter sind, zählt bei der Jahreshauptversammlung.','Als Trainer bewertet dich der Vorstand. Unter '+W.vertrauen.trainerGrenze+' wirst du entlassen. Ab '+W.vertrauen.wahlAb+' nach einer vollen Saison wählen dich die Mitglieder zum Präsidenten.']},
  training:{titel:'Training',txt:['Hier legst du fest, woran die Profis im Training arbeiten. An jedem Ligatermin können Spieler der gewählten Position um 1 Punkt besser werden, Spieler bis 30 Jahre.','Erholung bringt keinen Fortschritt, aber Verletzte werden schneller fit und die Stimmung steigt.','Als Co-Trainer leitest du das Training: Die Chancen sind dann anderthalbmal so hoch.']},
  karriere:{titel:'Karriere',txt:['Dein Ruf als Trainer geht von 0 bis 100 und steigt mit sportlichem Erfolg. Entlassung und Abwahl kosten Ruf.','Freie Stellen entstehen, wenn Vereine sich nach Negativserien von ihren Trainern trennen. Bei „Trainer unter Druck“ siehst du, wo es bald so weit sein könnte.','Bewerben kannst du dich bis zu deiner Ruf-Stufe. Antwort kommt nach 1 bis 3 Terminen. Manchmal kommt auch ein Angebot von selbst, höchstens 3 pro Saison.','Co-Trainer-Stellen gibt es bei Vereinen 1 bis 2 Ruf-Stufen über dir. Dort schlägst du die Aufstellung vor, leitest das Training und führst Gespräche. Bewertet wird deine eigene Arbeit, nicht die Ergebnisse des Chefs. Wenn der Cheftrainer fliegt und er dir vertraut, wirst du befördert.','Ab Ruf '+W.sd.rufAb+' kannst du Sportdirektor werden: Transfers, Verträge, Prämien und Jugend sind dann deine Sache, Aufstellung und Training macht der Cheftrainer. Bewertet wirst du nach der Stärke deiner besten Spieler, dem Platz und den Finanzen.','Nationaltrainer wird man zusätzlich zum Verein, ab Ruf '+W.national.rufAb.DE+' bei großen Ländern. Länderspiele laufen nach festen Ligaterminen, alle zwei Saisons gibt es eine Europameisterschaft.','Nimmst du ein Angebot an, verlässt du deinen Verein. Traineramt und Präsidentenamt enden, beim neuen Verein bist du zuerst nur Trainer. Auf dem Konto liegt dort anfangs nur die Hälfte des üblichen Startkapitals.']},
  markt:{titel:'Markt',txt:['Ein Spielerscout findet in jedem Transferfenster junge Spieler mit Potenzial (Rohdiamanten) und Talente für die Jugend, und holt sie günstiger. Je besser der Scout, desto mehr Tipps, mehr Nachlass und genauere Schätzungen. Rohdiamanten werden an jedem Ligatermin mit etwas Glück besser, bis sie ihr Potenzial erreicht haben.','Spieler kaufen und verkaufen geht nur in der Sommer- und der Winterpause.','Kaufen kostet den Marktwert, verkaufen bringt 80 % davon.','Familienmitglieder bekommen dein Angebot und können annehmen, ablehnen oder mehr verlangen.']},
  auswertung:{titel:'Auswertung',txt:['Hier steht, wie das Spiel ausgegangen ist und was es gebracht hat.','Unten findest du alle anderen Ergebnisse. Mit dem großen Knopf geht es weiter zur Planung.']}

  </header>`;
  let body;

  if(S.phase==='planung'&&!istPraesident()&&['stadion','finanzen'].includes(UI.tab)) body=`<div class="vorstand-hinweis">Präsident ist der Computer-Vorstand. Bauen, Preise und Werbeverträge entscheidet er.</div>`+body;

  const warn=UI.speicherFehler?`<div class="fehler reihe" style="justify-content:space-between;border-radius:0"><span class="f1" style="min-width:min(260px,100%)">⚠ Nicht gespeichert: ${h(UI.speicherFehler)}</span><button class="btn klein" style="color:var(--tinte)" data-a="speichernDatei">Als Datei sichern</button><button class="btn klein" style="color:var(--tinte)" data-a="speichernNochmal">Nochmal versuchen</button></div>`:'';
  return top+mpBand()+warn+`<div class="inhalt">${body}</div>`+(S.phase==='planung'?nav():'');
}

function zuTun(c){
  const D=L(c), weg=c.kader.filter(p=>p.wechsel).length, fehlt=stammFehlt(c);
  const elfOk=c.aufstellung.ids.every(id=>{ const p=c.kader.find(x=>x.id===id); return p&&verfuegbar(p); });
  const l=[];
  if(fehlt.length) l.push({t:'Aufstellung',v:`Stammplatz versprochen: ${fehlt.map(p=>p.name).join(', ')} fehlt`,ziel:'kader|aufstellung',warn:true});
  else if(!elfOk) l.push({t:'Aufstellung',v:`Verletzte oder gesperrte Spieler in der ${W.worte.elf}`,ziel:'kader|aufstellung',warn:true});
  if(pflichtVerletzt(c)&&S.saison!==c.gnadeSaison) l.push({t:'Stadion',v:`Ligapflicht ${zahl(D.mindest)} Plätze nicht erfüllt`,ziel:'stadion|stadion',warn:true});
  if(weg) l.push({t:'Stimmung',v:`${weg} Spieler ${weg>1?'wollen':'will'} weg`,ziel:'kader|kaderliste',warn:true});
  const A=S.manager[S.aktiv].amt;
  if(A&&A.vertrauen<amtGrenze(A)+10) l.push({t:A.praesident?'Mitglieder':istCoAmt(A)?'Cheftrainer':'Vorstand',v:`unzufrieden · Vertrauen ${Math.round(A.vertrauen)}`,ziel:'verein|vertrauen',warn:true});
  if(sitzungOffen(S.manager[S.aktiv])) l.push({t:'Vorstandssitzung',v:`${S.manager[S.aktiv].vorstand.sitzung.punkte.filter(p=>!p.status).length} Punkte offen`,ziel:'verein|sitzung',warn:true});
  if(c.konto<0) l.push({t:'Konto',v:'Im Minus: Kaufen und Bauen gesperrt',ziel:'finanzen|ticket',warn:true});
  if(S.mitspielerAngebote.some(o=>o.an===S.aktiv)) l.push({t:'Transferangebot',v:'Ein Familienmitglied wartet auf Antwort',ziel:'markt|markt',warn:true});
  if(c.angebote.length) l.push({t:'Werbepartner',v:`${c.angebote.length} Angebot${c.angebote.length>1?'e':''} offen`,ziel:'finanzen|angebote'});
  if(fensterOffen()) l.push({t:'Transferfenster',v:'offen',ziel:'markt|markt'});
  { const N=S.manager[S.aktiv].national, t=aktTermin(); if(N&&t&&t.art==='liga'&&W.national.nachLigaTermin.includes(t.nr)) l.push({t:'Länderspiel',v:`${nationName(N.land)} spielt nach diesem Termin`,ziel:'karriere|national'}); }
  if(!l.length) return `<div class="zutun-leer"><span class="zt-punkt ok">✓</span>Alles erledigt</div>`;
  return `<div class="sp" style="gap:0"><span class="lab">Zu tun</span>${l.map(x=>`<div class="zeile sprung" role="button" tabindex="0" data-a="springe" data-v="${x.ziel}"><span class="zt-punkt ${x.warn?'warn':'info'}">${x.warn?'!':'i'}</span><b class="f1">${h(x.t)}</b><span class="hinweis zt-wert">${h(x.v)}</span><span class="pfeil" aria-hidden="true">›</span></div>`).join('')}</div>`;
}

function sitzungBox(mi){

  const s=vs.sitzung; if(!s) return '';
  const offen=s.punkte.filter(p=>!p.status).length;
  const bilanz=s.kontoVorher!=null?s.konto-s.kontoVorher:null;
  return `<div class="box sitzung" id="ziel-sitzung">
    <div class="reihe" style="justify-content:space-between"><span class="lab">Vorstandssitzung · Termin ${s.termin}</span><span class="hinweis">${offen?`${offen} offen`:'erledigt'}</span></div>
    <div class="hinweis" style="color:var(--tinte)">Helga: Kontostand ${eur(s.konto)}${bilanz!=null?`, seit der letzten Sitzung ${bilanz>=0?'+':'−'}${eur(Math.abs(bilanz))}`:''}.</div>
    ${s.punkte.map(p=>{ const P=VORSTAND[p.wer];
      const stimmen=Object.entries(p.stimmen).filter(([k])=>k!==p.wer).map(([k,v])=>`<span class="st st${v}">${h(VORSTAND[k].name.split(' ')[0])} ${SITZUNG_STIMME[String(v)]}</span>`).join('');
      return `<div class="s-punkt"><span class="lab">${h(P.name.split(' ')[0])} · ${h(P.rolle)}</span><b>${h(p.titel)}</b><span style="font-size:13px;line-height:1.4">${h(p.text)}</span>
        <div class="reihe" style="gap:6px">${stimmen}</div>
        ${p.status?`<b class="${p.status==='ja'?'gruen':p.status==='nein'?'rotx':'grau'}">${{ja:'Beschlossen',nein:'Abgelehnt',vertagt:'Vertagt'}[p.status]}</b>`
          :`<div class="reihe"><button class="btn voll klein" data-a="sJa" data-v="${p.nr}">Zustimmen</button><button class="btn klein" data-a="sNein" data-v="${p.nr}">Ablehnen</button></div>`}</div>`; }).join('')}

  </div>`;
}

function euroZone(ligaIdx,p){
  if(S.format!=='komplett') return '';
  const D=W.ligen[ligaIdx]; if(topLiga(D.land)!==ligaIdx) return '';
  const Q=W.laender[D.land].euro;
  for(const wb of EURO) if(Q[wb].includes(p)) return W.euro[wb].kurz;
  return '';
}
function tabelleHtml(ligaIdx,markId,kompakt){
  const D=W.ligen[ligaIdx], t=tabelle(ligaIdx); let rows=t;
  if(kompakt){ const i=Math.max(0,t.findIndex(r=>r.id===markId)); const a=clamp(i-Math.floor(kompakt/2),0,t.length-kompakt); rows=t.slice(a,a+kompakt); }
  const hatOber=W.ligen.some(x=>x.unter===D.id);
  return `<div class="scroll"><table class="tab"><tr><th>#</th><th>Verein</th><th class="r">Sp</th>${kompakt?'':'<th class="r">S</th><th class="r">U</th><th class="r">N</th><th class="r">Tore</th>'}<th class="r">TD</th><th class="r">Pkt</th></tr>${rows.map(r=>{ const p=t.indexOf(r)+1, c=S.clubs[r.id];
    const zone=p<=W.auf&&hatOber?'var(--rasen)':p>t.length-W.auf&&D.unter?'var(--rot)':'transparent', ez=euroZone(ligaIdx,p);
    return `<tr style="background:${clubTint(c)||(r.id===markId?'#efe5cf':'transparent')}"><td class="m" style="border-left:4px solid ${zone}">${p}</td><td style="font-weight:${c.human>=0?700:400}">${h(c.name)} ${ez?`<span class="chip grau">${ez}</span>`:''}</td><td class="r m">${r.sp}</td>${kompakt?'':`<td class="r m">${r.s}</td><td class="r m">${r.u}</td><td class="r m">${r.n}</td><td class="r m">${r.tg}:${r.tgg}</td>`}<td class="r m">${r.tg-r.tgg>0?'+':''}${r.tg-r.tgg}</td><td class="r m"><b>${r.pkt}</b></td></tr>`; }).join('')}</table></div>`;
}
function renderTabellen(){

function euroTabelleHtml(wb){
