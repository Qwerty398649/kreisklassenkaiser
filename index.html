<!DOCTYPE html>
<html lang="de" data-design="flutlicht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Kreisklassenkaiser</title>
<style>
:root{--papier:#f4efe4;--tinte:#1d1f1a;--rot:#c8321e;--rasen:#2f6b3a;--gold:#e8b04a;--linie:#d8cfbd;--grau:#5e5a50;--hell:#fffaf0;--bg:#e9e2d3;--dunkel2:#262823;--dunkel3:#3a3c35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinte);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px}
.d{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;text-transform:uppercase;line-height:.95}
.m{font-family:'JetBrains Mono',ui-monospace,monospace}
#app{max-width:1040px;margin:0 auto;min-height:100vh;background:var(--papier);display:flex;flex-direction:column;transition:background-color .35s ease}
#app[data-bereich=tabellen]{background:#d4e3f5}
#app[data-bereich=wettbewerbe]{background:#f3e0b0}
#app[data-bereich=kader]{background:#d6eacb}
#app[data-bereich=stadion]{background:#cfe8dc}
#app[data-bereich=finanzen]{background:#f1d9c6}
#app[data-bereich=markt]{background:#e0d5f1}
#app[data-bereich=museum]{background:#eadcc4}
.windrad{animation:dreh 4s linear infinite}
@media (prefers-reduced-motion:reduce){.windrad{animation:none}}
.vitrine{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.trophae{border:2px solid var(--tinte);border-radius:16px;background:linear-gradient(180deg,#3a3c35,#1d1f1a);color:var(--papier);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:inset 0 -10px 0 #5a4630}
.trophae svg{width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.trophae b{font-size:13px;line-height:1.2}
.trophae .anz{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:22px;color:var(--gold)}
.trophae .jahre{font-size:11px;color:var(--linie)}
.sprung{cursor:pointer;border-radius:10px;padding:2px 6px;margin:0 -6px}
.sprung:hover{background:rgba(29,31,26,.06)}
.sprung .pfeil{font-size:22px;line-height:1;color:var(--grau);transition:transform .15s}
.sprung:hover .pfeil,.sprung:focus-visible .pfeil{transform:translateX(3px);color:var(--tinte)}
.sprung:focus-visible{outline:3px solid var(--mf,var(--tinte));outline-offset:1px}
[id^=ziel-]{scroll-margin-top:16px}
.blink{animation:blink 1.8s ease}
@keyframes blink{0%,55%{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{min-height:44px;padding:0 18px;border:2px solid var(--tinte);background:var(--hell);font-weight:700;font-size:14px;border-radius:999px;box-shadow:0 3px 0 rgba(29,31,26,.16),0 8px 16px rgba(29,31,26,.10);transition:transform .15s ease,box-shadow .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 rgba(29,31,26,.16),0 12px 22px rgba(29,31,26,.16)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 rgba(29,31,26,.16),0 3px 8px rgba(29,31,26,.10)}
.konf .btn{background:transparent}
.btn.voll{background:var(--tinte);color:var(--papier)}
.btn.rot{background:var(--rot);border-color:var(--rot);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--tinte)}
.btn.klein{min-height:32px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gross{align-self:center;padding:0 34px}
.gross{min-height:56px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grau)}
.box{border:2px solid var(--tinte);border-radius:16px;background:var(--hell);padding:14px;display:flex;flex-direction:column;gap:10px}
.dunkel{border-radius:16px;background:var(--tinte);color:var(--papier);padding:16px;display:flex;flex-direction:column;gap:8px}
.zeile{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid var(--linie);padding:2px 0}
.zeile.klick{cursor:pointer}.zeile.klick:hover{background:#efe5cf}
.zeile.sel{background:#efe5cf;outline:2px solid var(--tinte)}
.f1{flex:1;min-width:0}
.grau{color:var(--grau)}.gruen{color:var(--rasen)}.rotx{color:var(--rot)}
.top{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:2px solid var(--tinte)}
.top-zeile{display:flex;align-items:center;gap:10px;min-width:0}
.top-titel{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.top-titel b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-titel span{font-size:12px;color:var(--grau);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-rechts{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.top-rechts>span:last-child{font-size:11px;color:var(--grau);white-space:nowrap}
.top-konto{font-weight:600;font-size:14px}
.top-konto.minus{color:var(--rot)}
.top-knopf{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--linie);background:var(--hell);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
@media (max-width:380px){.top-zeile .wap{display:none}.top-konto{font-size:13px}}
.wap{flex:none;display:inline-block;position:relative;overflow:hidden}
.mgr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.mgr::-webkit-scrollbar{display:none}
.mgr button{flex:none}
.mgr button{border:2px solid var(--mf,var(--tinte));background:var(--hell);padding:3px 12px 3px 3px;font-weight:700;font-size:13px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(29,31,26,.12)}
.mgr button.an{background:var(--mf,var(--tinte));color:#fff}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--tinte);background:var(--papier);height:56px;z-index:2;background:inherit}
.nav button{border:0;background:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.nav button.an{background:var(--mf,var(--tinte));color:#fff}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg.reiter{max-width:560px;flex:none}
.seg.reiter button{min-height:44px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;border:2px solid var(--tinte);border-radius:999px;overflow:hidden}.seg button{border:0;background:none;min-height:40px;font-weight:700;font-size:14px;padding:0 8px}.seg button.an{background:var(--tinte);color:var(--papier)}
input,select{font:inherit;min-height:44px;border:2px solid var(--tinte);border-radius:12px;background:var(--hell);padding:0 10px;color:var(--tinte);max-width:100%}
input[type=checkbox]{min-height:0;width:20px;height:20px}
input[type=color]{padding:2px;width:52px}
.inhalt{flex:1;padding:16px 18px 28px;display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px;align-items:start}
.sp{display:flex;flex-direction:column;gap:6px}
.reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table.tab{width:100%;border-collapse:collapse;font-size:14px}
table.tab th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grau);text-align:left;border-bottom:2px solid var(--tinte);padding:4px}
table.tab td{border-bottom:1px solid var(--linie);padding:5px 4px}
table.tab td.r,table.tab th.r{text-align:right}
.toggle{width:44px;height:24px;background:var(--linie);position:relative;display:inline-block;border:0;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;transition:left .2s}
.toggle.an{background:var(--rasen)}.toggle.an::after{left:23px}
.feld{position:relative;background:var(--rasen);border:2px solid var(--tinte);height:330px}
.feld .linie{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(244,239,228,.5)}
.feld .strafraum{position:absolute;left:34%;right:34%;bottom:0;height:46px;border:2px solid rgba(244,239,228,.5);border-bottom:0}
.spieler{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:0;background:none}
.spieler .kreis{width:36px;height:36px;border-radius:50%;background:var(--papier);color:var(--tinte);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:3px solid var(--papier)}
.spieler.sel .kreis{border-color:var(--gold);background:var(--gold)}
.spieler .nm{font-size:11px;font-weight:700;color:var(--papier);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.konf{position:fixed;inset:0;background:var(--tinte);color:var(--papier);overflow:auto;z-index:20}
.konfIn{max-width:1280px;margin:0 auto;padding:24px 28px;display:grid;grid-template-columns:1fr 340px;gap:24px}
@media (max-width:900px){.konfIn{grid-template-columns:1fr;padding:16px}}
.konf .seg button.an{background:var(--gold);color:var(--tinte)}
.match{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:14px;background:#2a2c26;padding:12px 16px;border-radius:14px;border-left:6px solid var(--hl,transparent);border-right:6px solid var(--hr,transparent)}
@media (max-width:600px){.match{grid-template-columns:1fr 96px 1fr;gap:6px;padding:10px}.match b{font-size:15px!important}}
.match.tor{background:var(--rot)}
.lp{grid-column:1/-1;position:relative;margin-top:6px}
.lp svg{display:block;width:100%;height:auto;max-height:240px}
.lp-ball{animation:lpBall var(--d,380ms) ease-out forwards}
@keyframes lpBall{from{transform:translate(var(--x0),var(--y0))}to{transform:translate(var(--x1),var(--y1))}}
.lp-bogen{animation:lpBogen var(--d,380ms) ease-in-out forwards}
@keyframes lpBogen{0%{transform:translate(var(--x0),var(--y0))}50%{transform:translate(var(--xm),var(--ym))}100%{transform:translate(var(--x1),var(--y1))}}
.lp-sp{animation:lpBall var(--d,380ms) ease-in-out forwards}
.lp-pass{animation:lpPass var(--d,380ms) ease-out forwards}
@keyframes lpPass{0%{opacity:.7}100%{opacity:0}}
.lp-pfeil{animation:lpPuls .7s ease-in-out infinite alternate}
@keyframes lpPuls{from{opacity:.25}to{opacity:.95}}
.lp-tor{transform-box:fill-box;transform-origin:center;animation:lpTor .5s ease-out}
@keyframes lpTor{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.lp-lab{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(29,31,26,.82);color:var(--papier);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.lp-lab.heiss{background:var(--rot);color:#fff}
.lp-lab.tor{background:var(--gold);color:var(--tinte)}
.elfer{grid-column:1/-1;display:flex;justify-content:center;gap:18px;font-size:13px}
.elfer i{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 2px;border:2px solid var(--papier)}
.elfer i.t{background:var(--gold);border-color:var(--gold)}.elfer i.x{background:var(--rot);border-color:var(--rot)}
.overlay{position:fixed;inset:0;background:rgba(29,31,26,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.overlay .box{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.overlay .box>*{flex-shrink:0}
.stadion{background:var(--linie);display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:4px;padding:6px;height:300px}
.teil{display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .4s;border:0;padding:0}
.teil span{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:1px 5px;background:var(--papier);color:var(--tinte)}
.teil.sel{outline:3px solid var(--tinte);outline-offset:1px}
.platz{grid-column:2;grid-row:2;background:var(--rasen);border:2px solid rgba(244,239,228,.7);position:relative;min-height:90px}
.platz::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(244,239,228,.7)}
.platz::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;border:2px solid rgba(244,239,228,.7);border-radius:50%;transform:translate(-50%,-50%)}
.ecke{width:14px;height:14px}
.hinweis{font-size:13px;line-height:1.45;color:var(--grau)}
.fehler{background:var(--rot);color:#fff;padding:10px 14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--tinte);color:var(--papier);padding:10px 16px;font-weight:700;z-index:40;max-width:90vw}
.sterne{color:var(--rot);letter-spacing:1px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border:1.5px solid currentColor}
.pokal{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13px;min-height:30px;border-bottom:1px solid var(--linie)}
.pokal .w{font-weight:700}
.scroll{overflow-x:auto}
.laune{display:inline-block;width:46px;height:8px;border-radius:4px;background:var(--linie);overflow:hidden;flex:none;vertical-align:middle}
.laune i{display:block;height:100%;border-radius:4px}
.weg{color:var(--rot);font-weight:800}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pm .btn{flex-direction:column;gap:0;min-height:54px;padding:4px 8px;line-height:1.2;font-size:13px}
.pm .btn small{font-weight:400;font-size:11px}
.wegbox{border:2px solid var(--rot);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fbe7e2}
.ava{flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 6px rgba(29,31,26,.25)}
.ava-wahl{position:relative;cursor:pointer;display:inline-flex}
.ava-wahl::after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:13px;background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.farbwahl{display:flex;gap:6px;flex-wrap:wrap}
.farbwahl button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linie)}
.farbwahl button.an{box-shadow:0 0 0 3px var(--tinte)}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.schwebe,.ball-dreh{animation:none}}
.gelaende{overflow-x:auto;border:2px solid var(--tinte);border-radius:16px;background:#9db87a}
.gelaende svg{display:block;width:100%;min-width:600px;height:auto}
@media (prefers-reduced-motion:reduce){.lp-ball,.lp-pfeil,.lp-tor,.lp-bogen,.lp-sp,.lp-pass{animation:none}.lp-ball,.lp-bogen,.lp-sp{transform:translate(var(--x1),var(--y1))}.lp-pass{opacity:0}}
.szene{display:block;width:100%;height:auto;border-radius:14px;border:2px solid var(--tinte);background:#9db87a;animation:szEin .45s ease}
@keyframes szEin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.szene{animation:none}}
.overlay .box.weit{max-width:860px}
.szwrap{position:relative}
.szwrap .szi{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:2px solid #1d1f1a;background:#fffaf0;color:#1d1f1a;font:italic 800 18px Georgia,serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:2}
.szwrap.offen .szi{background:#1d1f1a;color:#fffaf0}
.szwrap .sztxt{display:none;position:absolute;top:50px;right:8px;left:8px;max-width:420px;margin-left:auto;background:#fffaf0;color:#1d1f1a;border:2px solid #1d1f1a;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:2}
.szwrap.offen .sztxt{display:block}
.erklbox{display:flex;flex-direction:column;align-items:flex-start;gap:6px;flex-shrink:0}
.infoi{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px 0 5px;border:1.5px solid var(--grau);border-radius:999px;background:transparent;color:var(--grau);font-family:inherit;font-size:12px;font-weight:700}
.infoi>span{width:24px;height:24px;border-radius:50%;background:var(--grau);color:var(--papier);font:italic 800 14px Georgia,serif;display:flex;align-items:center;justify-content:center}
.infoi:hover,.erklbox.offen .infoi{border-color:var(--tinte);color:var(--tinte)}
.erklbox.offen .infoi>span{background:var(--tinte)}
.erkltxt{display:none}
.erklbox.offen .erkltxt{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--grau);padding-left:10px}
.erkltxt .hinweis{display:block}
.rgbalken{flex:none;height:6px;border-radius:3px;background:var(--linie);overflow:hidden}
.rgbalken i{display:block;height:100%;width:0;background:var(--tinte);animation:rgLauf linear forwards}
@keyframes rgLauf{to{width:100%}}
@media (prefers-reduced-motion:reduce){.rgbalken i{animation:none;width:100%}}
.blickchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.blickchips .btn{flex:none}
/* ================= DESIGN FLUTLICHT ================= */
/* ---------- 1a Flutlicht: dunkel, Glas, Neon-Limette ---------- */
html[data-design=flutlicht]{color-scheme:dark;--bg:#05080f;--papier:#0b1020;--hell:rgba(255,255,255,.06);--tinte:#eef2ff;--grau:#9aa3c7;--linie:rgba(255,255,255,.12);--rasen:#c6f432;--rot:#ff6b57;--gold:#ffb44a;--dunkel2:#141a30;--dunkel3:#232a45;--glas:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03))}
html[data-design=flutlicht] body{font-family:'Bricolage Grotesque',system-ui,sans-serif}
html[data-design=flutlicht] .d{font-family:'Bricolage Grotesque',system-ui,sans-serif;text-transform:none;letter-spacing:-.035em;line-height:.95}
html[data-design=flutlicht] .m{font-family:'JetBrains Mono',ui-monospace,monospace}
html[data-design=flutlicht] #app{background:radial-gradient(circle at 0% 20%,rgba(124,196,255,.13),transparent 45%),radial-gradient(circle at 100% 70%,rgba(198,244,50,.08),transparent 45%),#0b1020;background-attachment:fixed}
html[data-design=flutlicht] #app[data-bereich=tabellen]{background:radial-gradient(circle at 0% 10%,rgba(124,196,255,.22),transparent 50%),#0b1020}
html[data-design=flutlicht] #app[data-bereich=wettbewerbe]{background:radial-gradient(circle at 100% 0%,rgba(255,180,74,.2),transparent 50%),#0b1020}
html[data-design=flutlicht] #app[data-bereich=kader]{background:radial-gradient(circle at 0% 30%,rgba(198,244,50,.16),transparent 50%),#0b1020}
html[data-design=flutlicht] #app[data-bereich=stadion]{background:radial-gradient(circle at 100% 20%,rgba(60,207,145,.18),transparent 50%),#0b1020}
html[data-design=flutlicht] #app[data-bereich=finanzen]{background:radial-gradient(circle at 0% 0%,rgba(255,107,87,.18),transparent 50%),#0b1020}
html[data-design=flutlicht] #app[data-bereich=markt]{background:radial-gradient(circle at 100% 10%,rgba(185,163,255,.2),transparent 50%),#0b1020}
html[data-design=flutlicht] #app[data-bereich=museum]{background:radial-gradient(circle at 50% 0%,rgba(255,180,74,.16),transparent 55%),#0b1020}
html[data-design=flutlicht] .btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--tinte);border-radius:16px;box-shadow:none}
html[data-design=flutlicht] .btn:hover:not(:disabled){box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateY(-2px)}
html[data-design=flutlicht] .btn.voll{background:#c6f432;border-color:#c6f432;color:#0b1020;box-shadow:0 10px 30px rgba(198,244,50,.25)}
html[data-design=flutlicht] .btn.rot{background:#ff6b57;border-color:#ff6b57;color:#0b1020}

<script id="engine">
// ================= ENGINE (ohne DOM) =================
let S = null;
// Zufallsquelle: normalerweise Math.random. Für ein laufendes Live-Spiel wird ein gespeicherter Startwert benutzt,
// damit das Spiel nach einem Neuladen genauso ausgeht und nicht neu ausgewürfelt werden kann.
let RNG = Math.random;
const rnd = () => RNG();
function seedRng(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function zufallsQuelle(seed){ RNG = seed==null ? Math.random : seedRng(seed); }
const ri = (a,b) => a + Math.floor(rnd()*(b-a+1));
const pick = a => a[Math.floor(rnd()*a.length)];
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const summe = a => a.reduce((x,y)=>x+y,0);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function gauss(){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function eur(n){ const v=Math.round(n); if(Math.abs(v)>=1e6) return (v/1e6).toLocaleString('de-DE',{maximumFractionDigits:2})+' Mio €'; return v.toLocaleString('de-DE')+' €'; }
const zahl = n => Math.round(n).toLocaleString('de-DE');

const LIGA_IDX={}; W.ligen.forEach((l,i)=>LIGA_IDX[l.id]=i);
const L = c => W.ligen[c.liga];
const farbeOk = f => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(f||'');
const niv = c => L(c).niveau;
const LAENDER = Object.keys(W.laender);
const EURO = ['cl','el','ecl'];
const topLiga = land => W.ligen.findIndex(l=>l.land===land);
const spielLigen = () => W.ligen.map((l,i)=>i).filter(i=>!W.ligen[i].keineLiga);
// Wechselt die Sportart: tauscht die Werte in W und die Vereinslisten in DATEN, berechnet Liga-Index und Länderliste neu.
function sportSetzen(id){
  const P=SPORTARTEN[id]; if(!P) throw new Error('Unbekannte Sportart: '+id);
  Object.assign(W,P.w);
  for(const k of Object.keys(DATEN)) delete DATEN[k];
  Object.assign(DATEN,P.daten);
  for(const k of Object.keys(LIGA_IDX)) delete LIGA_IDX[k];
  W.ligen.forEach((l,i)=>LIGA_IDX[l.id]=i);
  LAENDER.length=0; LAENDER.push(...Object.keys(W.laender));
  for(const k of Object.keys(MW_LIGA)) delete MW_LIGA[k];
  RUF_STUFEN.forEach((s,i)=>s.niveau=W.rufNiveau[i]);
}
const sportName = () => SPORTARTEN[W.sport].name;
const posK = pos => W.posKurz[pos]||pos;
const SPIELMIN = () => W.spielMinuten;

const VPRE=['FC','SV','TuS','VfB','SC','TSV','VfL','SpVgg','Eintracht','Fortuna','Rot-Weiß','Blau-Weiß','Grün-Weiß','Germania','Union','Borussia','Viktoria','Concordia','Alemannia','Sportfreunde'];
const VORT=['Bolzplatz','Rasenmäher','Kreisel','Flutlicht','Abseitsfalle','Nachspielzeit','Ersatzbank','Pfostenschuss','Eckfahne','Lattenkreuz','Elfmeterpunkt','Mittelkreis','Grätsche','Doppelpass','Torlinie','Seitenaus','Freistoß','Querpass','Steilpass','Fallrückzieher','Kopfball','Strafraum','Schienbein','Stollenschuh','Kabinenfest','Halbzeittee','Bratwurst','Vereinsheim','Linienrichter','Flanke','Abstoß','Einwurf','Ballwart','Platzwart','Wadenkrampf','Trikottausch','Aufstiegstraum','Dorfplatz','Kunstrasen','Aschenplatz','Schlusspfiff','Anstoß','Netzroller','Querlatte','Kampfgeist','Mannschaftsbus','Elfmeterkiller','Torjäger','Libero','Manndecker','Kreidelinie','Torwand','Dorfkrug','Sägewerk','Mühlenbach','Kirchturm','Schützenfest','Heuballen','Weidezaun'];

const SPONS=['Bäckerei Krümel','Wurst-Willi','Fahrschule Grün','Autohaus Blech','Getränke Prost','Elektro Funke','Dachdecker Hoch','Gärtnerei Wildwuchs','Optik Durchblick','Friseur Haarscharf','Pizzeria Bella','Malerbetrieb Pinsel','Sanitär Rohrfrei','Tankstelle Vollgas','Brauerei Hopfenglück','Energie Strom AG','Versicherung Sicher','Bank Zinseszins','Telefon Funkloch','Möbel Sofaland'];

// ---------- Marktwert & Gehalt ----------
function marktwert(p){
  const P=W.marktwertPunkte, s=clamp(p.staerke,1,99);
  let w=P[0][1];
  for(let i=0;i<P.length-1;i++){ const [a,va]=P[i],[b,vb]=P[i+1]; if(s>=a&&s<=b){ w=va*Math.pow(vb/va,(s-a)/(b-a)); break; } }
  const af = (W.altersFaktor.find(([bis])=>p.alter<=bis)||W.altersFaktor[W.altersFaktor.length-1])[1];
  return Math.max(50, Math.round(w*af/10)*10);
}
const MW_LIGA={};
function gehalt(p,ligaIdx){
  if(ligaIdx==null) return Math.max(W.aufwandMin, marktwert(p)*W.gehaltFaktor);
  const D=W.ligen[ligaIdx], ref=MW_LIGA[ligaIdx]??(MW_LIGA[ligaIdx]=marktwert({staerke:D.kader,alter:26}));
  return Math.max(W.aufwandMin, ref*Math.pow(marktwert(p)/ref,W.gehaltExponent)*W.gehaltFaktor*D.gehalt);
}

// ---------- Erzeugung ----------
function neuerSpieler(avg,pos,land='DE',aMin=18,aMax=33){
  return { id:S.nextId++, name:pick(NAMEN[land]||NAMEN.DE), pos, staerke:clamp(Math.round(avg+gauss()*5),1,99), alter:ri(aMin,aMax), verletzt:0, gesperrt:0, tore:0, serie:0 };
}
function kuerzel(name){
  const stop=/^(FC|SV|SC|TSV|VfB|VfL|TuS|SpVgg|AC|AS|SS|US|CF|CD|RC|UD|SD|RCD|AFC|OGC|SL|SK|FK|NK|KV|KRC|RSC|BSC|SSV|KSV|TSG|RB|MSV|SG|FSV|CA|SCU|GD|HNK|IF|BK|FCO|HSC|AJ|ES|USL|SCO|AF|EA|AD|CE|KAA|FCSB|CFR|PEC|NEC|RKC|VVV|MVV|TOP|ADO|AZ|PSV|AFS)$/i;
  const w=name.replace(/[^\p{L}0-9\-\/ ]/gu,'').split(/[\s\-\/]+/).filter(Boolean);
  const kern=w.filter(x=>!stop.test(x)&&!/^\d/.test(x));
  const b=kern.length?kern:w;
  const k = b.length>=2 ? b[0].slice(0,1)+b[b.length-1].slice(0,2) : (b[0]||'XXX').slice(0,3);
  return k.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace('ß','SS').slice(0,3).padEnd(3,'X');
}
function neuesStadion(stufe){
  const t=(n,s,w,o)=>({ nord:{lvl:n,dach:false,vip:false}, sued:{lvl:s,dach:false,vip:false}, west:{lvl:w,dach:false,vip:false}, ost:{lvl:o,dach:false,vip:false} });
  const conf={1:t(3,3,2,2),2:t(2,2,2,1),3:t(2,1,1,1),4:t(1,1,1,0),5:t(1,0,0,0),6:t(1,0,0,0),7:t(0,0,0,0),8:t(0,0,0,0),9:t(0,0,0,0),10:t(0,0,0,0)}[stufe];
  const st={trib:conf, stehwall:stufe<=8, holz:stufe===7, flutlicht:stufe<=5, tafel:stufe<=2, bau:[]};
  if(stufe===1){ for(const k in st.trib) st.trib[k].dach=true; st.trib.nord.vip=true; }
  if(stufe===2){ st.trib.nord.dach=true; st.trib.sued.dach=true; }
  return st;
}
function vereinsName(belegt){
  const V=W.vereinsWorte||{pre:VPRE,ort:VORT,suf:VSUF};
  for(let i=0;i<500;i++){ const n=pick(V.pre)+' '+pick(V.ort)+pick(V.suf); if(!belegt.has(n)){ belegt.add(n); return n; } }
  return 'SV Ersatzname '+S.nextId++;
}
function landVon(c){ return W.ligen[c.liga].land; }
function neuerVerein(ligaIdx,name,opt={}){
  const D=W.ligen[ligaIdx];
  const basis=Math.round((opt.basis??D.kader)*10)/10;
  const c={ id:S.clubs.length, name, kurz:opt.kurz||kuerzel(name), farbe:opt.farbe||pick(FARBEN), farbe2:opt.farbe2||'#ffffff', wappen:opt.wappen||pick(WAPPEN),
    liga:ligaIdx, basis, land:opt.land||D.land, kader:[], konto:D.start, fans:Math.round(D.fans*(0.75+0.5*((basis-D.kader)/(2*W.spreizung)+0.5))), stimmung:1,

// ---------- Spielpläne ----------
const RR={};
function rrRunden(n){
  if(RR[n]) return RR[n];
  const arr=[...Array(n).keys()], runden=[];
  for(let r=0;r<n-1;r++){
    const paare=[];
    for(let i=0;i<n/2;i++){ const a=arr[i], b=arr[n-1-i]; paare.push((i===0 && r%2) ? [b,a] : (i%2===r%2 ? [a,b] : [b,a])); }
    runden.push(paare); arr.splice(1,0,arr.pop());
  }
  return RR[n]=runden;
}
function spielplan(n){ const r=rrRunden(n); return [...r, ...r.map(p=>p.map(([a,b])=>[b,a]))]; }
function ligaRunde(D,nr){
  if(D.keineLiga) return null;
  if(D.vereine===20) return nr<=38?nr:null;
  const f=W.kalender.frei18; if(f.includes(nr)) return null;
  return nr - f.filter(x=>x<nr).length;
}
const rundenProSaison = D => 2*(D.vereine-1);

// ---------- Aufstellung ----------
function slots(f){ const [a,m,s]=(W.formationen[f]||W.formationen[W.formationStandard]).n; return ['TW',...Array(a).fill('AB'),...Array(m).fill('MF'),...Array(s).fill('ST')]; }
const verfuegbar = p => !p.verletzt && !p.gesperrt;
function effektiv(p,pos){ if(p.pos===pos) return p.staerke; if(p.pos==='TW'||pos==='TW') return p.staerke*0.4; return p.staerke*0.78; }
function besterFuer(c,pos,used){
  let k=c.kader.filter(p=>verfuegbar(p)&&!used.has(p.id)&&p.pos===pos).sort((a,b)=>b.staerke-a.staerke)[0];
  if(!k) k=c.kader.filter(p=>verfuegbar(p)&&!used.has(p.id)&&p.pos!=='TW').sort((a,b)=>effektiv(b,pos)-effektiv(a,pos))[0];
  if(!k) k=c.kader.filter(p=>verfuegbar(p)&&!used.has(p.id)).sort((a,b)=>effektiv(b,pos)-effektiv(a,pos))[0];
  if(!k) k=c.kader.filter(p=>!used.has(p.id))[0];
  return k;
}
function autoAufstellung(c,f){
  f=f||(c.aufstellung&&c.aufstellung.formation)||W.formationStandard;
  if(!W.formationen[f]) f=W.formationStandard;
  const used=new Set(), ids=[];
  for(const pos of slots(f)){ const p=besterFuer(c,pos,used); if(p){ used.add(p.id); ids.push(p.id); } else ids.push(null); }
  if(c.human>=0) stammplaetzeEinbauen(c,f,ids);
  return {formation:f, ids};
}
// Versprochene, fitte Spieler kommen in die Elf: zuerst auf ihre Position, sonst auf den schwächsten Feldplatz.
function stammplaetzeEinbauen(c,f,ids){
  const sl=slots(f), map=new Map(c.kader.map(p=>[p.id,p]));
  const fest=new Set(c.kader.filter(p=>p.versprechen&&verfuegbar(p)).map(p=>p.id));
  for(const id of fest){
    if(ids.includes(id)) continue;
    const p=map.get(id);
    const frei=ids.map((x,i)=>i).filter(i=>!fest.has(ids[i]));
    const wert=i=>{ const q=map.get(ids[i]); return q?effektiv(q,sl[i]):-1; };
    let kand=frei.filter(i=>sl[i]===p.pos);
    if(!kand.length) kand=frei.filter(i=>sl[i]!=='TW'&&p.pos!=='TW');
    if(!kand.length) continue;
    const i=kand.sort((a,b)=>wert(a)-wert(b))[0];
    ids[i]=id;
  }
}
const stammFehlt = c => c.kader.filter(p=>p.versprechen&&verfuegbar(p)&&!c.aufstellung.ids.includes(p.id));
function pruefeAufstellung(c){
  if(!c.aufstellung){ c.aufstellung=autoAufstellung(c); return 0; }
  const a=c.aufstellung, sl=slots(a.formation), map=new Map(c.kader.map(p=>[p.id,p])), used=new Set();
  let ersetzt=0;
  a.ids=sl.map((_,i)=>{ const id=a.ids[i], p=map.get(id); if(p&&verfuegbar(p)&&!used.has(id)){ used.add(id); return id; } return null; });
  a.ids=a.ids.map((id,i)=>{ if(id!==null) return id; ersetzt++; const p=besterFuer(c,sl[i],used); if(p){ used.add(p.id); return p.id; } return null; });
  return ersetzt;
}
function teamWerte(c,ids,form,ausr,bonus=0){
  const sl=slots(form), map=new Map(c.kader.map(p=>[p.id,p])), v={TW:[],AB:[],MF:[],ST:[]};
  ids.forEach((id,i)=>{ const p=map.get(id); if(p) v[sl[i]].push(effektiv(p,sl[i])*(c.human>=0?launeFaktor(p):1)); });
  const avg=a=>a.length?summe(a)/a.length:3, F=W.formationen[form], A=W.ausrichtung[ausr];
  if(W.sport==='handball'){ const g=o=>summe(Object.entries(o).map(([k,w])=>w*avg(v[k])));
    return { tor:avg(v.TW)+bonus, abw:(g({AB:0.4,MF:0.4,ST:0.2})+bonus)*F.abw*A.abw, mf:(g({AB:0.2,MF:0.5,ST:0.3})+bonus)*F.mf, ang:(g({AB:0.2,MF:0.5,ST:0.3})+bonus)*F.ang*A.ang }; }
  return { tor:avg(v.TW)+bonus, abw:(avg(v.AB)+bonus)*F.abw*A.abw, mf:(avg(v.MF)+bonus)*F.mf, ang:(avg(v.ST)+bonus)*F.ang*A.ang };
}
function elfStaerke(c){ const map=new Map(c.kader.map(p=>[p.id,p])); const a=c.aufstellung.ids.map(id=>map.get(id)).filter(Boolean); return a.length?summe(a.map(p=>p.staerke))/a.length:1; }
// Stärke des Kerns: Durchschnitt der besten Spieler (Startformation + 4). Schwache Bankspieler zu verkaufen, ändert daran nichts.
function kernStaerke(c){ const n=autoAufstellung(c).ids.length+4; const s=c.kader.map(p=>p.staerke).sort((a,b)=>b-a).slice(0,n); return Math.round(summe(s)/Math.max(1,s.length)); }
function staerke(c){ return Math.round(summe(c.kader.map(p=>p.staerke))/Math.max(1,c.kader.length)); }
const laune = p => p.laune ?? W.laune.start;
const launeFaktor = p => 1+(laune(p)-60)*W.laune.staerkeFaktor;

// ---------- Gegnerbeobachtung ----------
// Computer-Vereine wählen Formation und Ausrichtung je Spiel. Der Plan hängt nur von Saison, Termin und Paarung ab
// und verbraucht keine Zufallszahlen aus RNG: So stimmt der Beobachtungsbericht, und Live-Spiele bleiben reproduzierbar.
function computerPlan(c,g){
  const r=seedRng(((S.saison*7919)^(S.termin*104729)^(c.id*31337)^(g.id*17))>>>0);
  const d=staerke(c)-staerke(g), w=d>3?[0.6,0.3,0.1]:d<-3?[0.1,0.3,0.6]:[0.25,0.5,0.25];
  const x=r(), ausrichtung=x<w[0]?'offensiv':x<w[0]+w[1]?'neutral':'defensiv';
  const forms=Object.keys(W.formationen), gew=forms.map(f=>f===W.formationStandard?3:1);
  let y=r()*summe(gew), formation=forms[0];
  for(let i=0;i<forms.length;i++){ y-=gew[i]; if(y<=0){ formation=forms[i]; break; } }
  return {formation, ausrichtung};
}
function gegnerPlan(c,g){ return g.human<0 ? computerPlan(g,c) : {formation:g.aufstellung.formation, ausrichtung:g.ausrichtung}; }
const beobKosten = c => Math.max(20,Math.round(W.beobachtung.kosten*ertragsFaktor(c)/10)*10);
const geheimKosten = c => Math.max(20,Math.round(W.beobachtung.geheim*ertragsFaktor(c)/10)*10);
const beobAktuell = (c,g) => c.beob&&c.beob.saison===S.saison&&c.beob.termin===S.termin&&c.beob.gegner===g.id ? c.beob : null;
const geheimAktiv = c => !!(c.geheim&&c.geheim.saison===S.saison&&c.geheim.termin===S.termin);
function konterFuer(plan){ return {ausrichtung:W.beobachtung.konterAusr[plan.ausrichtung], formation:(W.konterFormation||{})[plan.formation]||null}; }
function gegnerBeobachten(c){
  const n=naechstesSpiel(c); if(!n) return 'Kein Spiel an diesem Termin.';
  if(beobAktuell(c,n.gegner)) return 'Der Gegner ist schon beobachtet.';
  const k=beobKosten(c); if(c.konto<k) return 'Zu wenig Geld.';
  c.konto-=k; buchen(c,'Spielbeobachter '+n.gegner.kurz,-k);
  const geblockt=n.gegner.human>=0&&geheimAktiv(n.gegner);
  c.beob={saison:S.saison, termin:S.termin, gegner:n.gegner.id, geblockt, plan:geblockt?null:gegnerPlan(c,n.gegner)};
  return null;
}
function geheimtraining(c){
  const n=naechstesSpiel(c); if(!n||n.gegner.human<0) return 'Geheimtraining lohnt sich nur gegen ein Familienmitglied.';
  if(geheimAktiv(c)) return 'Das Training ist schon abgeschirmt.';
  const k=geheimKosten(c); if(c.konto<k) return 'Zu wenig Geld.';

// Bonus für die Seite, die beobachtet hat und passend kontert. Gilt ab Anpfiff, spätere Umstellungen ändern ihn nicht.
function konterBonus(m,H,A){
  m.konter=[[],[]];
  [[H,A,0],[A,H,1]].forEach(([c,g,i])=>{
    if(c.human<0) return; const b=beobAktuell(c,g); if(!b||b.geblockt) return;
    const geg={formation:i?m.fh:m.fa, ausrichtung:i?m.ah:m.aa}, ich={formation:i?m.fa:m.fh, ausrichtung:i?m.aa:m.ah}, k=konterFuer(geg), X=W.beobachtung;
    let f=0;
    if(k.ausrichtung===ich.ausrichtung){ f+=X.ausrBonus; m.konter[i].push(`${ich.ausrichtung} gegen ${geg.ausrichtung}`); }
    if(k.formation&&k.formation===ich.formation){ f+=X.formBonus; m.konter[i].push(`${ich.formation} gegen ${geg.formation}`); }
    if(!f) return;
    m.bonus[i]+=Math.round(elfStaerke(c)*f*10)/10;
    m.ev.push({min:0,s:i,typ:'konter',txt:`Die Gegnerbeobachtung zahlt sich aus: ${c.kurz} kontert (${m.konter[i].join(', ')}).`});

}

// ---------- Spielerscout ----------
const scoutStufe = c => (c.scout&&c.scout.stufe)||0;
const scoutVon = c => W.scout.stufen[scoutStufe(c)];
const scoutGeld = (c,x) => Math.round((x||0)*ertragsFaktor(c)/10)*10;
function scoutHolen(c,stufe){
  const T=W.scout.stufen[stufe]; if(!T) return 'Unbekannter Scout.';
  if(!programmeBuchbar()) return 'Scouts wechseln nur in der Sommer- oder Winterpause.';

  if(k>0&&c.konto<k) return 'Zu wenig Geld für das Handgeld.';
  if(k>0){ c.konto-=k; buchen(c,'Handgeld '+T.name,-k); }

// Tipps eines Transferfensters. Erzeugt mit festem Startwert aus Saison, Fenster, Verein und Scout,
// damit Neuladen keine neuen Tipps auswürfelt.
function scoutTipps(c){
  const st=scoutStufe(c); if(!st||!fensterOffen()) return null;
  const key=S.saison+'-'+(S.termin===0?'s':'w')+'-'+st;
  if(c.scoutTipps&&c.scoutTipps.key===key) return c.scoutTipps;
  const X=W.scout.stufen[st], D=L(c), alt=RNG, liste=[];
  RNG=seedRng(((S.saison*92821)^(S.termin*6151)^(c.id*48271)^(st*7))>>>0);
  try{
    const lo=D.kader-12, hi=D.kader-2, pool=[];
    const passt=p=>p.alter>=18&&p.alter<=21&&p.staerke>=lo&&p.staerke<=hi&&!p.verletzt;
    for(const k of S.clubs){ if(k.id===c.id||k.human>=0||!darfKaufen(c,niv(k))) continue; for(const p of k.kader) if(passt(p)) pool.push(p.id); }
    for(const p of S.frei) if(darfKaufen(c,p.nivVon)&&passt(p)) pool.push(p.id);
    pool.sort((a,b)=>a-b);
    for(const pid of shuffle(pool).slice(0,X.tipps)){
      const p=besitzer(pid).p, anz=Math.min(99,Math.max(p.staerke+5,D.kader+X.pot+ri(-2,3)));
      liste.push({art:'roh', pid, anz, pot:clamp(anz+ri(X.fehler[0],X.fehler[1]),p.staerke+1,99)});
    }
    for(let i=0;i<X.jugend;i++) liste.push({art:'jugend', talent:neuesTalent(c,st-1)});
  } finally { RNG=alt; }
  c.scoutTipps={key, liste};
  return c.scoutTipps;
}
function scoutPreis(c,t){
  const r=1-scoutVon(c).rabatt;
  if(t.art==='jugend') return Math.round(scoutGeld(c,W.scout.jugendPreis)*r/10)*10;
  const b=besitzer(t.pid); return b?Math.round(kaufpreis(c,b)*r/10)*10:0;
}
function scoutKaufen(c,i){
  const T=scoutTipps(c), t=T&&T.liste[i];
  if(!t) return 'Transferfenster geschlossen oder kein Scout.';
  if(t.erledigt) return 'Schon erledigt.';
  if(c.konto<0) return 'Konto im Minus: Transfers gesperrt.';
  const preis=scoutPreis(c,t);
  if(t.art==='jugend'){
    if(jugendBelegt(c)>=jugendPlaetze(c)) return 'Kein Platz mehr in der Jugend.';
    if(c.konto<preis) return 'Zu wenig Geld.';
    c.konto-=preis; buchen(c,'Ablöse Talent '+t.talent.name,-preis);
    c.jugend.push(t.talent); t.erledigt=true; return null;
  }
  const b=besitzer(t.pid);
  if(!b||b.c===c||(b.c&&b.c.human>=0)){ t.erledigt=true; return 'Der Spieler ist nicht mehr zu haben.'; }
  if(c.kader.length>=W.kaderMax) return `Kader voll (${W.kaderMax}).`;
  if(c.konto<preis) return 'Zu wenig Geld.';
  c.konto-=preis; buchen(c,'Ablöse '+b.p.name+' (Scout)',-preis);
  if(b.c){ b.c.kader=b.c.kader.filter(x=>x.id!==t.pid); auffuellen(b.c); } else S.frei=S.frei.filter(x=>x.id!==t.pid);
  b.p.tore=0; b.p.serie=0; delete b.p.nivVon; delete b.p.ligaVon; delete b.p.landVon; frischImVerein(b.p);
  b.p.potenzial=t.pot; b.p.potAnz=t.anz; c.kader.push(b.p); t.erledigt=true;
  return null;
}
function rohdiamantenWachsen(c){
  const X=W.scout, besser=[];
  for(const p of c.kader) if(p.potenzial&&p.staerke<p.potenzial&&p.alter<=X.wachstumBisAlter&&rnd()<X.wachstum){ p.staerke++; besser.push(p.name); }
  return besser;

// ---------- Match-Engine ----------
function neuesSpiel(hId,aId,info={}){
  const H=S.clubs[hId], A=S.clubs[aId];
  for(const c of [H,A]){ if(c.human<0){ const p=computerPlan(c,c===H?A:H); c.aufstellung=autoAufstellung(c,p.formation); c.ausrichtung=p.ausrichtung; } else pruefeAufstellung(c); }
  const m={ h:hId, a:aId, liga:info.liga??null, wb:info.wb||null, art:info.art||'liga', runde:info.runde||0, label:info.label||'', ko:!!info.ko, neutral:!!info.neutral, final:!!info.final,
    th:0, ta:0, min:0, col:2, colAlt:2, bes:0, by:50, danger:0, ev:[], strafen:[], bonus:[0,0], elfer:null, ie:null, sieger:null,
    lh:[...H.aufstellung.ids], la:[...A.aufstellung.ids], sh:[...H.aufstellung.ids], sa:[...A.aufstellung.ids], fh:H.aufstellung.formation, fa:A.aufstellung.formation,
    ah:H.ausrichtung, aa:A.ausrichtung, ecken:[0,0], gelb:[0,0], rot:[0,0], wechsel:[0,0], live:H.human>=0||A.human>=0 };
  [H,A].forEach((c,i)=>{ if(c.human>=0) m.bonus[i]+=anlageWert(c,'video'); });
  if(info.wunder){ const sh=elfStaerke(H), sa=elfStaerke(A); if(Math.abs(sh-sa)>W.pokal.wunderAb){ m.bonus[sh<sa?0:1]=W.pokal.wunderBonus; m.wunder=true; } }
  konterBonus(m,H,A);
  werteAktualisieren(m); return m;
}
function werteAktualisieren(m){ m.wH=teamWerte(S.clubs[m.h],m.lh,m.fh,m.ah,m.bonus[0]); m.wA=teamWerte(S.clubs[m.a],m.la,m.fa,m.aa,m.bonus[1]); }
function spielerVon(m,s){ const c=S.clubs[s?m.a:m.h], map=new Map(c.kader.map(p=>[p.id,p])), ids=s?m.la:m.lh, f=s?m.fa:m.fh, sl=slots(f); return ids.map((id,i)=>({p:map.get(id),pos:sl[i]})).filter(x=>x.p); }
function torschuetze(m,s){
  const l=spielerVon(m,s), g=l.map(x=>({ST:6,MF:3,AB:1,TW:0})[x.pos]+0.01), r=rnd()*summe(g);
  let acc=0; for(let i=0;i<l.length;i++){ acc+=g[i]; if(r<=acc) return l[i].p; } return l[0]&&l[0].p;
}
function ereignis(m,s,typ,txt){ m.ev.push({min:m.min,s,typ,txt}); }
function chance(m,s,att,def,nachEcke){
  const E=W.engine, kz=S.clubs[s?m.a:m.h].kurz;
  if(rnd()<E.tor*att.ang/(att.ang+def.tor)*(nachEcke?0.7:1)){
    if(s) m.ta++; else m.th++;
    const p=torschuetze(m,s); if(p){ p.tore++; p._tor=true; }
    ereignis(m,s,'tor',`TOR für ${kz}! ${p?p.name:'Jemand'} ${pick(['trifft','schiebt ein','köpft ein','hämmert ihn rein','trifft per Abstauber'])}.`);
    m.col=2; m.danger=0; return;
  }
  ereignis(m,s,'chance',pick([`Chance für ${kz}, knapp vorbei!`,`${kz} scheitert am Torwart.`,`Pfosten! ${kz} hat Pech.`]));
  if(!nachEcke && rnd()<E.eckeNachChance){ eckball(m,s,att,def); return; }
  m.col = s?1:3;
}
function eckball(m,s,att,def){
  m.ecken[s]++; ereignis(m,s,'ecke',`Ecke für ${S.clubs[s?m.a:m.h].kurz}.`);
  if(rnd()<W.engine.eckeChance) chance(m,s,att,def,true);
}
function elfmeter(m){
  const X=W.elfer, t=[0,0], n=[0,0], seq=[], wert=[m.wH,m.wA];
  const quote=s=>clamp(X.basis+X.spanne*(wert[s].ang-wert[1-s].tor)/Math.max(30,wert[s].ang+wert[1-s].tor),0.55,0.92);
  const entschieden=()=>{ const r0=Math.max(0,5-n[0]), r1=Math.max(0,5-n[1]); return t[0]+r0<t[1] || t[1]+r1<t[0]; };
  for(let i=0;i<5&&!entschieden();i++) for(const s of [0,1]){ if(entschieden()) break; const tor=rnd()<quote(s); n[s]++; if(tor) t[s]++; seq.push({s,tor}); }
  while(t[0]===t[1]){ for(const s of [0,1]){ const tor=rnd()<quote(s); n[s]++; if(tor) t[s]++; seq.push({s,tor}); } }
  m.elfer=seq; m.ie=t; m.sieger= t[0]>t[1]?m.h:m.a;
  ereignis(m,t[0]>t[1]?0:1,'elfer',`${W.worte.elfmeter}: ${S.clubs[m.h].kurz} ${t[0]}:${t[1]} ${S.clubs[m.a].kurz}. ${S.clubs[m.sieger].kurz} ist weiter!`);
}
function schritt(m){
  if(W.sport==='handball') return schrittHandball(m);
  if(m.min>=90) return;
  m.min++;
  const E=W.engine, H=m.wH, A=m.wA;
  const s = rnd() < H.mf/(H.mf+A.mf)+(m.neutral?0:W.heimvorteil) ? 0 : 1;
  const att=s?A:H, def=s?H:A, dir=s?-1:1, alt=m.col;
  m.col=clamp(m.col+(rnd()<att.ang/(att.ang+def.abw)?dir:-dir),0,4);
  m.colAlt=alt; m.bes=s; m.by=clamp(Math.round((m.by??50)+gauss()*16),12,88);
  const dist=s?m.col:4-m.col;
  m.danger=[3,2,1,0,0][dist];
  if(dist===0 && rnd()<E.chance) chance(m,s,att,def,false);
  else if(dist<=1){ const defAusr=s?m.ah:m.aa; if(rnd()<E.eckeZufall*(defAusr==='defensiv'?E.eckeDefensiv:1)) eckball(m,s,att,def); }
  for(const t of [0,1]){
    const kz=S.clubs[t?m.a:m.h].kurz;
    const platzverweis=(x,txt,n)=>{ m.rot[t]++; ereignis(m,t,'rot',txt); const ids=t?m.la:m.lh; ids[ids.indexOf(x.p.id)]=null; m.strafen.push({pid:x.p.id,art:'gesperrt',n}); werteAktualisieren(m); };
    if(rnd()<E.gelb){ const x=pick(spielerVon(m,t).filter(y=>y.pos!=='TW')); if(x){ m.gelb[t]++; m.verwarnt=m.verwarnt||{};
      if(m.verwarnt[x.p.id]) platzverweis(x,`Gelb-Rot für ${x.p.name}! ${kz} nur noch zu zehnt.`,1);
      else { m.verwarnt[x.p.id]=1; ereignis(m,t,'gelb',`Gelb für ${x.p.name} (${kz}).`); } } }
    if(rnd()<E.rot){ const x=pick(spielerVon(m,t).filter(x=>x.pos!=='TW')); if(x) platzverweis(x,`Rot für ${x.p.name}! ${kz} nur noch zu zehnt.`,ri(1,2)); }
    const cl=S.clubs[t?m.a:m.h], athletik=cl.programme&&cl.programme.athletik, kraft=cl.human>=0?anlageWert(cl,'kraftraum'):0;
    if(rnd()<E.verletzung*(athletik?0.7:1)*(1-kraft)){ const x=pick(spielerVon(m,t)); if(x){ m.strafen.push({pid:x.p.id,art:'verletzt',n:ri(1,4)}); ereignis(m,t,'verletzt',`${x.p.name} (${kz}) verletzt sich.`); } }
  }
  if(m.min===45) ereignis(m,0,'pfiff','Halbzeit.');
  if(m.min===90){
    ereignis(m,0,'pfiff',`Abpfiff: ${S.clubs[m.h].kurz} ${m.th}:${m.ta} ${S.clubs[m.a].kurz}`);

function spieleKomplett(m){ while(m.min<SPIELMIN()) schritt(m); }
// Handball: 60 Minuten, pro Minute und Team höchstens ein Angriff. Einzelne Tore werden nicht als Ereignis geführt (ca. 55 pro Spiel),
// nur Läufe, Zeitstrafen, Disqualifikationen, Verletzungen und der Halbzeitstand.
function hbTorschuetze(m,s){
  const l=spielerVon(m,s), g=l.map(x=>({MF:5,ST:3,AB:2.5,TW:0.02})[x.pos]), r=rnd()*summe(g);
  let acc=0; for(let i=0;i<l.length;i++){ acc+=g[i]; if(r<=acc) return l[i].p; } return l[0]&&l[0].p;
}
function hbUnterzahl(m,t){ return (m.zeitstrafen||[[],[]])[t].filter(bis=>bis>=m.min).length; }
function hbAngriff(m,s){
  const E=W.engine, att=s?m.wA:m.wH, def=s?m.wH:m.wA, kz=S.clubs[s?m.a:m.h].kurz;
  if(!m.form) m.form=[1+gauss()*E.form,1+gauss()*E.form];
  const d=0.75*def.abw+0.25*def.tor, q=Math.pow(att.ang*m.form[s],E.k)/(Math.pow(att.ang,E.k)+Math.pow(Math.max(1,d),E.k));
  const heim=m.neutral?0:(s?-E.heim:E.heim), zahl=(hbUnterzahl(m,1-s)-hbUnterzahl(m,s))*E.unterzahl;
  if(rnd()>=clamp(2*E.tor*q+heim+zahl,0.2,0.85)) return;
  if(s) m.ta++; else m.th++;
  const p=hbTorschuetze(m,s); if(p){ p.tore++; p._tor=true; }
  if(m.lauf&&m.lauf[0]===s) m.lauf[1]++; else m.lauf=[s,1];
  if(m.lauf[1]===E.laufAb) ereignis(m,s,'lauf',`${E.laufAb}:0-Lauf für ${kz}! Stand ${m.th}:${m.ta}.`);
}
function hbStrafe(m,t){
  const kz=S.clubs[t?m.a:m.h].kurz, x=pick(spielerVon(m,t).filter(y=>y.pos!=='TW')); if(!x) return;
  m.zeitstrafen=m.zeitstrafen||[[],[]]; m.zweiMin=m.zweiMin||{};
  const n=m.zweiMin[x.p.id]=(m.zweiMin[x.p.id]||0)+1;
  m.zeitstrafen[t].push(m.min+2); m.gelb[t]++;
  if(n<3){ ereignis(m,t,'zeit',`2 Minuten für ${x.p.name} (${kz}).`); return; }
  m.rot[t]++; m.strafen.push({pid:x.p.id,art:'gesperrt',n:1});
  const c=S.clubs[t?m.a:m.h], ids=t?m.la:m.lh, i=ids.indexOf(x.p.id), sl=slots(t?m.fa:m.fh);
  const ersatz=besterFuer(c,sl[i],new Set([...ids.filter(Boolean),...m.strafen.filter(y=>y.art==='gesperrt').map(y=>y.pid)]));
  ids[i]=ersatz&&ersatz.id!==x.p.id?ersatz.id:null;
  ereignis(m,t,'rot',`Dritte Zeitstrafe: Disqualifikation für ${x.p.name} (${kz}).${ids[i]?` ${ersatz.name} kommt.`:''}`);

}
function schrittHandball(m){
  const E=W.engine, ende=W.spielMinuten;
  if(m.min>=ende) return;
  m.min++;
  const tempo=[m.wH.mf,m.wA.mf].map((x,i,a)=>E.angriff*clamp(1+E.tempo*(x-a[1-i])/Math.max(1,(x+a[1-i])/2)*4,0.85,1.1));
  for(const s of rnd()<0.5?[0,1]:[1,0]) if(rnd()<tempo[s]) hbAngriff(m,s);
  for(const t of [0,1]){
    if(rnd()<E.zeitstrafe) hbStrafe(m,t);
    const kz=S.clubs[t?m.a:m.h].kurz, cl=S.clubs[t?m.a:m.h], athletik=cl.programme&&cl.programme.athletik, kraft=cl.human>=0?anlageWert(cl,'kraftraum'):0;
    if(rnd()<E.verletzung*(athletik?0.7:1)*(1-kraft)){ const x=pick(spielerVon(m,t)); if(x){ m.strafen.push({pid:x.p.id,art:'verletzt',n:ri(1,4)}); ereignis(m,t,'verletzt',`${x.p.name} (${kz}) verletzt sich.`); } }
  }
  const H=S.clubs[m.h].kurz, A=S.clubs[m.a].kurz;
  if(m.min===ende/2) ereignis(m,0,'stand',`Halbzeit: ${H} ${m.th}:${m.ta} ${A}.`);
  else if(m.min%10===0&&m.min<ende) ereignis(m,0,'stand',`${m.min}. Minute: ${H} ${m.th}:${m.ta} ${A}.`);
  if(m.min===ende){
    ereignis(m,0,'pfiff',`Abpfiff: ${H} ${m.th}:${m.ta} ${A}`);
    if(m.ko){ if(m.th===m.ta) elfmeter(m); else m.sieger = m.th>m.ta?m.h:m.a; }
  }
}
// Vereinfachtes Ergebnis für Jugendspiele (d = Stärkeunterschied aus Sicht von Team 1)
function einfachErgebnis(d,faktor=1,max=5){
  if(W.sport==='handball'){ const b=W.engine.einfachTore; return [Math.max(8,Math.round(b+d*0.6+gauss()*3.5)), Math.max(8,Math.round(b-d*0.6+gauss()*3.5))]; }
  return [poisson(clamp(1.3*faktor*Math.exp(d/16),0.2,max)), poisson(clamp(1.3*faktor*Math.exp(-d/16),0.2,max))];

// Gleiche Reihenfolge wie die Live-Konferenz: erst alle Spiele ohne Menschen komplett, dann Minute für Minute die Live-Spiele.
function terminWieLive(spiele,abMinute=0){
  for(const m of spiele) if(!m.live&&m.min<SPIELMIN()) spieleKomplett(m);
  const live=spiele.filter(m=>m.live);
  for(let min=abMinute;min<SPIELMIN();min++) for(const m of live) schritt(m);
}
// Ein Live-Spiel wurde durch Neuladen unterbrochen: mit demselben Startwert ohne Eingriffe zu Ende rechnen.
function laufendNachholen(){
  const X=S.laufend; if(!X) return false;
  delete S.laufend;
  if(X.saison!==S.saison||X.termin!==S.termin||S.phase!=='planung') return false;
  zufallsQuelle(X.seed);
  try{ const sp=terminVorbereiten(); terminWieLive(sp); terminAbschliessen(sp); }
  finally{ zufallsQuelle(null); }
  return true;
}
function ergebnisText(m){ return `${m.th}:${m.ta}`+(m.ie?` (${W.worte.ie} ${m.ie[0]}:${m.ie[1]})`:''); }

// ---------- Tabellen ----------
const leereZeile = () => ({sp:0,s:0,u:0,n:0,tg:0,tgg:0,pkt:0});
function leereTabelle(){ S.tab={}; spielLigen().forEach(i=>{ for(const id of S.ligen[i]) S.tab[id]=leereZeile(); }); }
const sortTab = (a,b)=>b.pkt-a.pkt||(b.tg-b.tgg)-(a.tg-a.tgg)||b.tg-a.tg||a.id-b.id;
function tabelle(ligaIdx){ return S.ligen[ligaIdx].map(id=>({id,...(S.tab[id]||leereZeile())})).sort(sortTab); }
function platzVon(c){ if(L(c).keineLiga) return 0; return tabelle(c.liga).findIndex(r=>r.id===c.id)+1; }
function eintragenIn(tab,m){
  const h=tab[m.h]||(tab[m.h]=leereZeile()), a=tab[m.a]||(tab[m.a]=leereZeile());
  h.sp++; a.sp++; h.tg+=m.th; h.tgg+=m.ta; a.tg+=m.ta; a.tgg+=m.th;
  if(m.th>m.ta){ h.s++; a.n++; h.pkt+=W.siegPunkte; } else if(m.th<m.ta){ a.s++; h.n++; a.pkt+=W.siegPunkte; } else { h.u++; a.u++; h.pkt++; a.pkt++; }
}

// ---------- Kalender ----------
function kalenderBauen(format){
  const K=W.kalender, T=[];
  if(format!=='liga') T.push({art:'super'});
  for(let nr=1;nr<=K.ligaTermine;nr++){

function terminLabel(t){

const euroRundenName = r => r<=W.euro.ligaphase ? `Ligaphase ${r}` : W.euro.koNamen[r-W.euro.ligaphase-1];
const aktTermin = () => S.kalender[S.termin];

// ---------- Pokale ----------
function seedWert(id){ const c=S.clubs[id]; return niv(c)*100 - c.basis; }
function heimregel(a,b){ const A=S.clubs[a], B=S.clubs[b]; if(niv(A)!==niv(B)) return niv(A)>niv(B)?[a,b]:[b,a]; return [a,b]; }
function koAuslosung(teams,freilosZufall){
  let ziel=1; while(ziel<teams.length) ziel*=2;
  const byes=ziel-teams.length, liste=[...teams];
  let frei=[];
  if(byes>0){ if(freilosZufall) shuffle(liste); else liste.sort((a,b)=>seedWert(a)-seedWert(b)); frei=liste.splice(0,byes); }
  shuffle(liste);
  const paare=[]; for(let i=0;i+1<liste.length;i+=2) paare.push(heimregel(liste[i],liste[i+1]));
  return {paare,frei};
}
function vorjahrOrdnung(ligaIdx){
  const jetzt=S.ligen[ligaIdx];
  if(!S.vorjahr) return [...jetzt];
  const alt=S.vorjahr.tab[ligaIdx]||[], pos=new Map(alt.map((id,i)=>[id,i]));
  return [...jetzt].sort((a,b)=>(pos.has(a)?pos.get(a):99)-(pos.has(b)?pos.get(b):99));
}
function pokaleInit(){
  S.pokale={};
  if(S.format==='liga') return;
  const vp=[]; W.ligen.forEach((D,i)=>{ if(D.land==='DE'&&D.niveau>=4) vp.push(...S.ligen[i]); });
  S.pokale.vp={ name:'Verbandspokal', land:'DE', alive:vp, runden:[], sieger:null };
  for(const land of LAENDER) S.pokale[land]={ name:W.laender[land].pokal, land, alive:[], runden:[], sieger:null };
}
function pokalTeilnehmer(key){
  const land=key, t=[];
  W.ligen.forEach((D,i)=>{ if(D.land===land && D.niveau<=2) t.push(...S.ligen[i]); });
  if(land==='DE'){ t.push(...vorjahrOrdnung(LIGA_IDX.de3).slice(0,W.pokal.de3Plaetze)); t.push(...S.pokale.vp.alive); }
  else { const zweite=W.ligen.findIndex(D=>D.land===land&&D.niveau===W.ligen[topLiga(land)].niveau+1); if(zweite>=0 && W.ligen[zweite].niveau>2) t.push(...S.ligen[zweite]); }
  return [...new Set(t)];
}
function pokalRunde(key,runde){
  const P=S.pokale[key]; if(!P) return null;
  if(P.runden[runde-1]) return P.runden[runde-1];
  if(runde===1 && key!=='vp') P.alive=pokalTeilnehmer(key);
  if(P.alive.length<2) return null;
  const {paare,frei}=koAuslosung(P.alive,key==='vp');
  const final=key!=='vp' && runde===W.pokal.rundenNamen.length;
  const name= key==='vp' ? `${runde}. Runde` : W.pokal.rundenNamen[runde-1];
  P.runden[runde-1]={ name, paare, frei, erg:[], final };
  return P.runden[runde-1];
}

// ---------- Europapokale ----------
function euroInit(){
  S.euro=null;
  if(S.format!=='komplett') return;
  const zu={cl:[],el:[],ecl:[]}, used=new Set();
  for(const land of LAENDER){
    const Q=W.laender[land].euro, ord=vorjahrOrdnung(topLiga(land)).filter(id=>!used.has(id));
    const sieger=S.vorjahr&&S.vorjahr.pokalsieger?S.vorjahr.pokalsieger[land]:null;
    const nimm=wb=>{ const id=ord.find(x=>!used.has(x)); if(id!=null){ used.add(id); zu[wb].push(id); } };
    for(const wb of EURO) for(const slot of Q[wb]){
      if(slot==='P'){ if(sieger!=null&&!used.has(sieger)){ used.add(sieger); zu[wb].push(sieger); } else nimm(wb); }
      else { const id=ord[slot-1]; if(id!=null&&!used.has(id)){ used.add(id); zu[wb].push(id); } else nimm(wb); }
    }
  }
  const pool=[...S.ligen[LIGA_IDX.eu]].sort((a,b)=>staerke(S.clubs[b])-staerke(S.clubs[a]));
  for(const wb of EURO) while(zu[wb].length<W.euro.teilnehmer && pool.length) zu[wb].push(pool.shift());
  S.euro={};
  for(const wb of EURO){
    const teams=shuffle([...zu[wb]]), rr=rrRunden(teams.length), wahl=shuffle([...rr.keys()]).slice(0,W.euro.ligaphase), heim={};
    const plan=wahl.map(r=>rr[r].map(([i,j])=>{ let a=teams[i], b=teams[j]; if((heim[a]||0)>(heim[b]||0)) [a,b]=[b,a]; else if((heim[a]||0)===(heim[b]||0)&&rnd()<0.5) [a,b]=[b,a]; heim[a]=(heim[a]||0)+1; return [a,b]; }));
    const tab={}; teams.forEach(id=>tab[id]=leereZeile());
    S.euro[wb]={ name:W.euro[wb].name, teams, plan, tab, ko:[], erg:[], sieger:null };
  }
}
function euroTabelle(wb){ const E=S.euro[wb]; return Object.keys(E.tab).map(id=>({id:+id,...E.tab[id]})).sort(sortTab); }
function euroKoBauen(wb,rundeNr){
  const E=S.euro[wb], LP=W.euro.ligaphase;
  if(rundeNr===LP+1){
    const t=euroTabelle(wb).map(r=>r.id); E.top8=t.slice(0,8);
    const p=[]; for(let j=0;j<8;j++) p.push([t[8+j],t[23-j]]);
    E.ko[0]={name:'Playoff',paare:p,erg:[]};
  } else if(rundeNr===LP+2){
    const sieger=E.ko[0].erg.map(e=>e.sieger);
    E.ko[1]={name:'Achtelfinale',paare:E.top8.map((id,i)=>[id,sieger[7-i]]),erg:[]};
  } else {
    const k=rundeNr-LP-1, alt=shuffle(E.ko[k-1].erg.map(e=>e.sieger)), p=[];
    for(let i=0;i+1<alt.length;i+=2) p.push([alt[i],alt[i+1]]);
    E.ko[k]={name:W.euro.koNamen[k],paare:p,erg:[],final:k===W.euro.koNamen.length-1};
  }
}

// ---------- Paarungen eines Termins ----------
function paarungenTermin(){
  const t=aktTermin(), out=[];
  if(!t) return out;
  if(t.art==='liga'){
    for(const i of spielLigen()){ const D=W.ligen[i], r=ligaRunde(D,t.nr); if(!r) continue; const L_=S.ligen[i];
      for(const [a,b] of spielplan(D.vereine)[r-1]) out.push({h:L_[a],a:L_[b],info:{art:'liga',liga:i,label:D.name}}); }
  } else if(t.art==='pokal'){
    const keys= t.wb==='vp'?['vp']:LAENDER;
    for(const key of keys){ const R=pokalRunde(key,t.runde); if(!R) continue; const P=S.pokale[key];
      for(const [a,b] of R.paare) out.push({h:a,a:b,info:{art:'pokal',wb:key,runde:t.runde,label:`${P.name} · ${R.name}`,ko:true,wunder:true,neutral:R.final,final:R.final}}); }
  } else if(t.art==='euro'){
    if(!S.euro) return out;
    for(const wb of EURO){ const E=S.euro[wb], LP=W.euro.ligaphase;
      if(t.runde<=LP){ for(const [a,b] of E.plan[t.runde-1]) out.push({h:a,a:b,info:{art:'euro',wb,runde:t.runde,label:`${E.name} · Ligaphase ${t.runde}`}}); }
      else { const K=E.ko[t.runde-LP-1]; if(!K) continue; for(const [a,b] of K.paare) out.push({h:a,a:b,info:{art:'euro',wb,runde:t.runde,label:`${E.name} · ${K.name}`,ko:true,neutral:!!K.final,final:!!K.final}}); }
    }
  } else if(t.art==='super'){
    const de1=LIGA_IDX.de1;
    let meister, pokal;
    if(S.vorjahr){ meister=S.vorjahr.tab[de1][0]; pokal=S.vorjahr.pokalsieger.DE; if(pokal==null||pokal===meister) pokal=S.vorjahr.tab[de1][1]; }
    else { meister=S.ligen[de1][0]; pokal=S.ligen[de1][1]; }
    out.push({h:meister,a:pokal,info:{art:'super',wb:'dfl',label:W.worte.supercup,ko:true}});
    if(S.format==='komplett'&&S.vorjahr&&S.vorjahr.euroSieger){ const {cl,el}=S.vorjahr.euroSieger; if(cl!=null&&el!=null&&cl!==el) out.push({h:cl,a:el,info:{art:'super',wb:'uefa',label:'UEFA-Supercup',ko:true,neutral:true}}); }
  }
  return out;
}
function naechstesSpiel(c){ const p=paarungenTermin().find(x=>x.h===c.id||x.a===c.id); if(!p) return null; const heim=p.h===c.id; return {...p, heim, gegner:S.clubs[heim?p.a:p.h]}; }
function terminVorbereiten(){
  if(S.termin===0) abgaengeJugend();
  coAufstellungen();
  return paarungenTermin().map(p=>neuesSpiel(p.h,p.a,p.info));
}

// ---------- Stadion ----------

function leihAngebote(c,tl){

  a.betrag=Math.round(a.betrag*(1+W.sponsor.mehrFordern)/10)*10; return `${a.name} legt nach: ${eur(a.betrag)}.`;
}
function sponsorSumme(c){ const s=c.sponsoren; return (s.trikot?s.trikot.betrag:0)+(s.aermel?s.aermel.betrag:0)+(s.name?s.name.betrag:0)+summe(s.banden.map(b=>b.betrag)); }

// ---------- Merch ----------
function artikelVerfuegbar(c,a){
  if(a==='trikot') return !!c.sponsoren.trikot;
  if(a==='spielertrikot') return (c.merch.stand==='fanshop'||c.merch.stand==='megastore') && c.kader.some(p=>p.staerke>=W.merch.spielertrikotAb);
  if(a==='sonder') return c.merch.sonderRest>0;
  return true;
}
const lagerBestand = (c,a) => summe(c.merch.lager[a].map(b=>b.n));
function bestellen(c,a,paket){
  const [n,f]=W.merch.pakete[paket], kosten=Math.round(n*W.merch.artikel[a].ek*f);
  if(!artikelVerfuegbar(c,a)) return 'Artikel noch nicht freigeschaltet.';
  if(c.konto<kosten) return 'Zu wenig Geld.';
  c.konto-=kosten; buchen(c,`Wareneinkauf ${W.merch.artikel[a].name}`,-kosten);
  c.merch.lager[a].push({n,alter:0}); return null;
}
function merchVerkauf(c,kunden){
  let umsatz=0, stueck=0;
  const arts=Object.keys(W.merch.artikel).filter(a=>artikelVerfuegbar(c,a)&&lagerBestand(c,a)>0);
  if(!arts.length) return {umsatz,stueck};
  // Anteil je Artikel aus den Grundgewichten (ohne Preis), danach wirkt der Preis nur auf die eigene Nachfrage.
  // So senkt ein höherer Preis den Absatz immer, egal wie viele Artikel im Sortiment sind.
  const gewichtSumme=Math.max(1,summe(arts.map(a=>W.merch.artikel[a].gewicht)));
  arts.forEach(a=>{
    const A=W.merch.artikel[a], pf=clamp(1-0.8*(c.merch.preis[a]/A.vk-1),0.05,1.5);
    let will=Math.round(kunden*A.gewicht/gewichtSumme*pf);
    for(const b of c.merch.lager[a]){ if(will<=0) break; const x=Math.min(b.n,will); b.n-=x; will-=x; stueck+=x; umsatz+=x*c.merch.preis[a]; }
    c.merch.lager[a]=c.merch.lager[a].filter(b=>b.n>0);
  });
  return {umsatz,stueck};
}
function sonderedition(c){ c.merch.sonderRest=W.merch.sonderDauer; c.merch.lager.sonder.push({n:W.merch.sonderMenge,alter:0}); }

// ---------- Neues Spiel ----------
function neuesSpielAnlegen(setup,welt,format='komplett'){
  const w=welt||neueWelt();
  S={ version:2, saison:1, termin:0, nextId:w.nextId, clubs:w.clubs, ligen:w.ligen, tab:{}, manager:[], aktiv:0, phase:'planung', letzte:null, frei:[],
      mitspielerAngebote:[], wechselZaehler:{}, format, vorjahr:null, saisonInfo:[], euroSieger:{}, sport:W.sport };
  const gewaehlt=new Set(setup.filter(m=>!m.gruenden).map(m=>m.verein));
  setup.forEach((m,mi)=>{
    let c;
    if(m.gruenden){
      const frei=S.ligen[m.liga].filter(id=>S.clubs[id].human<0&&!gewaehlt.has(id));
      c=S.clubs[pick(frei)]; gewaehlt.add(c.id);
      c.name=m.vereinsname||'Neuer Verein'; c.kurz=(m.kurz||kuerzel(c.name)).toUpperCase().slice(0,3);
      c.farbe=farbeOk(m.farbe)?m.farbe:c.farbe; c.farbe2=farbeOk(m.farbe2)?m.farbe2:c.farbe2; c.wappen=m.wappen||c.wappen; c.land=L(c).land;
    } else {
      c=S.clubs[m.verein];
      if(m.vereinsname){ c.name=m.vereinsname; c.kurz=kuerzel(c.name); }
    }
    menschlichMachen(c,mi,m.handicap,!!m.gruenden);
    S.manager.push({ name:m.name||('Manager '+(mi+1)), club:c.id, handicap:m.handicap, auto:{...W.handicap[m.handicap].auto}, amt:neuesAmt(c), bereit:false, farbe:m.mfarbe||null, foto:m.foto||null });
  });
  saisonStarten();
  for(let i=0;i<S.manager.length;i++) if(S.manager[i].auto.training) autoTraining(mc(i));
  return S;
}
function saisonStarten(){
  S.kalender=kalenderBauen(S.format);
  S.winterIdx=S.kalender.findIndex(t=>t.art==='liga'&&t.nr===W.kalender.winterNach)+1;
  S.termin=0; S.phase='planung'; S.wechselZaehler={};
  leereTabelle(); pokaleInit(); euroInit(); freieSpielerErzeugen();
  S.stellen=S.stellen||[];
  if(!S.national){ nationalInit(); nationalStellenErzeugen(); }
  for(let mi=0;mi<(S.manager||[]).length;mi++){ karriereInit(S.manager[mi],mc(mi)); amtSaisonStart(mi); }
}
function formatAendern(f){
  if(S.termin!==0) return 'Nur in der Sommerpause möglich.';
  S.format=f; S.kalender=kalenderBauen(f); S.winterIdx=S.kalender.findIndex(t=>t.art==='liga'&&t.nr===W.kalender.winterNach)+1;
  pokaleInit(); euroInit(); return null;
}
function mc(i){ return S.clubs[S.manager[i].club]; }

// ---------- Transfers ----------
function fensterOffen(){ return S.phase==='planung' && (S.termin===0 || S.termin===S.winterIdx); }
function besitzer(pid){
  for(const c of S.clubs){ const p=c.kader.find(x=>x.id===pid); if(p) return {c,p}; }
  const p=S.frei.find(x=>x.id===pid); return p?{c:null,p}:null;
}
// Ablöse beim Kauf vom Computer oder vom Markt. Spieler aus höheren Ligen verlangen mehr, weil sie dort mehr verdienen.
const efLiga = D => { const K=untersteLiga(); return Math.max(1,(D.fans*D.ticket)/(K.fans*K.ticket)); };
function kaufpreis(kaeufer,b){
  const mw=marktwert(b.p), idx=b.c?b.c.liga:b.p.ligaVon;
  if(idx==null||!W.ligen[idx]) return mw;
  const q=efLiga(W.ligen[idx])/ertragsFaktor(kaeufer);
  return q<=1 ? mw : Math.round(mw*Math.min(W.abwaertsMax,Math.pow(q,W.abwaertsAufschlag))/10)*10;
}
function darfKaufen(kaeufer,verkNiv){ return niv(kaeufer) - verkNiv <= W.ligaGrenze; }
function kaufen(c,pid){
  if(!fensterOffen()) return 'Transferfenster geschlossen.';
  if(c.konto<0) return 'Konto im Minus: Transfers gesperrt.';
  const b=besitzer(pid); if(!b) return 'Spieler nicht gefunden.';
  if(b.c&&b.c.human>=0) return 'Mitspieler: bitte Angebot machen.';
  if(!darfKaufen(c,b.c?niv(b.c):b.p.nivVon)) return 'Der Spieler wechselt nicht so weit nach unten.';
  if(c.kader.length>=W.kaderMax) return 'Kader voll (28).';
  const mw=kaufpreis(c,b); if(c.konto<mw) return 'Zu wenig Geld.';
  c.konto-=mw; buchen(c,'Ablöse '+b.p.name,-mw);
  if(b.c){ b.c.kader=b.c.kader.filter(x=>x.id!==pid); auffuellen(b.c); } else S.frei=S.frei.filter(x=>x.id!==pid);
  b.p.tore=0; b.p.serie=0; delete b.p.nivVon; delete b.p.ligaVon; delete b.p.landVon; frischImVerein(b.p); c.kader.push(b.p);
  return null;
}
function verkaufen(c,pid){
  if(!fensterOffen()) return 'Transferfenster geschlossen.';
  if(c.kader.length<=W.kaderMin) return 'Mindestens 18 Spieler nötig.';
  const p=c.kader.find(x=>x.id===pid); if(!p) return 'Spieler nicht gefunden.';
  const erl=Math.round(marktwert(p)*W.verkaufQuote);
  c.konto+=erl; buchen(c,'Verkauf '+p.name,erl);
  c.kader=c.kader.filter(x=>x.id!==pid); frischImVerein(p); p.nivVon=niv(c); p.ligaVon=c.liga; S.frei.push(p);
  pruefeAufstellung(c); return null;
}
function auffuellen(c){
  const D=L(c);
  while(c.kader.length<W.kaderMin){
    if(c.human>=0 && c.jugend && c.jugend.some(t=>!t.leihe)){ const t=c.jugend.filter(t=>!t.leihe).sort((a,b)=>b.staerke-a.staerke)[0]; hochziehen(c,t.id,true); }
    else c.kader.push(neuerSpieler(c.human>=0?D.kader-12:c.basis, pick(['AB','MF','ST','MF']), c.land||D.land, 18, c.human>=0?19:31));
  }
}
function hochziehen(c,tid,zwang){
  const t=c.jugend.find(x=>x.id===tid); if(!t) return 'Talent nicht gefunden.';
  if(t.leihe) return `${t.name} ist verliehen und kommt erst im nächsten Transferfenster zurück.`;
  if(!zwang && c.kader.length>=W.kaderMax) return 'Kader voll (28).';
  c.jugend=c.jugend.filter(x=>x.id!==tid);
  c.kader.push({ id:t.id, name:t.name, pos:t.pos, staerke:t.staerke, alter:t.alter, verletzt:0, gesperrt:0, tore:0, serie:0, laune:W.laune.start });
  return null;
}
function paarSchluessel(a,b){ return [a,b].sort().join('-')+'-'+S.saison+'-'+(S.termin===0?'s':'w'); }
function mitspielerAngebot(vonMi,pid,betrag){
  if(!fensterOffen()) return 'Transferfenster geschlossen.';
  const b=besitzer(pid); if(!b||!b.c||b.c.human<0) return 'Kein Mitspieler-Spieler.';
  const an=b.c.human, kaeufer=mc(vonMi);
  if(an===vonMi) return 'Eigener Spieler.';
  if(!darfKaufen(kaeufer,niv(b.c))) return 'Ligagrenze: Spieler wechselt nicht so weit nach unten.';
  const mw=marktwert(b.p);
  if(!(betrag>=mw*W.mitspielerMin&&betrag<=mw*W.mitspielerMax)) return `Summe muss zwischen ${eur(mw*W.mitspielerMin)} und ${eur(mw*W.mitspielerMax)} liegen.`;
  if((S.wechselZaehler[paarSchluessel(vonMi,an)]||0)>=W.mitspielerProFenster) return 'In diesem Fenster schon 2 Wechsel zwischen euch.';
  if(kaeufer.konto<betrag) return 'Zu wenig Geld.';
  S.mitspielerAngebote.push({id:S.nextId++, von:vonMi, an, pid, betrag, gegen:false, kaeufer:vonMi});
  return null;
}
function mitspielerEntscheiden(id,antwort,neuBetrag){
  const o=S.mitspielerAngebote.find(x=>x.id===id); if(!o) return 'Angebot nicht mehr gültig.';
  if(antwort==='nein'){ S.mitspielerAngebote=S.mitspielerAngebote.filter(x=>x!==o); return null; }
  const b=besitzer(o.pid); if(!b||!b.c) return 'Spieler nicht mehr da.';
  if(antwort==='gegen'){
    if(o.gegen) return 'Nur ein Gegenangebot möglich.';
    const mw=marktwert(b.p);
    if(!(neuBetrag>=mw*W.mitspielerMin&&neuBetrag<=mw*W.mitspielerMax)) return `Summe muss zwischen ${eur(mw*W.mitspielerMin)} und ${eur(mw*W.mitspielerMax)} liegen.`;
    o.betrag=Math.round(neuBetrag); o.gegen=true; [o.von,o.an]=[o.an,o.von]; return null;
  }
  const verk=b.c, kaeufer=mc(o.kaeufer);
  if(verk.human===o.kaeufer) return 'Fehler im Angebot.';
  if(kaeufer.konto<o.betrag) return 'Käufer hat zu wenig Geld.';
  if(kaeufer.kader.length>=W.kaderMax) return 'Kader des Käufers voll.';
  if(verk.kader.length<=W.kaderMin) return 'Verkäufer braucht mindestens 18 Spieler.';
  kaeufer.konto-=o.betrag; verk.konto+=o.betrag; buchen(kaeufer,'Ablöse '+b.p.name,-o.betrag); buchen(verk,'Verkauf '+b.p.name,o.betrag);
  verk.kader=verk.kader.filter(x=>x.id!==o.pid); frischImVerein(b.p); kaeufer.kader.push(b.p); b.p.tore=0; pruefeAufstellung(verk);
  const k=paarSchluessel(o.von,o.an); S.wechselZaehler[k]=(S.wechselZaehler[k]||0)+1;
  S.mitspielerAngebote=S.mitspielerAngebote.filter(x=>x!==o); return null;
}

// ---------- Nachwuchs, Bau, Kampagnen ----------
function programmeBuchbar(){ return S.phase==='planung' && (S.termin===0 || S.termin===S.winterIdx); }
function programmKosten(c,k){ return W.jugend.programme[k].kosten*L(c).lf; }
function programmBuchen(c,k){
  if(!programmeBuchbar()) return 'Buchen nur zu Saisonbeginn oder in der Winterpause.';
  if(c.programme[k]) return 'Schon gebucht.';
  const P=W.jugend.programme[k];
  if(P.abNiveau && niv(c)>P.abNiveau) return 'Erst ab Regionalliga.';
  const kosten=programmKosten(c,k); if(c.konto<kosten) return 'Zu wenig Geld.';
  c.konto-=kosten; buchen(c,'Nachwuchs: '+P.name,-kosten); c.programme[k]=true;
  if(k==='scouting') c.scouting=2; if(k==='international') c.scoutingInt=true;
  return null;
}
function autoTraining(c){ for(const k of ['torwart','technik','athletik']) if(!c.programme[k] && c.konto>programmKosten(c,k)*6) programmBuchen(c,k); }
function internatBauen(c){
  if(c.internat||c.internatBau) return 'Schon vorhanden.';
  const kosten=W.jugend.internat[0]*L(c).lf; if(c.konto<kosten) return 'Zu wenig Geld.';
  c.konto-=kosten; buchen(c,'Bau Jugendinternat',-kosten); c.internatBau=W.jugend.internat[1]; return null;
}
function standBauen(c,typ){
  const T=W.merch.staende[typ], reihe=Object.keys(W.merch.staende);
  if(reihe.indexOf(typ)<=reihe.indexOf(c.merch.stand)||c.merch.bau) return 'Nicht möglich.';
  if(T.ab && kapazitaet(c).gesamt<T.ab) return `Erst ab ${zahl(T.ab)} Plätzen.`;
  if(c.konto<T.kosten) return 'Zu wenig Geld.';
  c.konto-=T.kosten; buchen(c,'Bau '+T.name,-T.kosten); c.merch.bau={typ,rest:T.bau}; return null;
}
const kampagneKosten = (c,i) => Math.max(20,Math.round(c.fans*L(c).ticket*W.kampagnen[i].kosten));
function kampagneStarten(c,i){
  if(c.kampagne) return 'Es läuft schon eine Kampagne.';
  const K=W.kampagnen[i], kosten=kampagneKosten(c,i);
  if(c.konto<kosten) return 'Zu wenig Geld.';
  c.konto-=kosten; buchen(c,'Werbekampagne '+K.name,-kosten); c.kampagne={rest:W.kampagneDauer,bonus:K.fans,name:K.name}; return null;
}

// ---------- Spielerstimmung, Prämien, Wechselwunsch ----------
function launeSetzen(p,d){ p.laune=Math.round(clamp(laune(p)+d,0,100)*10)/10; }
const gehaltProSpiel = (c,p) => gehalt(p,c.liga)*34/rundenProSaison(L(c));
const bonusKosten = (c,p,stufe) => Math.max(1,Math.round(gehaltProSpiel(c,p)*W.laune.bonus[stufe][0]));
const bonusHalb = p => p.bonusTermin!=null && S.termin-p.bonusTermin<W.laune.bonusSperre;
const bonusAlleKosten = c => Math.max(1,Math.round(summe(c.kader.map(p=>gehaltProSpiel(c,p)))*W.laune.bonusAlle[0]));
const halteKosten = (c,p,stufe) => Math.max(1,Math.round(gehaltProSpiel(c,p)*W.laune.halte[stufe][0]));
const halteChance = (p,stufe) => clamp(W.laune.halte[stufe][1]+(laune(p)-W.laune.wechselUnter)/200,0.05,0.95);
function bonusZahlen(c,pid,stufe){
  const B=W.laune.bonus[stufe]; if(!B) return 'Unbekannte Prämie.';
  const p=c.kader.find(x=>x.id===pid); if(!p) return 'Spieler nicht gefunden.';
  if(c.konto<0) return 'Konto im Minus: keine Prämien möglich.';
  const k=bonusKosten(c,p,stufe); if(c.konto<k) return 'Zu wenig Geld.';
  const halb=bonusHalb(p);
  c.konto-=k; buchen(c,`${W.laune.bonusNamen[stufe]} ${p.name}`,-k);
  launeSetzen(p,halb?B[1]/2:B[1]); p.bonusTermin=S.termin;
  return null;
}
function bonusAlleZahlen(c){
  if(c.bonusAlleTermin===S.termin) return 'Die Mannschaft hat vor diesem Spiel schon eine Prämie bekommen.';
  if(c.konto<0) return 'Konto im Minus: keine Prämien möglich.';
  const k=bonusAlleKosten(c); if(c.konto<k) return 'Zu wenig Geld.';
  c.konto-=k; buchen(c,'Prämie für die Mannschaft',-k);
  for(const p of c.kader) launeSetzen(p,W.laune.bonusAlle[1]);
  c.bonusAlleTermin=S.termin; return null;
}
function verhandeln(c,pid,stufe){
  const H=W.laune.halte[stufe]; if(!H) return {fehler:'Unbekanntes Angebot.'};
  const p=c.kader.find(x=>x.id===pid); if(!p) return {fehler:'Spieler nicht gefunden.'};
  if(!p.wechsel) return {fehler:`${p.name} will gar nicht weg.`};
  if(p.verhTermin===S.termin) return {fehler:`${p.name} will erst nach dem nächsten Spiel wieder reden.`};
  const k=halteKosten(c,p,stufe); if(c.konto<k) return {fehler:'Zu wenig Geld.'};
  p.verhTermin=S.termin;
  if(rnd()<halteChance(p,stufe)){
    c.konto-=k; buchen(c,'Halteprämie '+p.name,-k);
    p.wechsel=false; delete p.wechselSeit; p.laune=Math.max(laune(p),W.laune.nachVerhandlung);
    return {ok:true, txt:`Einigung! ${p.name} bleibt. Halteprämie ${eur(k)} gezahlt.`};
  }
  launeSetzen(p,-5);
  return {ok:false, txt:`${p.name} lehnt ab und will weiterhin weg. Kein Geld gezahlt.`};
}
const stammAktiv = c => c.kader.filter(p=>p.versprechen).length;
const stammChance = p => clamp(W.laune.stamm.chance+(laune(p)-W.laune.wechselUnter)/200,0.05,0.9);
function stammGesperrt(c,p){
  const X=W.laune.stamm;
  if(!p.wechsel) return `${p.name} will gar nicht weg.`;
  if(p.stammBruch===S.saison) return `${p.name} glaubt dir diese Saison kein Versprechen mehr.`;
  if(stammAktiv(c)>=X.maxAktiv) return `Schon ${X.maxAktiv} Stammplätze versprochen. Mehr glaubt dir keiner.`;
  if(p.verhTermin===S.termin) return `${p.name} will erst nach dem nächsten Spiel wieder reden.`;
  return null;
}
function stammplatzVersprechen(c,pid){
  const X=W.laune.stamm, p=c.kader.find(x=>x.id===pid); if(!p) return {fehler:'Spieler nicht gefunden.'};
  const g=stammGesperrt(c,p); if(g) return {fehler:g};
  p.verhTermin=S.termin;
  if(rnd()<stammChance(p)){
    p.wechsel=false; delete p.wechselSeit; p.versprechen={rest:X.spiele};
    p.laune=Math.max(laune(p),X.zusage);
    if(!c.aufstellung.ids.includes(p.id)&&verfuegbar(p)) stammplaetzeEinbauen(c,c.aufstellung.formation,c.aufstellung.ids);
    return {ok:true, txt:`${p.name} nimmt dich beim Wort: Startelf in den nächsten ${X.spiele} Spielen.`};
  }
  launeSetzen(p,X.ablehnung);
  return {ok:false, txt:`${p.name} glaubt dir nicht und will weiterhin weg.`};
}
function launeNachSpiel(c,m,won,lost){
  const X=W.laune, heim=m.h===c.id, elf=new Set((heim?m.lh:m.la).filter(Boolean)), neu=[], stamm=[];
  const start=new Set(((heim?m.sh:m.sa)||(heim?m.lh:m.la)).filter(Boolean));
  for(const x of m.strafen) if(x.art==='gesperrt') elf.add(x.pid);
  // Wer gespielt hat, zählt als eingesetzt: Startelf, Eingewechselte (stehen am Ende in der Elf) und Ausgewechselte
  for(const id of start) elf.add(id);
  for(const id of ((m.raus&&m.raus[heim?0:1])||[])) elf.add(id);
  for(const p of c.kader){
    if(p.verletzt||p.gesperrt) continue;
    let d=elf.has(p.id)?X.startelf:X.bank;
    if(won) d+=X.sieg; else if(lost) d+=X.niederlage;
    launeSetzen(p,d+(60-laune(p))*X.rueck);
    if(p.versprechen){
      if(start.has(p.id)){ if(--p.versprechen.rest<=0){ delete p.versprechen; stamm.push({ok:true,name:p.name}); } }
      else { delete p.versprechen; p.stammBruch=S.saison; launeSetzen(p,X.stamm.bruch); p.wechsel=true; p.wechselSeit=S.termin; stamm.push({ok:false,name:p.name}); continue; }
    }
    if(!p.wechsel && !p.versprechen && laune(p)<X.wechselUnter && rnd()<X.wechselChance){ p.wechsel=true; p.wechselSeit=S.termin; neu.push(p.name); }
  }
  return {neu,stamm};
}
function wechselAbgaenge(c){
  const out=[];
  for(const p of c.kader.filter(x=>x.wechsel && (x.wechselSeit??0)<S.termin)){
    if(c.kader.length<=W.kaderMin){ out.push(`${p.name} will weg, aber der Kader ist zu klein. Er bleibt vorerst.`); continue; }
    const erl=Math.round(marktwert(p)*W.laune.abgangQuote);
    c.konto+=erl; buchen(c,'Abgang '+p.name,erl);
    c.kader=c.kader.filter(x=>x!==p);
    for(const k of ['wechsel','wechselSeit','verhTermin','bonusTermin','versprechen','stammBruch']) delete p[k];
    p.laune=W.laune.start; p.nivVon=niv(c); p.ligaVon=c.liga; S.frei.push(p);

}
// ---------- Vereinsanlagen ----------
const anlageStufe = (c,id) => (c.anlagen&&c.anlagen[id])||0;
const anlageWert = (c,id) => { const s=anlageStufe(c,id); return s?W.anlagen[id].w[s-1]:0; };
const anlageImBau = (c,id) => (c.anlagenBau||[]).find(b=>b.id===id);
// Laufende Werte der Anlagen wachsen mit den Einnahmen der Liga (Fans × Ticketpreis, Kreisklasse = 1), nicht mit dem Kostenfaktor lf.
// Mit lf wurden Anlagen nach Aufstiegen zur Schuldenfalle (Landesliga: Unterhalt ×8, Einnahmen nur ×3,6).
const untersteLiga = () => W.ligen.reduce((a,l)=>l.land==='DE'&&l.niveau>a.niveau?l:a);
const ertragsFaktor = c => { const D=L(c), K=untersteLiga(); return Math.max(1,(D.fans*D.ticket)/(K.fans*K.ticket)); };
// Baukosten, Unterhalt und Erträge der Anlagen wachsen alle mit demselben Faktor, damit eine Anlage in jeder Liga gleich viel taugt.
const anlageKosten = (c,id,stufe) => Math.round(W.anlagen[id].kosten[stufe-1]*ertragsFaktor(c)/10)*10;
const jtHandgeld = (c,T) => Math.round(T.handgeld*ertragsFaktor(c)/10)*10;
function anlagenUnterhalt(c){ return summe(Object.keys(W.anlagen).map(id=>{ const s=anlageStufe(c,id); return s?W.anlagen[id].unterhalt[s-1]:0; }))*ertragsFaktor(c); }
function anlageBauen(c,id){
  const A=W.anlagen[id]; if(!A) return 'Unbekannte Anlage.';
  if(anlageImBau(c,id)) return 'Wird schon gebaut.';
  const st=anlageStufe(c,id)+1; if(st>A.stufen.length) return 'Schon voll ausgebaut.';
  if(c.konto<0) return 'Konto im Minus: Bau gesperrt.';
  const k=anlageKosten(c,id,st); if(c.konto<k) return 'Zu wenig Geld.';
  c.konto-=k; buchen(c,'Bau '+A.stufen[st-1],-k);
  (c.anlagenBau=c.anlagenBau||[]).push({id,stufe:st,rest:A.bau[st-1]});
  return null;
}
const festKosten = c => { const st=anlageStufe(c,'buehne'); return st?Math.round(c.fans*W.fest.kosten[st-1]*L(c).ticket/3):0; };
const festSchluessel = () => S.saison+(S.termin<S.winterIdx?'h':'r');
function vereinsfest(c){
  const st=anlageStufe(c,'buehne'); if(!st) return {fehler:'Erst eine Bühne bauen.'};
  if(c.festKey===festSchluessel()) return {fehler:'In dieser Halbserie gab es schon ein Vereinsfest.'};
  const F=W.fest, tq=L(c).ticket/3, kosten=festKosten(c);
  if(c.konto<kosten) return {fehler:'Zu wenig Geld für das Fest.'};
  const einnahmen=Math.round(c.fans*W.anlagen.buehne.w[st-1]*tq*(0.85+rnd()*0.3));
  c.konto+=einnahmen-kosten; buchen(c,'Vereinsfest: Organisation',-kosten); buchen(c,'Vereinsfest: Einnahmen',einnahmen);
  const neu=Math.round(c.fans*F.fans[st-1]); c.fans+=neu;
  for(const p of c.kader) launeSetzen(p,F.laune[st-1]);
  c.festKey=festSchluessel();
  return {txt:`Vereinsfest! ${eur(einnahmen)} eingenommen, ${eur(kosten)} Kosten, ${zahl(neu)} neue Fans. Die Mannschaft feiert mit.`};
}

// Familienduelle: jedes Pflichtspiel zwischen zwei menschlichen Vereinen, aus Sicht der Personen (Index in S.manager)
function familienduelleEintragen(spiele){
  for(const m of spiele){ const H=S.clubs[m.h], A=S.clubs[m.a]; if(H.human<0||A.human<0) continue;
    (S.duelle=S.duelle||[]).push({saison:S.saison, label:m.label, h:H.human, a:A.human, th:m.th, ta:m.ta, ie:m.ie||null, weiter:m.sieger!=null?S.clubs[m.sieger].human:null}); }
}
// Bilanz von Person i gegen Person j: Siege/Remis/Niederlagen nach 90 Minuten (Elfmeterschießen zählt als Remis)
function duellBilanz(i,j){
  const b={s:0,u:0,n:0,tg:0,tgg:0,liste:[],hoch:null};
  for(const d of S.duelle||[]){
    if(!((d.h===i&&d.a===j)||(d.h===j&&d.a===i))) continue;
    const ich=d.h===i, e=ich?d.th:d.ta, g=ich?d.ta:d.th;
    b.tg+=e; b.tgg+=g; if(e>g) b.s++; else if(e<g) b.n++; else b.u++;
    const x={...d,e,g}; b.liste.push(x);
    if(e!==g&&(!b.hoch||Math.abs(e-g)>Math.abs(b.hoch.e-b.hoch.g)||(Math.abs(e-g)===Math.abs(b.hoch.e-b.hoch.g)&&e+g>b.hoch.e+b.hoch.g))) b.hoch=x;
  }
  return b;
}
